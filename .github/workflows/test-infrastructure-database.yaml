---
# yamllint disable rule:line-length
name: test-infrastructure-database

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-database.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/infra-database/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/database-core/**'
    - '!infrastructure/subsystems/database-core/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-database:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@1e8ca1b00b6e69bdf5aef8b33111c594c051ff65 # v4.4.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-database
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Single node. Three kind nodes on one 4-vCPU runner add two more kubelets, kube-proxies and
      # containerd instances without adding capacity -- they are containers sharing the same CPUs.
      #
      # Measured by dispatching this suite's single-node and multi-node arms at the same instant,
      # four times: job total 312s against 339s (-8.0%), faster in 3 of 4 pairs, and the spread
      # narrows sharply (sd 38.7s -> 12.7s).
      #
      # `kind create` is NOT the lever it looks like: paired over 26 runs it is worth ~2s and is
      # not significant. An unpaired comparison of historical runs says 4.0s and is confounded by
      # which suites happen to be single-node. The saving here is the phase where pods converge.
      #
      # Audited 2026-08-15 and nothing here needs a second node. Asked of the charts, not just
      # the checked-in YAML: the cloudnative-pg operator, the Barman Cloud plugin and the
      # dragonfly operator all render one replica with no affinity; every test Cluster is
      # instances: 1 and the test Dragonfly is replicas: 1. The restore case is a sequential
      # generation rotation within one namespace, which is node-agnostic. No DaemonSets.
      kind_config: .github/kind-cluster-single-node.yaml
      # See the equivalent note in test-infrastructure-observability.yaml. This suite has
      # the highest ceiling utilisation in the repo (p90 0.53) before any change, and its
      # minio reconcile budget has gone 3m -> 5m, so it has the least margin to give.
      timeout: 25
