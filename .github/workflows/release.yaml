---
# yamllint disable rule:line-length
name: release

on:
  pull_request:
    paths:
    - '.github/workflows/release.yaml'
    - 'release-please-config.json'
  push:
    branches:
    - main
    paths:
    - 'apps/**'
    - 'components/**'
    - 'infrastructure/**'
    - '.release-please-manifest.json'
    - 'release-please-config.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    uses: ppat/github-workflows/.github/workflows/release-please.yaml@306984d6896feefa14471d2701d1ddd00bca12f2 # v8.3.0
    with:
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets:
      app_client_id: ${{ secrets.HOMELAB_BOT_CLIENT_ID }}
      app_private_key: ${{ secrets.HOMELAB_BOT_APP_PRIVATE_KEY }}
