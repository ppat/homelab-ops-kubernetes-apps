---
# yamllint disable rule:line-length
name: release

on:
  pull_request:
    paths:
    - '.github/workflows/release.yaml'
    - 'release-please-config.json'
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    uses: ppat/github-workflows/.github/workflows/release-please.yaml@e95dcb3a80a8e832d6ab2749d0e36329641c72b9 # v8.5.0
    with:
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets:
      app_client_id: ${{ secrets.HOMELAB_BOT_CLIENT_ID }}
      app_private_key: ${{ secrets.HOMELAB_BOT_APP_PRIVATE_KEY }}
