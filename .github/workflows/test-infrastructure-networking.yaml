---
# yamllint disable rule:line-length
name: test-infrastructure-networking

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-networking.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/infra-networking/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/networking-core/**'
    - 'infrastructure/subsystems/networking-extra/**'
    - '!infrastructure/subsystems/networking-core/**.md'
    - '!infrastructure/subsystems/networking-extra/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-networking:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-networking
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      kind_config: .github/kind-cluster-single-node.yaml
      # See the note in test-infrastructure-security.yaml. Here it is external-dns-pihole at
      # 2m -> 5m: reached ~285s in, so a failure now lands at ~585s and the catch block
      # follows it, against a 15m default that was sized when nothing here exceeded 2m.
      timeout: 25
