---
# yamllint disable rule:line-length
name: test-apps-downloaders

on:
  pull_request:
    paths:
    - '.github/workflows/test-apps-downloaders.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/apps-downloaders/**'
    - 'ci/test/chainsaw/**'
    - 'apps/subsystems/downloaders/**'
    - '!apps/subsystems/downloaders/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps-downloaders:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@1e8ca1b00b6e69bdf5aef8b33111c594c051ff65 # v4.4.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/apps-downloaders
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Three nodes bought this suite one thing: three independent kubelet pull queues for its
      # eleven distinct arr images, none of which is duplicated across nodes. Measured
      # 2026-08-16 over 12 paired dispatches per arm, that was worth +11.4s on the
      # latest-finishing pull (t=+3.24, 10 of 12 pairs) -- which is why an earlier audit found
      # single node 27.0s SLOWER and kept the third node. Parallel pulls (see
      # .github/kind-cluster-single-node.yaml) remove the queue entirely, and with it the
      # difference: one node vs three is then +0.2s on the latest-finishing pull (t=0.22) and
      # -0.7s on the validate phase (t=-0.26), against a per-pair sd that would need ~1100
      # pairs to resolve. Two node containers and their duplicated system images come off a
      # 4-vCPU runner for nothing measurable. Reverting is this line.
      kind_config: .github/kind-cluster-single-node.yaml
