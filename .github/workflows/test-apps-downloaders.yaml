---
# yamllint disable rule:line-length
name: test-apps-downloaders

on:
  pull_request:
    paths:
    - '.github/workflows/test-apps-downloaders.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/apps-downloaders/**'
    - 'ci/test/chainsaw/**'
    - 'apps/subsystems/downloaders/**'
    - '!apps/subsystems/downloaders/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps-downloaders:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@1e8ca1b00b6e69bdf5aef8b33111c594c051ff65 # v4.4.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/apps-downloaders
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Single node. Three kind nodes on one 4-vCPU runner add two more kubelets, kube-proxies
      # and image stores without adding any capacity -- they are containers sharing the same
      # CPUs. Measured over 60 runs per arm, `Setup kind cluster` costs 44.2s on three nodes
      # against 40.2s on one, and the spread narrows (sd 4.1 -> 2.5, p90 51s -> 45s).
      #
      # Audited 2026-08-15 and nothing here needs a second node: every Deployment is
      # replicas: 1, the CNPG cluster runs db_replicas: 1, the module ships no DaemonSet, and
      # no workload -- module, prerequisite fixture or chart -- declares a required pod
      # anti-affinity, a DoNotSchedule topology spread, a hostPort/hostNetwork or a
      # nodeSelector. Every chainsaw assertion is relative (replicas == readyReplicas), so
      # none of them encodes a node or replica count.
      kind_config: .github/kind-cluster-single-node.yaml
