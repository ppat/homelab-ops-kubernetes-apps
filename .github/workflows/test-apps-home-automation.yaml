---
# yamllint disable rule:line-length
name: test-apps-home-automation

on:
  pull_request:
    paths:
    - '.github/workflows/test-apps-home-automation.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/apps-home-automation/**'
    - 'ci/test/chainsaw/**'
    - 'apps/subsystems/home-automation/**'
    - '!apps/subsystems/home-automation/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps-home-automation:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@54ce2e4ac00927d6164d032b321f0142aab01c69 # v6.1.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/apps-home-automation
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Single node. Three kind nodes on one 4-vCPU runner add two more kubelets, kube-proxies and
      # containerd instances without adding capacity -- they are containers sharing the same CPUs.
      #
      # Measured by dispatching this suite's single-node and multi-node arms at the same instant,
      # six times: job total 245s against 249s, which is a tie (t=-0.17). What does move is the
      # spread -- sd 55.5s -> 17.8s -- because the multi-node arm occasionally lands in the slow
      # prerequisite mode and the single-node arm did not. The case for one node here is variance
      # and hygiene, not seconds off the mean; do not claim a mean saving for it.
      #
      # `kind create` is NOT the lever it looks like: paired over 26 runs it is worth ~2s and is
      # not significant. An unpaired comparison of historical runs says 4.0s and is confounded by
      # which suites happen to be single-node.
      #
      # Audited 2026-08-15 and nothing here needs a second node: every Deployment is
      # replicas: 1, the CNPG cluster runs db_replicas: 1, the module ships no DaemonSet, and
      # no workload -- module, prerequisite fixture or chart -- declares a required pod
      # anti-affinity, a DoNotSchedule topology spread, a hostPort/hostNetwork or a
      # nodeSelector. Every chainsaw assertion is relative (replicas == readyReplicas), so
      # none of them encodes a node or replica count.
      kind_config: .github/kind-cluster-single-node.yaml
