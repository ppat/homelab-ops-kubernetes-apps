---
# yamllint disable rule:line-length
name: diff-changes

on:
  pull_request:
    branches: ["main"]
    paths:
    - '.github/workflows/diff-changes.yaml'
    - 'ci/test/diff-changes.krmignore'
    - 'apps/**/*.yaml'
    - 'ci/**/*.yaml'
    - 'components/**/*.yaml'
    - 'infrastructure/**/*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@bd0f4ff0d64b30c217a45bf3fbdc530c06bb5586 # v9.0.0
    with:
      # yamllint disable-line rule:indentation
      files: |
        .github/workflows/diff-changes.yaml
        ci/test/diff-changes.krmignore
        apps/**/*.yaml
        ci/**/*.yaml
        components/**/*.yaml
        infrastructure/**/*.yaml
      git_ref: ${{ github.head_ref || github.ref }}

  # Each ci/test/<module> directory is its own independent flate scan root (see
  # the per-module `diff` job below), so figure out here which modules a given PR
  # actually touches - either directly (ci/test/<module>/**) or indirectly, through
  # the module's real manifests that its ci/test Kustomization renders
  # (apps/subsystems/<x> -> apps-<x>, infrastructure/subsystems/<x>-core|-extra ->
  # infra-<x>). Anything broader (the workflow itself, or a `components/*` consumed
  # by an arbitrary/varying set of modules via spec.components) falls back to testing
  # every module, since it can't be attributed to a single one cheaply/reliably. The same
  # goes for ci/test/diff-changes.krmignore, which shapes every module's scan root.
  #
  # A module suite is recognised by being named after its module (apps-*/infra-*) rather
  # than by not appearing on a list of exceptions. ci/test also holds directories with no
  # Flux objects in them at all - the shared chainsaw harness, and assertion-semantics,
  # which asserts on bare ConfigMaps - and they have no module diff to report.
  affected-modules:
    needs: [detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      modules: ${{ steps.extract-modules.outputs.modules }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Extract affected modules
      id: extract-modules
      env:
        CHANGED_FILES: ${{ fromJSON(needs.detect-changes.outputs.results).all_changed_files }}
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        if echo "${CHANGED_FILES}" | tr ' ' '\n' | grep -qE '^(\.github/workflows/diff-changes\.yaml|ci/test/diff-changes\.krmignore|components/)'; then
          echo "Broad change detected (workflow or shared component) - testing all modules..."
          mapfile -t modules < <(find ci/test -mindepth 1 -maxdepth 1 -type d \( -name 'apps-*' -o -name 'infra-*' \) -printf '%f\n' | sort)
        else
          echo "Testing modules affected by changed files..."
          mapfile -t modules < <(echo "${CHANGED_FILES}" | tr ' ' '\n' | awk -F/ '
            $1 == "ci" && $2 == "test" && $3 ~ /^(apps|infra)-/ { print $3 }
            $1 == "apps" && $2 == "subsystems" { print "apps-" $3 }
            $1 == "infrastructure" && $2 == "subsystems" { sub(/-core$/, "", $3); sub(/-extra$/, "", $3); print "infra-" $3 }
          ' | sort -u)
        fi

        if [[ "${#modules[@]}" -eq 0 ]]; then
          echo "modules=[]" >> "${GITHUB_OUTPUT}"
        else
          printf '%s\n' "${modules[@]}" | jq -R . | jq -s -c . > /tmp/modules.json
          echo "modules=$(cat /tmp/modules.json)" >> "${GITHUB_OUTPUT}"
        fi
        cat "${GITHUB_OUTPUT}"

  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [affected-modules]
    if: ${{ needs.affected-modules.outputs.modules != '[]' }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.affected-modules.outputs.modules) }}

    steps:
    - name: Flux Diff
      id: flux-diff
      uses: ppat/homelab-ops-actions/actions/flux-diff@b243512e70e84044d607787b1f482881906b0f01 # v3.0.0
      with:
        log_level: DEBUG
        # One run renders the whole graph, so `all` reports Kustomization and Helm output
        # together, and Helm flags apply to both.
        other_params: --api-versions monitoring.coreos.com/v1
        krmignore: ci/test/diff-changes.krmignore
        path_after: ci/test/${{ matrix.module }}
        path_before: ci/test/${{ matrix.module }}
        resource_type: all
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on PR w/ diff
      uses: ppat/homelab-ops-actions/actions/comment-on-pr@66ed3b99f806f50f4e623d3d346f4ba37505ec68 # v2.12.0
      if: ${{ steps.flux-diff.outputs.diff != '' }}
      continue-on-error: true
      with:
        message: |
          `````diff
          ${{ steps.flux-diff.outputs.diff }}
          `````
        message_id: "${{ github.event.pull_request.number }}/${{ matrix.module }}"
        token: ${{ secrets.GITHUB_TOKEN }}
