---
# yamllint disable rule:line-length
name: test-infrastructure-security

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-security.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/infra-security/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/security-core/**'
    - 'infrastructure/subsystems/security-extra/**'
    - '!infrastructure/subsystems/security-core/**.md'
    - '!infrastructure/subsystems/security-extra/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-security:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-security
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Single node. Three kind nodes on one 4-vCPU runner add two more kubelets, kube-proxies and
      # containerd instances without adding capacity -- they are containers sharing the same CPUs.
      #
      # Measured by dispatching this suite's single-node and multi-node arms at the same instant,
      # four times: job total 354s against 396s (-10.5%), faster in 4 of 4 pairs, and the spread
      # collapses (sd 64.2s -> 17.1s) -- the largest variance reduction of the five suites audited.
      #
      # `kind create` is NOT the lever it looks like: paired over 26 runs it is worth ~2s and is
      # not significant. An unpaired comparison of historical runs says 4.0s and is confounded by
      # which suites happen to be single-node.
      #
      # Audited 2026-08-15 and nothing here needs a second node, including the two multi-replica
      # workloads that prompted the question. Rendering kyverno 3.8.2 and authentik 2026.5.6
      # with this repo's own values shows both use podAntiAffinity
      # preferredDuringSchedulingIgnoredDuringExecution only -- no required term, no
      # topologySpreadConstraints -- so kyverno's 3 admission + 2 background replicas and
      # authentik's 3 server replicas all schedule on one node. Both PDBs (minAvailable 2 and
      # 1) are satisfied there, and the assertions check readiness, never placement.
      #
      # What single-node gives up is real but not asserted today: a chart regression that made
      # either anti-affinity *required* would strand replicas here and no longer be caught.
      kind_config: .github/kind-cluster-single-node.yaml
      # The job ceiling has to stay clear of the sum of the chainsaw budgets it bounds. A run
      # killed by this ceiling emits no chainsaw catch dump at all, which is strictly worse
      # than the named assertion failure it replaces -- and it becomes reachable exactly when
      # the runner is loaded, which is when the diagnosis matters. This suite's worst case
      # moved most: authentik-server went 3m -> 6m, and a failure there is reached ~310s in,
      # leaving under a minute of the old 15m once the catch block has run.
      timeout: 25
