---
# yamllint disable rule:line-length
name: test-apps-obsidian-vault

on:
  pull_request:
    paths:
    - '.github/workflows/test-apps-obsidian-vault.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/apps-obsidian-vault/**'
    - 'ci/test/chainsaw/**'
    - 'apps/subsystems/obsidian-vault/**'
    - '!apps/subsystems/obsidian-vault/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps-obsidian-vault:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/apps-obsidian-vault
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # No `timeout`, so the reusable workflow's own default applies. This suite stands up no
      # database and no cache -- cert-manager and external-secrets are its only operator
      # fixtures. Declare one only from a measured run, never from a prediction about image
      # size; that prediction has been wrong here before (see the ordering comment in
      # ci/test/apps-obsidian-vault/chainsaw-test.yaml). Note that a declared ceiling is also
      # read by ci/scripts/baseline-plan.sh and carried into the scheduled baseline.
      kind_config: .github/kind-cluster-single-node.yaml
