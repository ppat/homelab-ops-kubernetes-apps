---
# yamllint disable rule:line-length
name: test-infrastructure-storage

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-storage.yaml'
    - '.github/kind-cluster-multi-node.yaml'
    - 'ci/test/infra-storage/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/storage-core/**'
    - '!infrastructure/subsystems/storage-core/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-storage:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@1e8ca1b00b6e69bdf5aef8b33111c594c051ff65 # v4.4.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-storage
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      kind_config: .github/kind-cluster-multi-node.yaml
      # The job ceiling has to stay clear of the sum of the chainsaw budgets it bounds. A run
      # killed by this ceiling emits no chainsaw catch dump at all, which is strictly worse
      # than the named assertion failure it replaces -- and it becomes reachable exactly when
      # the runner is loaded, which is when the diagnosis matters. Here the budgets that moved
      # are the external-secrets reconcile (3m -> 5m) and csi-attacher (1m -> 3m), either of
      # which puts a failing run within about three quarters of the old 15m default once the
      # catch block has run.
      timeout: 25
