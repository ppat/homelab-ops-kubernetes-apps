---
# yamllint disable rule:line-length
name: test-infrastructure-storage

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-storage.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/infra-storage/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/storage-core/**'
    - '!infrastructure/subsystems/storage-core/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-storage:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@1e8ca1b00b6e69bdf5aef8b33111c594c051ff65 # v4.4.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-storage
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      # Single node, and the reason is reliability rather than speed.
      #
      # This suite was held at three nodes on the belief that longhorn requires them. It does
      # not: on one node the suite passes green, every longhorn pod is Ready, and the test
      # volume simply runs degraded -- which is why numberOfReplicas in test-pvc.yaml is now 1.
      #
      # Measured over 8 paired dispatches (both arms started within ~2s of each other): one node
      # is 26s faster (-9.5%), single winning 5 of 6 comparable pairs, t=-2.0 -- sign-consistent
      # but short of the significance bar this work uses, so speed alone would not justify the
      # change. Essentially all of the delta is inside the chainsaw phase; `kind create` is worth
      # about 3s and is inside the noise.
      #
      # What justifies it: the three-node arm failed 1 of 8 and the single-node arm 0 of 8, and
      # the failure was #3643 -- three longhorn-manager pods initialising concurrently, colliding
      # on the same Setting's resourceVersion, and the losers calling log.Fatal. That race needs
      # at least two manager pods, so one node does not make it rarer; it makes it impossible.
      #
      # What this gives up: replica placement across nodes is no longer exercised. That is
      # deliberate -- a kind cluster's topology resembles no real cluster's, so asserting it here
      # would produce a green that means nothing, and it is upstream's property to test. What the
      # suite is for is that OUR installation is configured correctly and can do its job. See
      # #3718 for the real limit on that: attach/mount cannot be tested in kind at all today.
      kind_config: .github/kind-cluster-single-node.yaml
      # The job ceiling has to stay clear of the sum of the chainsaw budgets it bounds. A run
      # killed by this ceiling emits no chainsaw catch dump at all, which is strictly worse
      # than the named assertion failure it replaces -- and it becomes reachable exactly when
      # the runner is loaded, which is when the diagnosis matters. Here the budgets that moved
      # are the external-secrets reconcile (3m -> 5m) and csi-attacher (1m -> 3m), either of
      # which puts a failing run within about three quarters of the old 15m default once the
      # catch block has run.
      timeout: 25
