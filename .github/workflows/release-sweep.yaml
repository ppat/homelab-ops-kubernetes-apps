---
# yamllint disable rule:line-length
#
# Auto-lands the release-please PRs a human click adds nothing to. The reusable action owns the
# guards; this workflow owns when each component selector runs and which components remain manual.
# A non-breaking release with all checks green and no hold label lands; anything breaking, first,
# held, conflicting, or doubtful waits for the maintainer. OPERATIONS.md "Release Process"
# documents the operator's view.
#
# SCHEDULE
# One weekly sweep per component selector, each handling every eligible PR it selects in one run:
#   apps-* modules  -> Wednesdays 00:00 UTC
#   infra-* modules -> Sundays   12:00 UTC
# Batch merging in a single run is evidenced: release-please's release phase picks up all
# merged-but-untagged release PRs together (observed at batch size 5 automated -- with the
# intermediate release.yaml runs cancelled by its concurrency group and the final run cutting
# every tag -- and at up to 16 in historical manual merge sittings; 906/906 releases tagged).
#
# WHY A SCHEDULED DIRECT MERGE AND NOT `allow_auto_merge`
# The setting is repo-wide: enabling it would activate Renovate's platformAutomerge and
# downgrade the bot gate from all-checks to required-contexts-only, letting a PR with a red
# non-required check land (measured live on #3804: suite FAILURE, all four required contexts
# green). A scheduled sweep gates on whatever it is told to gate on, and the setting stays
# false. See session note 57 §3/§A0.
#
# WHY THE APP TOKEN AND NOT GITHUB_TOKEN
# The tag is cut by release.yaml reacting to the merge's PUSH event. Pushes made with a
# workflow's own GITHUB_TOKEN do not trigger workflows, so a GITHUB_TOKEN merge would leave
# releases permanently untagged. App-token pushes do trigger it (observed: release.yaml runs
# triggered by the renovate bot's merges).
name: release-sweep

on:
  pull_request:
    paths:
    - '.github/workflows/release-sweep.yaml'
  schedule:
  # Wednesdays 00:00 UTC: apps-* components. Sundays 12:00 UTC: infra-* components.
  - cron: '0 0 * * 3'
  - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      component_selector:
        description: 'Release-please component selector'
        required: true
        default: '^infra-'
        type: choice
        options: ['^apps-', '^infra-']
      dry_run:
        description: 'Evaluate and report every decision, merge nothing'
        required: true
        default: false
        type: boolean

concurrency:
  # Never two sweeps at once (double-merge protection); never cancel one mid-merge.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-24.04
    # A sweep run that hangs must not hold the concurrency group for the 6h default.
    timeout-minutes: 15
    permissions:
      # For the checkout only. Everything the script does uses the app token.
      contents: read
    steps:
    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.HOMELAB_BOT_APP_ID }}
        private-key: ${{ secrets.HOMELAB_BOT_APP_PRIVATE_KEY }}
        # The two permissions a squash merge needs, and nothing else. The script's other API
        # calls (PR list, check runs, commit status) are reads of a public repo and need no
        # grant.
        permission-contents: write
        permission-pull-requests: write
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        # Full history: the staleness guard walks parent..origin/main per module path.
        fetch-depth: 0
        # The script's later `git fetch` of release-please branches is an anonymous read of
        # a public repo; no credential needs to persist for it.
        persist-credentials: false
    - name: Sweep release PRs
      uses: ppat/homelab-ops-actions/actions/release-sweep@f66c9acb40309305e0e1fd3179406b85647aa54c # v2.3.2
      with:
        token: ${{ steps.app-token.outputs.token }}
        # Pull-request runs exercise the action safely. Scheduled runs stay live; dispatches
        # choose whether to dry-run.
        dry_run: ${{ github.event_name == 'pull_request' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) || 'false' }}
        component_selector: ${{ (github.event_name == 'pull_request' && '.*') || (github.event_name == 'workflow_dispatch' && inputs.component_selector) || (github.event.schedule == '0 0 * * 3' && '^apps-') || (github.event.schedule == '0 12 * * 0' && '^infra-') || '' }}
        manual_components: 'infra-storage-core infra-networking-core infra-security-core'
