---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**
        alloy:
        - '**/*.alloy'
        - ci/scripts/alloy-lint.sh
        - ci/scripts/alloy-lint-version.yaml
        - .github/workflows/lint.yaml
        # the bootstrap-CRD gate's inputs: the bundle it checks, its script, and this
        # file, which carries its trigger -- so any change to the gate is exercised by
        # the PR that makes it, at the cost of running on workflow-only PRs.
        bootstrap_crds:
        - infrastructure/bootstrap/crds/**
        - ci/scripts/verify-bootstrap-crds.sh
        - .github/workflows/lint.yaml
        kubernetes:
        - 'apps/**/*.yaml'
        - 'ci/**/*.yaml'
        - 'components/**/*.yaml'
        - 'infrastructure/**/*.yaml'
        markdown:
        - '**.md'
        - '!**/CHANGELOG.md'
        renovate:
        - .github/renovate.json
        - .github/renovate/**
        shellscripts:
        - '**.sh'
        yaml:
        - '**.yaml'
      git_ref: ${{ github.head_ref || github.ref }}

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref }}
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      from: ${{ github.event.pull_request.head.sha || 'HEAD' }}~${{ github.event.pull_request.commits || '1' }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  # WHY THIS JOB EXISTS
  # Nothing this repository can emit automatically may be a commit header its own
  # commitlint config would reject. Renovate and release-please COMPILE headers from
  # configuration; commitlint only ever sees headers that already exist. So nothing
  # in the pipeline compares the two, and a config able to emit an out-of-enum scope
  # stays green until the bot actually opens that PR. This job generates the emittable
  # set -- Renovate over the current package occupancy, plus release-please's PR-title
  # pattern -- and lints every header in it against commitlint.config.js.
  #
  # The usual way the gap opens is NOT a bad edit to commitlint.config.js. It is adding
  # a module or a component and forgetting to update commitlint.config.js and
  # release-please-config.json, because the Renovate scopes are TEMPLATED
  # ("apps-{{dir}}"): the emittable set is a function of REPO STATE, so a new directory
  # with a manifest in it mints a new scope with no config edit anywhere and nothing for
  # commitlint to catch. Renaming or moving a package does the same in reverse.
  #
  # WHY IT IS UNGATED
  # Deliberately NOT gated on detect-changes. The check's input includes package
  # occupancy read from `git ls-files`, so any path in the repo can change its answer;
  # path-gating it on commitlint.config.js / release-please-config.json / .github/renovate
  # would skip precisely the case above -- the one it exists to catch. It costs seconds.
  #
  # The self-test runs FIRST: it injects known-bad cells and templates and fails unless
  # every one is caught, so the zero-defect verdict comes from a checker that has just
  # demonstrated it can see defects.
  #
  # Maintenance: ci/scripts/commit-taxonomy/README.md.
  commit-taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # renovate: datasource=npm depName=bun
      BUN_VERSION: "1.4.0"
      # renovate: datasource=node-version depName=node
      NODE_VERSION: "24.19.0"
    steps:
    # commitlint and its plugin come from this repo's committed package.json + bun.lock,
    # installed with a bun supplied by mise. The versions are Renovate-managed there
    # (chore(internal-dependencies)); nothing is installed ad hoc. The same manifest is
    # what the commit-messages job above resolves, so this check and the gate it predicts
    # run the same commitlint.
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@9c16506c3c527478b6314c86ca961c0011d9f94a # v2.2.0
      with:
        current_fetch_depth: 1
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        # yamllint disable-line rule:indentation
        mise_toml: |
          [tools]
          bun               = "${{ env.BUN_VERSION }}"
          node              = "${{ env.NODE_VERSION }}"
          [settings.npm]
          bun               = true

    - name: Install node packages
      shell: bash
      working-directory: ./current
      run: bun install --frozen-lockfile

    - name: Self-test (injected defects must be caught)
      shell: bash
      working-directory: ./current
      run: node ci/scripts/commit-taxonomy/verify-commit-taxonomy.mjs --self-test

    - name: Verify emission closure against commitlint
      shell: bash
      working-directory: ./current
      run: node ci/scripts/commit-taxonomy/verify-commit-taxonomy.mjs

  alloy:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).alloy_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    # Whether this job runs at all is gated by detect-changes (above), scoped to a
    # broad **/*.alloy glob plus this gate's own inputs (alloy-lint.sh, the version
    # pin, this workflow file) so a change to the gate is always exercised by the PR
    # that makes it. What it checks once running is a separate concern: each step
    # below still discovers every *.alloy file in the repo via git ls-files, not just
    # the changed ones -- alloy validate operates on a directory as one merged unit
    # (see ci/scripts/alloy-lint.sh), so a partial file list produces false
    # "component does not exist" errors for cross-file references.
    - name: alloy fmt --test
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        mapfile -t files < <(git ls-files -- '*.alloy')
        ./ci/scripts/alloy-lint.sh fmt-check "${files[@]}"

    - name: alloy validate
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        mapfile -t files < <(git ls-files -- '*.alloy')
        ./ci/scripts/alloy-lint.sh validate "${files[@]}"

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  bootstrap-crds:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).bootstrap_crds_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    # The bundle's kind filter is a denylist -- kustomize targets cannot express "any kind
    # except CustomResourceDefinition" -- so it fails open, and nothing else builds the bundle
    # (kubeconform excludes it, no suite consumes it): an escaped kind would first appear when
    # an operator applies it during disaster recovery. Self-test runs first so the verdict comes
    # from a checker that has just shown it can see an escape. Gated on the bundle's own inputs;
    # the scheduled run builds unconditionally, which is what catches an upstream re-tagging a
    # release under a pinned URL.
    - name: Verify the bundle emits only CRDs
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        ./ci/scripts/verify-bootstrap-crds.sh --self-test
        ./ci/scripts/verify-bootstrap-crds.sh

  kubernetes-manifests:
    needs: [detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Select files for validation
      id: select-files
      env:
        K8S_MANIFESTS_CHANGED: ${{ fromJSON(needs.detect-changes.outputs.results).kubernetes_any_changed == 'true' }}
        GITHUB_ACTIONS_CHANGED: ${{ fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
        CHANGED_K8S_MANIFESTS: ${{ github.event_name == 'pull_request' && fromJSON(needs.detect-changes.outputs.results).kubernetes_all_changed_files || '' }}
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          if [[ "${K8S_MANIFESTS_CHANGED}" == "true" ]]; then
            if [[ -n "$CHANGED_K8S_MANIFESTS" ]]; then
              echo "Performing linting on k8s manifests that have changed..."
              # Convert space-delimited string to a JSON array string
              echo "$CHANGED_K8S_MANIFESTS" | tr ' ' '\n' | jq -R . | jq -s -c . > /tmp/files.json
              echo "files_json=$(cat /tmp/files.json)" >> "${GITHUB_OUTPUT}"
              echo "validate_k8s_manifests=true" >> "${GITHUB_OUTPUT}"
            else
              echo "Skipping linting as no k8s manifests have changed..."
              echo "files_json=[]" >> "${GITHUB_OUTPUT}"
              echo "validate_k8s_manifests=false" >> "${GITHUB_OUTPUT}"
            fi
          elif [[ "${GITHUB_ACTIONS_CHANGED}" == "true" ]]; then
            echo "Performing linting on k8s manifests as github actions have changed (i.e. possible updates to actions)..."
            echo "files_json=[]" >> "${GITHUB_OUTPUT}"
            echo "validate_k8s_manifests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Skipping linting as neither k8s manifests nor github actions have changed..."
            echo "files_json=[]" >> "${GITHUB_OUTPUT}"
            echo "validate_k8s_manifests=false" >> "${GITHUB_OUTPUT}"
          fi
        else
          echo "Performing k8s manifests validation on ${GITHUB_EVENT_NAME}..."
          echo "files_json=[]" >> "${GITHUB_OUTPUT}"
          echo "validate_k8s_manifests=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Validate Kubernetes Manifests
      if: ${{ steps.select-files.outputs.validate_k8s_manifests == 'true' }}
      uses: ppat/validate-kubernetes-manifests@8d0eab3c27c0170576d933dc3da164f9fc56fd72 # v0.1.12
      with:
        files: ${{ steps.select-files.outputs.files_json }}
        pkg-include: '["apps/*","infrastructure/*", "ci/test/*"]'
        pkg-exclude: '["components/*",".archive/*","infrastructure/bootstrap/crds/*"]'
        # Grafana: the ESO generator kind (generators.external-secrets.io/v1alpha1). The
        # datreeio CRDs-catalog schema kubeconform resolves predates spec.serviceAccount.
        # secondsToLive and rejects it, but the CRD bundle we actually install
        # (see infrastructure/bootstrap/crds/external-secrets) does define the field.
        # Keep in sync with .pre-commit-config.yaml. Drop this skip once the catalog
        # catches up.
        kubeconform-flags: '-skip=Secret,IPAddressPool,Grafana'
        env-file: 'ci/validation/.env'
        base-kustomization-file: 'ci/validation/kustomization.yaml'

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  shellcheck:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).shellscripts_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-shellcheck.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).shellscripts_all_changed_files }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}

  zizmor:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-zizmor.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
