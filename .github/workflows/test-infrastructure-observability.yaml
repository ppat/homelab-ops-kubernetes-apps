---
# yamllint disable rule:line-length
name: test-infrastructure-observability

on:
  pull_request:
    paths:
    - '.github/workflows/test-infrastructure-observability.yaml'
    - '.github/kind-cluster-multi-node.yaml'
    - 'ci/test/infra-observability/**'
    - 'ci/test/chainsaw/**'
    - 'infrastructure/subsystems/observability-core/**'
    - 'infrastructure/subsystems/observability-extra/**'
    - '!infrastructure/subsystems/observability-core/**.md'
    - '!infrastructure/subsystems/observability-extra/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-infrastructure-observability:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@54ce2e4ac00927d6164d032b321f0142aab01c69 # v6.1.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/infra-observability
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      kind_config: .github/kind-cluster-multi-node.yaml
      # The job ceiling has to stay clear of the sum of the chainsaw budgets it bounds, and
      # this suite's were re-sized from measurement and roughly doubled on the critical
      # path. A run killed by this ceiling emits no chainsaw catch dump at all, which is a
      # strictly worse outcome than the named assertion failure it replaces - so the margin
      # matters more than the number. Green runs are ~376s and unaffected either way.
      timeout: 25
