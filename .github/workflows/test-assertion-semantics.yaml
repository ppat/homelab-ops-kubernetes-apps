---
# yamllint disable rule:line-length
name: test-assertion-semantics

on:
  pull_request:
    paths:
    # Deliberately includes this workflow's own path. chainsaw's matching semantics are pinned
    # by CHAINSAW_VERSION inside ppat/github-workflows, which reaches this repo only as a
    # Renovate bump of the `uses:` sha below -- so that bump is the event this suite must run
    # on, and the self-path filter is what makes it run on it.
    - '.github/workflows/test-assertion-semantics.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/assertion-semantics/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-assertion-semantics:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@54ce2e4ac00927d6164d032b321f0142aab01c69 # v6.1.0
    with:
      # github.ref_name rather than github.ref: bare branch name on every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/assertion-semantics
      # not the shared ci/test/chainsaw config -- see the header of that file for why
      chainsaw_config: ./ci/test/assertion-semantics/.chainsaw.yaml
      kind_config: .github/kind-cluster-single-node.yaml
      timeout: 10
