---
# yamllint disable rule:line-length
name: test-apps-ai

on:
  pull_request:
    paths:
    - '.github/workflows/test-apps-ai.yaml'
    - '.github/kind-cluster-single-node.yaml'
    - 'ci/test/apps-ai/**'
    - 'ci/test/chainsaw/**'
    - 'apps/subsystems/ai/**'
    - '!apps/subsystems/ai/**.md'
    - '!ci/test/chainsaw/**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps-ai:
    uses: ppat/github-workflows/.github/workflows/chainsaw-test.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      # github.head_ref is only set on pull_request events; on workflow_dispatch/push
      # it's empty, so this falls back to github.ref_name rather than github.ref --
      # github.ref is a full "refs/heads/<branch>" ref, and chainsaw-test.yaml passes
      # this straight through as Flux's GitRepository spec.ref.branch, which needs a
      # bare branch name. ref_name is already bare for every event type.
      git_ref: ${{ github.head_ref || github.ref_name }}
      test_path: ./ci/test/apps-ai
      chainsaw_config: ./ci/test/chainsaw/.chainsaw.yaml
      kind_config: .github/kind-cluster-single-node.yaml
      # Raised from the 15m default: this suite now stands up TWO CloudNativePG Postgres
      # clusters (litellm's and n8n's), and CNPG initdb + first-boot n8n migrations are the
      # long pole (n8n's Deployment assert alone budgets 8m and only starts ~7m in, after the
      # other component validations).
      timeout: 25
