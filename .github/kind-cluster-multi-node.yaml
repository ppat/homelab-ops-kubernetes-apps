---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# See kind-cluster-single-node.yaml for why this is the kubelet's knob rather than containerd's,
# and for the measurement. A cluster-level patch does reach worker kubelets -- verified by
# reading /configz on all three nodes, since workers take their kubelet config from the
# kubelet-config ConfigMap during `kubeadm join`, a different path from the control plane's.
#
# Three nodes already gave three independent serial pull queues, so the headroom here is
# smaller: on apps-downloaders, 12 paired dispatches, queued pull time 97.6s -> 0.1s (12/12)
# but the latest-finishing pull only 31.3s -> 28.3s (t=-1.47, not significant).
kubeadmConfigPatches:
- |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 4
nodes:
- role: control-plane
- role: worker
- role: worker
