---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${db_name}-backup-credentials
  namespace: ${db_namespace}
spec:
  data:
  # Defaulted to the store-item names every consumer resolves today, so a consumer that says nothing
  # keeps the credential it already had. A store is reached with its own key pair, so a database is
  # moved by overriding these alongside backup_s3_host — endpoint and credential have to travel
  # together or the move is not a move.
  - secretKey: access_key_id
    remoteRef:
      key: ${backup_s3_accesskeyid_key:=cluster_nas_minio_cloudnativepg_accesskeyid}
  - secretKey: secret_key
    remoteRef:
      key: ${backup_s3_secretkey_key:=cluster_nas_minio_cloudnativepg_secretkey}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels:
          cnpg.io/reload: "1"
      data:
        s3_accesskeyid: "{{ .access_key_id }}"
        s3_secretaccesskey: "{{ .secret_key }}"
        # A literal, not a store lookup: the plugin's only region input is a SecretKeySelector, and
        # external-secrets renders this template client-side.
        #
        # Defaulted, unlike the endpoint, because an empty region is worse than an absent one and
        # only a default rules empty out. botocore falls back to us-east-1 when AWS_DEFAULT_REGION
        # is unset, but signs with an empty credential scope when it is set to "" — and the plugin
        # exports whatever this key holds without an emptiness check. us-east-1 is that same
        # fallback, so the default states what these databases already sign with.
        s3_region: "${backup_s3_region:=us-east-1}"
