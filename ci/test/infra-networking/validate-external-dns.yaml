---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-external-dns
spec:
  try:
  - description: Assert externalsecret/external-dns-secrets
    assert:
      bindings:
      - name: name
        value: external-dns-secrets
      - name: namespace
        value: external-dns
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  # The widest variance measured anywhere in the infra suites: 23.4/39.7/95.2s
  # (min/med/max) over four green runs, a 4x spread on the same pod. A median that uses a
  # third of the old 2m and a maximum that uses four fifths of it are the same operation --
  # so the median is not what this budget has to survive. 5m is the sizing rule against the
  # 95.2s maximum, and it is free on the runs that behave.
  - description: Assert deployment/external-dns-unifi
    assert:
      bindings:
      - name: name
        value: external-dns-unifi
      - name: namespace
        value: external-dns
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 5m
  - description: Assert helmrelease/external-dns-release
    assert:
      bindings:
      - name: name
        value: external-dns-release
      - name: namespace
        value: external-dns
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns-release
      namespace: external-dns
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: external-dns-unifi
      namespace: external-dns
  - describe:
      apiVersion: v1
      kind: Pod
      selector: app.kubernetes.io/name=external-dns
      namespace: external-dns
  # Both containers: external-dns and the unifi webhook sidecar.
  - podLogs:
      selector: app.kubernetes.io/name=external-dns
      namespace: external-dns
  # One line per API call the webhook made.
  - podLogs:
      selector: app.kubernetes.io/name=fake-unifi
      namespace: nodes
  - events:
      namespace: external-dns
