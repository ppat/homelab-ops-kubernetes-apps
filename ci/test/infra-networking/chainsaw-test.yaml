---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-networking
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-networking/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/cert-manager-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cert-manager-release --namespace=cert-manager --timeout=2m
        timeout: 2m
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=2m
        timeout: 2m

  - name: Apply infra-networking modules
    try:
    - description: Apply infra-networking-core
      apply:
        file: ./infra-networking-core.yaml
    - description: Apply infra-networking-extra
      apply:
        file: ./infra-networking-extra.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-networking-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-networking-extra
        namespace: flux-system
    - events:
        namespace: flux-system

  # Not reordered, and that is a decision. The three steps that wait -- MetalLB (30s),
  # Traefik (36s), External-DNS (40-95s) -- are validated in that order because they are
  # ordered that way in reality: traefik-release declares `dependsOn: metallb-release`, and
  # Whoami, Pi-hole and Freeradius all assert LoadBalancer or Ingress status that cannot be
  # populated until MetalLB and Traefik are serving. The instant steps therefore cannot be
  # promoted ahead of them, and the only permutation left (External-DNS after Freeradius)
  # would buy External-DNS 0.4s. Ordering pays where several steps are slow; here the slow
  # ones are the dependency chain itself, so the budgets below are the whole fix.
  - name: Validate MetalLB
    use:
      template: ./validate-metallb.yaml

  - name: Validate Traefik
    use:
      template: ./validate-traefik.yaml

  - name: Validate Whoami
    use:
      template: ./validate-whoami.yaml

  - name: Validate Pi-hole
    use:
      template: ./validate-pihole.yaml

  - name: Validate External-DNS
    use:
      template: ./validate-external-dns.yaml

  - name: Validate Freeradius
    use:
      template: ./validate-freeradius.yaml

  # Asserts nothing; prints the readiness ordering this suite's step order is derived from,
  # so the next person to tune it has current data rather than an archaeology exercise. The
  # existing failure dumps are all one content bug on `renovate/traefik-41.x`, which makes
  # every late-stage workload in them unrepresentative.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
