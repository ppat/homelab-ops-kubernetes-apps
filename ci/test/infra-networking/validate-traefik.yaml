---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-traefik
spec:
  try:
  # The HelmRelease goes first deliberately, and carries the whole convergence budget.
  #
  # The traefik chart sets no `install.disableWait`, so helm-controller waits for the
  # DaemonSet before reporting the release Ready -- this one condition subsumes every
  # assertion below it, which then return near-instantly on the shared 1m default. It also
  # subsumes `spec.dependsOn: metallb-release`: until MetalLB is Ready this release is not
  # installed at all, and that shows up here as an unmet HelmRelease condition rather than
  # as a missing DaemonSet.
  #
  # Which is the point. All eleven failure dumps this suite has produced name the DaemonSet
  # as the failing object, and all eleven also contain `Helm install failed` on this
  # release -- the DaemonSet was never created because the install never got that far. The
  # release condition reports that cause directly; the DaemonSet assert reported a missing
  # object and a spent 60s budget.
  #
  # 3m is the sizing rule against a 40.9s green maximum on the DaemonSet (min 31.7, median
  # 35.7) plus the ~3.3s helm takes to mark the release Ready behind it. The downside if the
  # subsumption claim is wrong is bounded: the DaemonSet assert simply waits on the shared
  # default as it does today.
  - description: Assert helmrelease/traefik-release
    assert:
      bindings:
      - name: name
        value: traefik-release
      - name: namespace
        value: traefik
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 3m
  - description: Assert certificate/default-tls-cert
    assert:
      bindings:
      - name: name
        value: default-tls-cert
      - name: namespace
        value: traefik
      file: ../chainsaw/assertions/certificate-ready.yaml
  # Not redundant with the HelmRelease above: helm's own wait checks `numberReady`, while
  # daemonset-ready.yaml also requires `numberAvailable`, which the DaemonSet controller
  # updates on a later resync. The default budget covers that residual gap.
  - description: Assert daemonset/traefik
    assert:
      bindings:
      - name: name
        value: traefik
      - name: namespace
        value: traefik
      file: ../chainsaw/assertions/daemonset-ready.yaml
  - description: Assert service/traefik
    assert:
      bindings:
      - name: name
        value: traefik
      - name: namespace
        value: traefik
      file: ../chainsaw/assertions/service-loadbalancer-ready.yaml
  - description: Assert middleware/header-forwarded
    assert:
      resource:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: header-forwarded
          namespace: traefik
  - description: Assert middleware/redirect
    assert:
      resource:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: redirect
          namespace: traefik
  - description: Assert tlsstore/default
    assert:
      resource:
        apiVersion: traefik.io/v1alpha1
        kind: TLSStore
        metadata:
          name: default
          namespace: traefik
        spec:
          defaultCertificate:
            secretName: default-tls-cert
  - description: Assert tlsoption/default
    assert:
      resource:
        apiVersion: traefik.io/v1alpha1
        kind: TLSOption
        metadata:
          name: default
          namespace: traefik
  - description: Assert serverstransport/insecure-skip-verify
    assert:
      resource:
        apiVersion: traefik.io/v1alpha1
        kind: ServersTransport
        metadata:
          name: insecure-skip-verify
          namespace: traefik
  - description: Assert pdb/traefik
    assert:
      bindings:
      - name: name
        value: traefik
      - name: namespace
        value: traefik
      file: ../chainsaw/assertions/poddisruptionbudget-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik-release
      namespace: traefik
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: traefik
      namespace: traefik
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: default-tls-cert
      namespace: traefik
  - describe:
      apiVersion: v1
      kind: Service
      namespace: traefik
      name: traefik
  - describe:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      namespace: traefik
      name: traefik-dashboard

  - podLogs:
      selector: app.kubernetes.io/name=traefik
      namespace: traefik

  - events:
      namespace: traefik
