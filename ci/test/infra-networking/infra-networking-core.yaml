---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-networking-core
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/networking-core
  postBuild:
    substitute:
      secret_store: fake
      cert_issuer: selfsigned-issuer
      # dns_zone feeds only the unifi provider's UNIFI_HOST in this module. This value turns
      # https://unifi.nodes.${dns_zone} into the fake UniFi API's Service; see
      # test-resources/fake-unifi.yaml.
      dns_zone: svc.cluster.local
      domain_name: cluster.example.com
      metallb_standard_ip_pool: 10.112.0.0/24
  prune: false
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
