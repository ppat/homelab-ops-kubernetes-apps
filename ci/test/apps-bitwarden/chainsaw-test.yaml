---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apps-bitwarden
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/apps-bitwarden/pre-requisites

  - name: Reconcile pre-requisites
    try:
    # 2m -> 5m, and this is the tightest operation measured anywhere in the apps scope:
    # 61/62/66/98/116s over 5 green runs, i.e. 0.97 of the budget with 4 seconds to spare.
    # Five suites run this same reconcile at 2m and all five sit at 0.74-0.97; the control is
    # apps-ai, which runs the identical script at 4m and has been observed taking 154s --
    # 128% of what this budget allows. The distribution here is visibly bimodal (three runs
    # at 61-66s, two at 98-116s), so a 5-run maximum characterises the upper mode barely at
    # all. Note the failure shape: flux-reconcile.sh passes this same duration to `flux
    # reconcile --timeout`, so blowing it surfaces as a script exit 1 from flux, not as a
    # chainsaw assert timeout.
    - description: Reconcile helmrelease/infra-security-core
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=5m
        timeout: 5m

  - name: Apply apps-bitwarden module
    try:
    - description: Apply apps-bitwarden
      apply:
        file: ./apps-bitwarden.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: apps-bitwarden
        namespace: flux-system
    - events:
        namespace: flux-system

  - name: Validate secrets
    try:
    - description: Assert externalsecret/bitwarden
      assert:
        bindings:
        - name: name
          value: bitwarden
        - name: namespace
          value: bitwarden
        file: ../chainsaw/assertions/externalsecret-ready.yaml

  # Step order is left alone. It already runs ascending by measured readiness -- mssql 72-90s
  # after module apply, admin 104-130s, identity 105-137s, api 188-229s, the HelmRelease last
  # -- and the six Deployments in between return in 0s. Nothing here would gain from a
  # different position; every one of the changes below is a budget.
  #
  # The last step must stay last for a reason unrelated to speed: it asserts the HelmRelease
  # itself, which cannot go Ready until helm has seen every workload in the chart go Ready.
  # It costs 0 bytes and 12-24s, so any sort by cost would put it first, where it could only
  # ever fail.
  - name: Validate bitwarden mssql
    use:
      template: ./validate-bitwarden-mssql.yaml

  - name: Validate bitwarden admin
    use:
      template: ./validate-bitwarden-admin.yaml

  - name: Validate bitwarden attachments
    use:
      template: ./validate-bitwarden-attachments.yaml

  - name: Validate bitwarden events
    use:
      template: ./validate-bitwarden-events.yaml

  - name: Validate bitwarden icons
    use:
      template: ./validate-bitwarden-icons.yaml

  - name: Validate bitwarden identity
    use:
      template: ./validate-bitwarden-identity.yaml

  - name: Validate bitwarden notifications
    use:
      template: ./validate-bitwarden-notifications.yaml

  - name: Validate bitwarden sso
    use:
      template: ./validate-bitwarden-sso.yaml

  - name: Validate bitwarden web
    use:
      template: ./validate-bitwarden-web.yaml

  - name: Validate bitwarden api
    use:
      template: ./validate-bitwarden-api.yaml

  - name: Validate bitwarden release
    use:
      template: ./validate-bitwarden-release.yaml

  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
