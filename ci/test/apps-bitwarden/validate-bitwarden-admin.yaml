---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-bitwarden-admin
spec:
  try:
  - description: Assert deployment/bitwarden-self-host-admin
    assert:
      bindings:
      - name: name
        value: bitwarden-self-host-admin
      - name: namespace
        value: bitwarden
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Was the inherited 60s default, at 0.77 of it: 27/40/46s over 5 green runs. admin is
      # Ready 104-130s after module apply and is asserted second, so it absorbs whatever the
      # chart's post-install migrator has left to do; its own probe is a 5s/5s httpGet, so
      # nothing about it is quantised. 3m is three times the worst observation.
      timeout: 3m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: bitwarden-self-host-admin
      namespace: bitwarden
  - events:
      namespace: bitwarden
