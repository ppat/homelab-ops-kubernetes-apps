---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-smartctl-exporter
spec:
  try:
  - description: Assert daemonset/prometheus-smartctl-exporter-0
    assert:
      bindings:
      - name: name
        value: prometheus-smartctl-exporter-0
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/daemonset-ready.yaml
      timeout: 3m
  - description: Assert daemonset/prometheus-smartctl-exporter-0 covers every node
    script:
      # yamllint disable-line rule:indentation
      content: |
        ../chainsaw/scripts/daemonset-node-coverage.sh \
          --namespace=monitoring \
          --daemonset=prometheus-smartctl-exporter-0
      timeout: 90s
  - description: Assert helmrelease/prometheus-smartctl-exporter-release
    assert:
      bindings:
      - name: name
        value: prometheus-smartctl-exporter-release
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-smartctl-exporter-release
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: prometheus-smartctl-exporter-0
      namespace: monitoring
  - podLogs:
      selector: app.kubernetes.io/name=prometheus-smartctl-exporter
      namespace: monitoring
  - events:
      namespace: monitoring
