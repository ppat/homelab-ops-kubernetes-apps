---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-log-label-contract
# Asserts the log-collection output contract: the exact label set arriving in Loki for
# the logspewer fixture's pod logs, and the shape of every value. See
# ./scripts/check-log-label-contract.sh for which labels are in scope on kind and which
# are deliberately not.
#
# Invoked once per collector while promtail and Alloy run in parallel over the same
# fixture; the caller must supply the binding that says which one this run is about. There
# is deliberately no default: the empty value is a real, meaningful choice (promtail),
# so defaulting to it would make a missing binding indistinguishable from it.
#
#   collector_label       Value of the temporary `collector` external label that isolates
#                         this collector's streams. "alloy" for Alloy; "" for promtail,
#                         which sets no such label and is matched by LogQL's empty-string
#                         matcher.
#   collector_name        The collector's `app.kubernetes.io/name`, which is also its
#                         DaemonSet name. Used to prove it is actually running on the node
#                         the fixture landed on - the one way this assertion could pass
#                         while collecting nothing - and to scope the diagnostics below to
#                         the collector that failed.
#   collector_config_map  Name of the ConfigMap holding that collector's rendered config,
#                         dumped on failure. The two charts do not agree on it (`promtail`
#                         vs `alloy-config`) and Alloy's is kustomize-generated with no
#                         app.kubernetes.io labels, so it cannot be found by selector.
spec:
  try:
  - description: Assert the pod-log label contract
    script:
      env:
      - name: COLLECTOR_LABEL
        value: ($collector_label)
      - name: COLLECTOR_NAME
        value: ($collector_name)
      # yamllint disable-line rule:indentation
      content: |
        ./scripts/check-log-label-contract.sh \
          --collector-label="${COLLECTOR_LABEL}" \
          --collector-name="${COLLECTOR_NAME}"
      timeout: 6m

  catch:
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: ($collector_name)
      namespace: logging
  # As yaml, not the default table: what a label failure needs is the relabel rules that
  # produced the labels, and a table row of name/age answers nothing.
  - get:
      apiVersion: v1
      kind: ConfigMap
      name: ($collector_config_map)
      namespace: logging
      format: yaml
  - podLogs:
      selector: (join('=', ['app.kubernetes.io/name', $collector_name]))
      namespace: logging
      tail: 100
  - podLogs:
      selector: app.kubernetes.io/name=loki
      namespace: logging
      tail: 100
