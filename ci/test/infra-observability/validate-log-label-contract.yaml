---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-log-label-contract
# Asserts the log-collection output contract: the exact label set arriving in Loki for
# the logspewer fixture's pod logs, and the shape of every value. See
# ./scripts/check-log-label-contract.sh for which labels are in scope on kind and which
# are deliberately not.
#
# Alloy is named here rather than passed in as a binding. This step was parameterised by
# collector while Alloy and Promtail ran in parallel over the same fixture; there is now
# one collector, and a parameter whose only remaining value is "alloy" would just be a
# way to point the assertion at something that is not running.
spec:
  try:
  - description: Assert the pod-log label contract
    script:
      content: ./scripts/check-log-label-contract.sh --collector-name=alloy
      timeout: 6m

  catch:
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: alloy
      namespace: logging
  # As yaml, not the default table: what a label failure needs is the relabel rules that
  # produced the labels, and a table row of name/age answers nothing. The ConfigMap is
  # kustomize-generated with no app.kubernetes.io labels, so it cannot be found by
  # selector and has to be named.
  - get:
      apiVersion: v1
      kind: ConfigMap
      name: alloy-config
      namespace: logging
      format: yaml
  - podLogs:
      selector: app.kubernetes.io/name=alloy
      namespace: logging
      tail: 100
  - podLogs:
      selector: app.kubernetes.io/name=loki
      namespace: logging
      tail: 100
