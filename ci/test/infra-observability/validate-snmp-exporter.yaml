---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-snmp-exporter
spec:
  try:
  # 2m rather than the inherited 60s, and the reason is a consequence of the reordering
  # rather than of anything about snmp-exporter: whichever step runs early now absorbs the
  # module's initial convergence, which the front-most step used to absorb on everyone
  # else's behalf. Measured at 1s and 31s across the two runs since the reorder -- the 31s
  # is 0.52 of the old default, on the slower of the two. Cheap to hold, and the step is
  # early precisely because it is not expected to be the one waiting.
  - description: Assert deployment/prometheus-snmp-exporter
    assert:
      bindings:
      - name: name
        value: prometheus-snmp-exporter
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 2m
  - description: Assert helmrelease/prometheus-snmp-exporter-release
    assert:
      bindings:
      - name: name
        value: prometheus-snmp-exporter-release
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: snmp-exporter-release
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: prometheus-snmp-exporter
      namespace: monitoring
  - podLogs:
      selector: app.kubernetes.io/name=prometheus-snmp-exporter
      namespace: monitoring
  - events:
      namespace: monitoring
