---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-prometheus
spec:
  try:
  # The HelmRelease goes first deliberately, and carries the whole convergence budget.
  #
  # kube-prometheus-stack sets no `install.disableWait`, so helm-controller waits for its
  # workloads before reporting Ready -- this one condition subsumes every assertion below
  # it, which then return near-instantly on the shared 1m default. Asserting a workload
  # first instead made the suite's most common failure report `actual resource not found`
  # on a DaemonSet, because helm creates nothing until the release completes: a symptom of
  # the release still installing, described as if the module were missing an object. This
  # step timed out on 5 of 13 sampled runs and that message is what every one of them said.
  #
  # 6m is the sizing rule (3x an observed green max of 114.6s). It costs nothing when the
  # release converges normally -- a passing assert returns the moment its condition holds.
  - description: Assert helmrelease/kube-prometheus-stack-release
    assert:
      bindings:
      - name: name
        value: kube-prometheus-stack-release
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 6m
  # Not redundant with the HelmRelease above: helm's own wait checks `numberReady`, while
  # daemonset-ready.yaml also requires `numberAvailable`, which the DaemonSet controller
  # updates on a later resync. The default budget covers that residual gap.
  - description: Assert daemonset/kube-prometheus-stack-prometheus-node-exporter
    assert:
      bindings:
      - name: name
        value: kube-prometheus-stack-prometheus-node-exporter
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/daemonset-ready.yaml
  # The assert above cannot see a node dropping out of node-exporter's target set: both
  # sides of `numberReady == desiredNumberScheduled` shrink together, so a chart bump that
  # narrows the subchart's default `tolerations: [{operator: Exists, effect: NoSchedule}]`
  # would leave kind's tainted control-plane node unscraped and still report green. This
  # suite runs on the multi-node kind config, which is what makes that state reachable
  # here at all.
  - description: Assert daemonset/kube-prometheus-stack-prometheus-node-exporter covers every node
    script:
      # yamllint disable-line rule:indentation
      content: |
        ../chainsaw/scripts/daemonset-node-coverage.sh \
          --namespace=monitoring \
          --daemonset=kube-prometheus-stack-prometheus-node-exporter
      timeout: 90s
  - description: Assert deployment/kube-prometheus-stack-kube-state-metrics
    assert:
      bindings:
      - name: name
        value: kube-prometheus-stack-kube-state-metrics
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/kube-prometheus-stack-operator
    assert:
      bindings:
      - name: name
        value: kube-prometheus-stack-operator
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert statefulset/alertmanager-kube-prometheus-stack
    assert:
      bindings:
      - name: name
        value: alertmanager-kube-prometheus-stack
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/statefulset-ready.yaml
  - description: Assert statefulset/prometheus-kube-prometheus-stack
    assert:
      bindings:
      - name: name
        value: prometheus-kube-prometheus-stack
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/statefulset-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack-release
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: kube-prometheus-stack-prometheus-node-exporter
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-kube-state-metrics
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: StatefulSet
      name: alertmanager-kube-prometheus-stack
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: StatefulSet
      name: prometheus-kube-prometheus-stack
      namespace: monitoring
  - podLogs:
      selector: app.kubernetes.io/name=prometheus
      namespace: monitoring
  - events:
      namespace: monitoring
