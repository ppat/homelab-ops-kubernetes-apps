---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespaces.yaml
- pvc/
- loki/
# Two shared fixtures in place of the whole security-core module and an object-storage
# prerequisite maintained by this suite. Nothing in observability-core or observability-extra ships a
# `Certificate` or an `Issuer`, so cert-manager is not composed here at all -- the module's
# only external dependency of that kind is its `ExternalSecret` objects (grafana admin,
# the Loki S3 credentials, unpoller), which still resolve through fake-secret-store.yaml.
# See ../../fixtures/README.md.
- ../../fixtures/external-secrets/
- ../../fixtures/garage/
- fake-secret-store.yaml

sortOptions:
  order: fifo
