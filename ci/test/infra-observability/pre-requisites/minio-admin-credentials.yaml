---
# The credential minio's chart expects at `existingSecret`, supplied directly rather than
# through the ExternalSecret the storage-core module ships (which this suite's minio.yaml
# deletes).
#
# Why, and why it is not a loss of coverage: minio is *scaffolding* here, not the subject.
# This suite tests observability-core/extra, and minio exists only to give Loki an S3
# endpoint. Resolving minio's own admin credential through external-secrets is storage-core's
# behaviour, and it is exercised properly by the infra-storage suite, where minio is the thing
# under test and keeps the ExternalSecret.
#
# What it buys: minio's install was gated on external-secrets becoming ready, which measured
# T0+117s, so minio could not finish until T0+188s and everything waiting on minio inherited
# both. Taking the credential directly removes that link and lets minio install concurrently
# with external-secrets instead of behind it.
#
# The observability module's OWN ExternalSecrets - grafana admin, the loki S3 credentials,
# unpoller - are untouched and still resolve through the fake ClusterSecretStore, so the
# external-secrets path this suite actually depends on is still covered.
#
# Values mirror fake-secret-store.yaml's `minio_admin_username` / `minio_admin_password`; if
# those change, change these.
apiVersion: v1
kind: Secret
metadata:
  name: minio-admin-credentials
  namespace: minio
type: Opaque
stringData:
  rootUser: minio-root
  rootPassword: root-passwrd-placeholder
