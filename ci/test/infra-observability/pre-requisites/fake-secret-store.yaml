---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      # grafana ExternalSecret mappings
      - key: "cluster_homelab_grafana_admin_username"
        value: "admin"
      - key: "cluster_homelab_grafana_admin_password"
        value: "example"
      # loki ExternalSecret mappings
      - key: "garage_loki_accesskeyid"
        value: "example-garage-access-key"
      - key: "garage_loki_secretkey"
        value: "example-garage-secret-key"
      - key: "garage_loki_endpoint"
        value: "http://garage.garage.svc.cluster.local:3900"
      # unpoller ExternalSecret mappings
      - key: "unpoller_username"
        value: "unpoller"
      - key: "unpoller_password"
        value: "example"
