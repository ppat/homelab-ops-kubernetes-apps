---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      # grafana ExternalSecret mappings
      - key: "cluster_homelab_grafana_admin_username"
        value: "admin"
      - key: "cluster_homelab_grafana_admin_password"
        value: "example"
      # loki ExternalSecret mappings - values match the fixed credentials
      # ci/test/chainsaw/fixtures/object-store's bootstrap Job imports, not a real secret.
      - key: "cluster_homelab_minio_loki_accesskeyid"
        value: "fixture-access-key"
      - key: "cluster_homelab_minio_loki_secretkey"
        value: "fixture-secret-key-not-a-real-secret"
      - key: "cluster_homelab_minio_loki_endpoint"
        value: "http://object-store.object-store.svc.cluster.local:9000"
      # unpoller ExternalSecret mappings
      - key: "unpoller_username"
        value: "unpoller"
      - key: "unpoller_password"
        value: "example"
