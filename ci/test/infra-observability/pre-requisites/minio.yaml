---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/storage-core/minio
  postBuild:
    substitute:
      secret_store: fake
      dns_zone: example.com
      domain_name: cluster.example.com
      minio_admin_username_key: minio_admin_username
      minio_admin_password_key: minio_admin_password
  prune: false
  # Flux defaults retryInterval to `interval` when unset, so with `interval: 15m0s` a
  # single health-check overshoot below would park this Kustomization in a failed state for
  # a quarter of an hour -- far longer than the suite that depends on it runs. Confirmed
  # against the v2.9.4 CRD schema, and corroborated in run logs: after the health check
  # expired, this object was still reporting False 3m32s after its own HelmRelease had gone
  # Ready, with no retry in between.
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  # Health-check budget (`wait: true` below). Was 2m0s; measured 28.1/82.1/94.1s on green
  # runs, i.e. 78% consumed on a bad-but-passing day -- and those are WARM re-reconciles,
  # so the cold path this has to survive is not even in the sample.
  timeout: 4m0s
  wait: true
  patches:
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: minio-release
        namespace: minio
      spec:
        values:
          persistence:
            enabled: true
            size: 1Gi
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: minio-release
      namespace: minio
  # yamllint disable-line rule:indentation
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: irrelevant
        namespace: minio
    target:
      group: monitoring.coreos.com
      kind: Probe
      namespace: minio
