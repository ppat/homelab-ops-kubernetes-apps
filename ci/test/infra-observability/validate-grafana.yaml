---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-grafana
spec:
  try:
  - description: Assert externalsecret/grafana-admin-credentials
    assert:
      bindings:
      - name: name
        value: grafana-admin-credentials
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  # HelmRelease before the workloads, carrying the convergence budget -- same reasoning as
  # validate-prometheus.yaml. Grafana is the second-heaviest image in the module (~392MB),
  # and it is the component this suite's step reordering nearly caught out: with the slow
  # step moved off the front, grafana became the new long pole at 50s against the inherited
  # 60s default, having previously been free-riding on the wait ahead of it. Displacing
  # pressure is not removing it. 3m is the sizing rule against that 50s.
  - description: Assert helmrelease/grafana-release
    assert:
      bindings:
      - name: name
        value: grafana-release
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 3m
  - description: Assert deployment/grafana
    assert:
      bindings:
      - name: name
        value: grafana
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert pvc/grafana-data
    assert:
      bindings:
      - name: name
        value: grafana-data
      - name: namespace
        value: monitoring
      file: ../chainsaw/assertions/pvc-bound.yaml
  # A bound PVC on its own proves nothing about durability - it only proves a claim
  # exists. What makes Grafana's state survive a restart is that the claim is mounted
  # at the sqlite db's location and that the rollout releases the ReadWriteOnce volume
  # before re-attaching it. Assert both, or the suite goes green on a Grafana that
  # still writes its state into the pod's ephemeral filesystem.
  - description: Assert deployment/grafana mounts the claim and rolls out via Recreate
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: grafana
          namespace: monitoring
        spec:
          strategy:
            type: Recreate
          template:
            spec:
              (volumes[?name == 'storage'] | [0].persistentVolumeClaim.claimName): grafana-data
              (containers[?name == 'grafana'] | [0].volumeMounts[?name == 'storage'] | [0].mountPath): /var/lib/grafana

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: grafana-release
      namespace: monitoring
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: grafana
      namespace: monitoring
  - describe:
      apiVersion: v1
      kind: PersistentVolumeClaim
      name: grafana
      namespace: monitoring
  - events:
      namespace: monitoring
