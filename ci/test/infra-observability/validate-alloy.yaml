---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-alloy
spec:
  try:
  # HelmRelease before DaemonSet, carrying the convergence budget -- see the equivalent
  # comment in validate-prometheus.yaml for the general reasoning.
  #
  # Alloy is sized off its creation spread rather than off green assert durations, because
  # the latter are censored: on passing runs this assert returns in ~0.1s and so records
  # nothing about how long alloy took. The DaemonSet's own creation time was measured at
  # T0+10, 33, 45, 54 and 171s across five failure dumps -- a 17x spread, on the same chart
  # and repo as alloy-events, which was created at T0+27s in the run where alloy took 171s.
  # Nothing in the module orders the two; observability-core/extra declare no `dependsOn`
  # at all, so helm-controller worker scheduling decides, and the tail is wide.
  - description: Assert helmrelease/alloy-release
    assert:
      bindings:
      - name: name
        value: alloy-release
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 4m
  - description: Assert daemonset/alloy
    assert:
      bindings:
      - name: name
        value: alloy
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/daemonset-ready.yaml

  # Everything below pins a value whose failure mode is a green, Ready, error-free
  # collector that silently collects nothing or drops a label. None of it is observable
  # from the workload's health, which is why it is asserted on the rendered DaemonSet.
  - description: Assert daemonset/alloy loads its config directory as a directory
    assert:
      resource:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: alloy
          namespace: logging
        spec:
          template:
            spec:
              (containers[?name == 'alloy']):
              # `run /etc/alloy/.` is directory mode. `/etc/alloy/..data` - what the chart
              # produces from the plausible-looking key "..data" - is a symlink, and alloy
              # given a symlinked root config path loads ZERO components, exits 0, logs
              # neither an error nor a warning and passes every readiness probe.
              - (contains(args, 'run')): true
                (contains(args, '/etc/alloy/.')): true
                (contains(args, '--storage.path=/var/lib/alloy')): true
                (contains(args, '--disable-reporting')): true
                # `host` comes from sys.env("K8S_NODE_NAME"); constants.hostname would be
                # the pod name. With the variable unset sys.env returns "", Loki drops the
                # empty label, and every stream ships with no `host` label at all.
                (env[?name == 'K8S_NODE_NAME'] | [0].valueFrom.fieldRef.fieldPath): spec.nodeName
                # A subPath mount would break both directory mode and the sidecar's
                # live-update of the ConfigMap.
                (volumeMounts[?name == 'config'] | [0].mountPath): /etc/alloy
                (volumeMounts[?name == 'config'] | [0].subPath == null): true
              # `checksum/config` cannot be emitted while the chart does not own the
              # ConfigMap, so this sidecar is the only thing that propagates a config
              # change to a running collector.
              (containers[?name == 'config-reloader']):
              - (contains(args, '--watched-dir=/etc/alloy')): true
  - description: Assert daemonset/alloy runs unprivileged with the log-reading groups
    assert:
      resource:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: alloy
          namespace: logging
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 473
                runAsGroup: 473
                # GID 0 grants the reads that UID 0 would otherwise be needed for
                # (/var/log/pods/**/N.log is root:root 0640); ${systemd_journal_gid} is
                # what makes the journal reader return entries instead of sitting healthy
                # and empty.
                supplementalGroups:
                - 0
                - 999
              # kubelet does not apply fsGroup to hostPath volumes, so without this the
              # non-root container cannot write its positions files and every restart
              # re-ingests from the beginning.
              (initContainers[?name == 'init-storage']):
              - (securityContext.runAsUser): 0
                (securityContext.capabilities.add): [CHOWN]
                (securityContext.capabilities.drop): [ALL]
              (volumes[?name == 'storage']):
              - (hostPath.path): /var/lib/alloy
              (volumes[?name == 'pods']):
              - (hostPath.path): /var/log/pods

  # ------------------------------------------------------------------------------------
  # The Kubernetes Event singleton. A second Alloy instance in the same namespace, with
  # its own ConfigMap, its own ServiceAccount and no host access at all.
  # ------------------------------------------------------------------------------------
  - description: Assert helmrelease/alloy-events-release
    assert:
      bindings:
      - name: name
        value: alloy-events-release
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 4m
  - description: Assert deployment/alloy-events
    assert:
      bindings:
      - name: name
        value: alloy-events
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/alloy-events is a singleton with no host access
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: alloy-events
          namespace: logging
        spec:
          # Not a capacity setting: `loki.source.kubernetes_events` watches the whole
          # cluster and its `clustering` block is a no-op while alloy.clustering is off,
          # so a second replica means a second copy of every event in Loki.
          replicas: 1
          # The other half of that. RollingUpdate's default maxSurge rounds up to 1, so
          # the default strategy would run two event watchers concurrently through every
          # rollout - `replicas: 1` alone does not give exactly-once delivery.
          strategy:
            type: Recreate
          template:
            spec:
              # This pod reads the Kubernetes API and nothing else. Any host mount
              # appearing here means the singleton has quietly acquired the node-level
              # access the split exists to keep off it, so the count is pinned as well as
              # the identity of each volume.
              #
              # The count is load-bearing HERE because the two checks under it are
              # expression selectors: a filter that picks one named element out of an
              # array says nothing about what else is in that array. It is NOT here
              # because chainsaw subset-matches arrays - it does not. Measured on v0.2.15,
              # the version CI pins: an assert phrased as a literal list of one element
              # against a three-element array fails with "lengths of slices don't match".
              # So do not read this line as a reason to add length() guards to the
              # list-shaped asserts elsewhere in these suites (the NetworkPolicy rules,
              # for one); those already fail on an appended element.
              (length(volumes)): 2
              (volumes[?name == 'config'] | [0].configMap.name): alloy-events-config
              (volumes[?name == 'storage'] | [0].emptyDir != null): true
              securityContext:
                runAsNonRoot: true
                runAsUser: 473
                runAsGroup: 473
                # Applies to the emptyDir backing storagePath. kubelet does apply it to
                # emptyDir (unlike hostPath), which is why this instance needs no root
                # init container and can keep the stricter posture below.
                fsGroup: 473
                seccompProfile:
                  type: RuntimeDefault
              # Neither GID 0 nor the per-host systemd-journal GID: this pod reads no
              # host files, so it must not carry the node collector's group grants.
              (securityContext.supplementalGroups == null): true
              (initContainers == null): true
              (containers[?name == 'alloy']):
              # Same directory-mode trap as the DaemonSet above: "..data" is a symlink,
              # and alloy given a symlinked root config path loads ZERO components,
              # exits 0 and logs nothing.
              - (contains(args, 'run')): true
                (contains(args, '/etc/alloy/.')): true
                (contains(args, '--storage.path=/var/lib/alloy')): true
                (contains(args, '--disable-reporting')): true
                (volumeMounts[?name == 'config'] | [0].mountPath): /etc/alloy
                (volumeMounts[?name == 'config'] | [0].subPath == null): true
                # Container level as well as pod level - the pod-level field alone did
                # not satisfy Kyverno's restrict-seccomp-strict on the DaemonSet
                # (apps#3605), and this pod needs no host access to justify a gap.
                (securityContext.seccompProfile.type): RuntimeDefault
                (securityContext.readOnlyRootFilesystem): true
                (securityContext.allowPrivilegeEscalation): false
              (containers[?name == 'config-reloader']):
              - (contains(args, '--watched-dir=/etc/alloy')): true

  - description: Assert both alloy instances loaded complete component graphs and hold narrow RBAC
    script:
      content: ./scripts/check-alloy-collector.sh
      timeout: 3m

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: alloy-release
      namespace: logging
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: alloy-events-release
      namespace: logging
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: alloy
      namespace: logging
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: alloy-events
      namespace: logging
  - podLogs:
      selector: app.kubernetes.io/name=alloy
      namespace: logging
      tail: 200
  - podLogs:
      selector: app.kubernetes.io/name=alloy-events
      namespace: logging
      tail: 200
  - events:
      namespace: logging
