---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-alloy
spec:
  try:
  - description: Assert daemonset/alloy
    assert:
      bindings:
      - name: name
        value: alloy
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/daemonset-ready.yaml
  - description: Assert helmrelease/alloy-release
    assert:
      bindings:
      - name: name
        value: alloy-release
      - name: namespace
        value: logging
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  # Everything below pins a value whose failure mode is a green, Ready, error-free
  # collector that silently collects nothing or drops a label. None of it is observable
  # from the workload's health, which is why it is asserted on the rendered DaemonSet.
  - description: Assert daemonset/alloy loads its config directory as a directory
    assert:
      resource:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: alloy
          namespace: logging
        spec:
          template:
            spec:
              (containers[?name == 'alloy']):
              # `run /etc/alloy/.` is directory mode. `/etc/alloy/..data` - what the chart
              # produces from the plausible-looking key "..data" - is a symlink, and alloy
              # given a symlinked root config path loads ZERO components, exits 0, logs
              # neither an error nor a warning and passes every readiness probe.
              - (contains(args, 'run')): true
                (contains(args, '/etc/alloy/.')): true
                (contains(args, '--storage.path=/var/lib/alloy')): true
                (contains(args, '--disable-reporting')): true
                # `host` comes from sys.env("K8S_NODE_NAME"); constants.hostname would be
                # the pod name. With the variable unset sys.env returns "", Loki drops the
                # empty label, and every stream ships with no `host` label at all.
                (env[?name == 'K8S_NODE_NAME'] | [0].valueFrom.fieldRef.fieldPath): spec.nodeName
                # A subPath mount would break both directory mode and the sidecar's
                # live-update of the ConfigMap.
                (volumeMounts[?name == 'config'] | [0].mountPath): /etc/alloy
                (volumeMounts[?name == 'config'] | [0].subPath == null): true
              # `checksum/config` cannot be emitted while the chart does not own the
              # ConfigMap, so this sidecar is the only thing that propagates a config
              # change to a running collector.
              (containers[?name == 'config-reloader']):
              - (contains(args, '--watched-dir=/etc/alloy')): true
  - description: Assert daemonset/alloy runs unprivileged with the log-reading groups
    assert:
      resource:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: alloy
          namespace: logging
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 473
                runAsGroup: 473
                # GID 0 grants the reads that UID 0 would otherwise be needed for
                # (/var/log/pods/**/N.log is root:root 0640); ${systemd_journal_gid} is
                # what makes the journal reader return entries instead of sitting healthy
                # and empty.
                supplementalGroups:
                - 0
                - 999
              # kubelet does not apply fsGroup to hostPath volumes, so without this the
              # non-root container cannot write its positions files and every restart
              # re-ingests from the beginning.
              (initContainers[?name == 'init-storage']):
              - (securityContext.runAsUser): 0
                (securityContext.capabilities.add): [CHOWN]
                (securityContext.capabilities.drop): [ALL]
              (volumes[?name == 'storage']):
              - (hostPath.path): /var/lib/alloy
              (volumes[?name == 'pods']):
              - (hostPath.path): /var/log/pods

  - description: Assert alloy loaded a complete component graph and holds narrow RBAC
    script:
      content: ./scripts/check-alloy-collector.sh
      timeout: 3m

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: alloy-release
      namespace: logging
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: alloy
      namespace: logging
  - podLogs:
      selector: app.kubernetes.io/name=alloy
      namespace: logging
      tail: 200
  - events:
      namespace: logging
