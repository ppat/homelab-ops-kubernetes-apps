---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-observability-core
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/observability-core
  postBuild:
    substitute:
      secret_store: fake
      dns_zone: example.com
      domain_name: cluster.example.com
      alertmanager_retention_period: 2h
      alertmanager_storage_class: standard
      alertmanager_storage_size: 1Gi
      prometheus_retention_size: 1GiB
      prometheus_retention_period: 2h
      prometheus_storage_class: standard
      prometheus_storage_size: 1Gi
      prometheus_volume_name: deleted-by-kustomize-patch
      loki_storage_class: standard
      loki_singlebinary_storage_size: 1Gi
      loki_s3_endpoint_key: cluster_homelab_minio_loki_endpoint
      loki_s3_accesskeyid_key: cluster_homelab_minio_loki_accesskeyid
      loki_s3_secretkey_key: cluster_homelab_minio_loki_secretkey
      loki_results_cache_memory: "512"
      loki_chunks_cache_memory: "512"
      # kind nodes have no systemd journal; any GID is fine, the group need not exist.
      systemd_journal_gid: "999"
      # see: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
      quote: '"'
  prune: false
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
  patches:
  # drop k3s-metrics endpoints as tests are run within kind, not k3s
  # yamllint disable-line rule:indentation
  - patch: |-
      $patch: delete
      kind: Endpoints
      metadata:
        name: k3s-metrics-service
    target:
      kind: Endpoints
      name: k3s-metrics-service
  # enable loki canary + test for testing purposes only
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: loki-release
        namespace: logging
      spec:
        values:
          lokiCanary:
            enabled: true
          test:
            enabled: true
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: loki-release
      namespace: logging
  # yamllint disable-line rule:indentation
  - patch: |-
      - op: remove
        path: /spec/values/prometheus/prometheusSpec/storageSpec/volumeClaimTemplate/spec/volumeName
    target:
      kind: HelmRelease
      name: kube-prometheus-stack-release
      namespace: monitoring
  # Stands in for the clusters repo injecting one of its own log jobs as an extra key in
  # the module's alloy-config ConfigMap -- the composition path the whole design rests on,
  # and the reason that ConfigMap has a stable, unhashed name. The fragment's source of
  # truth is pre-requisites/alloy/conf.d/cluster-pvc-logs.alloy;
  # scripts/check-alloy-collector.sh diffs the two and fails if they diverge.
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: alloy-config
        namespace: logging
      data:
        cluster-pvc-logs.alloy: |
          // Stand-in for a cluster-injected fragment. NOT module content.
          //
          // The clusters repo owns three log jobs this module deliberately does not (pihole, plex
          // and traefik, all tailing another pod's CSI-mounted PVC) and injects them as extra keys
          // in the alloy-config ConfigMap. This file is the CI equivalent of one of those, kept
          // here so it can be read and `alloy validate`d on its own; it reaches the ConfigMap via
          // the spec.patches entry in ../../infra-observability-core.yaml, which is byte-for-byte
          // the mechanism a cluster uses. scripts/check-alloy-collector.sh diffs this file against
          // the key that actually landed in the ConfigMap, so the two cannot drift apart quietly.
          //
          // It exercises every property the seam depends on:
          //   - it declares components in a file the module does not own,
          //   - with the mandatory `cluster_` name prefix,
          //   - referencing discovery.kubernetes.pods (defined in logs.alloy) and
          //     loki.write.default (defined in write.alloy), i.e. resolution in both directions
          //     across files that arrive from different sources.

          discovery.relabel "cluster_pvc_logs" {
          	targets = discovery.kubernetes.pods.targets

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          		regex         = "loki-canary"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_uid"]
          		replacement   = "/var/lib/kubelet/pods/$1/volumes/kubernetes.io~csi/*/mount/*.log"
          		target_label  = "__path__"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_namespace"]
          		target_label  = "namespace"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_name"]
          		target_label  = "pod"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		target_label  = "container"
          	}
          }

          loki.source.file "cluster_pvc_logs" {
          	targets    = discovery.relabel.cluster_pvc_logs.output
          	forward_to = [loki.process.cluster_pvc_logs.receiver]

          	file_match {
          		enabled = true
          	}
          }

          loki.process "cluster_pvc_logs" {
          	forward_to = [loki.write.default.receiver]

          	stage.regex {
          		source     = "filename"
          		expression = ".*/kubernetes.io~csi/[^/]+/mount/(?P<clean_filename>.*)"
          	}

          	stage.labels {
          		values = {
          			filename = "clean_filename",
          		}
          	}
          }
    target:
      kind: ConfigMap
      name: alloy-config
      namespace: logging
