---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-observability
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-observability/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=3m
        timeout: 3m
    - description: Reconcile helmrelease/minio-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=minio-release --namespace=minio --timeout=2m
        timeout: 2m

  # Applied before the modules rather than after, for two reasons: it costs the suite
  # nothing (the fixture is Ready long before Loki is), and it means the fixture has
  # been emitting for the whole module rollout, so the log-collection assertion at the
  # end never waits on the fixture - only on the pipeline.
  - name: Apply log-collection fixture
    try:
    - description: Apply logspewer
      apply:
        file: ./test-resources/logspewer.yaml
    - description: Assert deployment/logspewer
      assert:
        bindings:
        - name: name
          value: logspewer
        - name: namespace
          value: default
        file: ../chainsaw/assertions/deployment-ready.yaml
    catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: logspewer
        namespace: default
    - events:
        namespace: default

  - name: Apply infra-observability modules
    try:
    - description: Apply infra-observability-core
      apply:
        file: ./infra-observability-core.yaml
    - description: Apply infra-observability-extra
      apply:
        file: ./infra-observability-extra.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: minio
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-observability-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-observability-extra
        namespace: flux-system
    - events:
        namespace: flux-system

  - name: Validate Prometheus
    use:
      template: ./validate-prometheus.yaml

  - name: Validate Grafana
    use:
      template: ./validate-grafana.yaml

  - name: Validate Loki
    use:
      template: ./validate-loki.yaml

  - name: Validate goldilocks
    use:
      template: ./validate-goldilocks.yaml

  - name: Validate Promtail
    use:
      template: ./validate-promtail.yaml

  - name: Validate Alloy
    use:
      template: ./validate-alloy.yaml

  - name: Validate SNMP Exporter
    use:
      template: ./validate-snmp-exporter.yaml

  - name: Validate Blackbox Exporter
    use:
      template: ./validate-blackbox-exporter.yaml

  - name: Validate UniFi Poller
    use:
      template: ./validate-unifi-poller.yaml

  - name: Validate Node Problem Detector
    use:
      template: ./validate-node-problem-detector.yaml

  - name: Validate Syslog-NG
    use:
      template: ./validate-syslog-ng.yaml

  # The first assertion in this repo that looks at a pipeline's OUTPUT rather than at
  # resource status. Everything above proves promtail and Loki are running; only this
  # proves a line written by a pod is retrievable from Loki afterwards.
  - name: Validate log collection
    use:
      template: ../chainsaw/steps/assert-loki-query.yaml
      with:
        bindings:
        - name: loki_query
          value: '{job="default/logspewer"} |= "chainsaw-logspewer-marker"'
        # One stream per direction of the fixture's output (stdout and stderr). This
        # selector is deliberately NOT scoped to a collector - it asks only whether
        # anything at all retrieved these logs - so while promtail and Alloy both run, 2
        # is a floor rather than the exact count. Exactness is asserted per collector by
        # the two contract steps below, which is where a collector that shipped nothing
        # is actually caught.
        - name: loki_min_streams
          value: "2"
        - name: loki_diagnostic_match
          value: '{namespace="default"}'
        - name: loki_deadline
          value: "180"

  # Runs after the retrievability check above deliberately: if nothing was collected at
  # all, that step says so in one line, instead of this one reporting twelve simultaneous
  # label failures for a single root cause.
  - name: Validate log-label contract (promtail)
    use:
      template: ./validate-log-label-contract.yaml
      with:
        bindings:
        # Empty on purpose - it is the LogQL matcher `collector=""`, which selects the
        # streams that carry no `collector` label, i.e. promtail's. Alloy tags its own
        # with collector="alloy" for the duration of the parallel run, so without this
        # the fixture's streams from both collectors would be asserted as one set.
        - name: collector_label
          value: ""
        - name: collector_name
          value: promtail
        - name: collector_config_map
          value: promtail

  # The other half of the equivalence check, and the reason the migration's success
  # criterion is machine-checked rather than eyeballed: the SAME contract, against the
  # SAME fixture pod on the SAME node, for the streams Alloy pushed. The expected label
  # set is promtail's plus `collector`, derived inside the script from
  # --collector-label being non-empty - so the two runs cannot drift apart by editing
  # one list and forgetting the other.
  #
  # Alloy is asserted after promtail rather than before on purpose. Alloy is the new
  # collector; if BOTH fail, the promtail result is what tells you whether the fixture,
  # Loki or the query broke instead, and chainsaw stops at the first failing step.
  - name: Validate log-label contract (alloy)
    use:
      template: ./validate-log-label-contract.yaml
      with:
        bindings:
        - name: collector_label
          value: alloy
        - name: collector_name
          value: alloy
        - name: collector_config_map
          value: alloy-config
