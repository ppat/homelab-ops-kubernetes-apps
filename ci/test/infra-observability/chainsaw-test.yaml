---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-observability
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-observability/pre-requisites

  # Only external-secrets is waited for here, and that is deliberate -- see the minio step
  # below the module apply for why the other one moved.
  #
  # This one cannot move: the module's own manifests contain `ExternalSecret` objects, so
  # the CRD has to be established and the validating webhook has to be serving before the
  # module Kustomization can be applied at all.
  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=5m
        timeout: 5m

  # Applied before the modules rather than after, for two reasons: it costs the suite
  # nothing (the fixture is Ready long before Loki is), and it means the fixture has
  # been emitting for the whole module rollout, so the log-collection assertion at the
  # end never waits on the fixture - only on the pipeline.
  - name: Apply log-collection fixture
    try:
    - description: Apply logspewer
      apply:
        file: ./test-resources/logspewer.yaml
    - description: Assert deployment/logspewer
      assert:
        bindings:
        - name: name
          value: logspewer
        - name: namespace
          value: default
        file: ../chainsaw/assertions/deployment-ready.yaml
    catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: logspewer
        namespace: default
    - events:
        namespace: default

  - name: Apply infra-observability modules
    try:
    - description: Apply infra-observability-core
      apply:
        file: ./infra-observability-core.yaml
    - description: Apply infra-observability-extra
      apply:
        file: ./infra-observability-extra.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: pre-requisites-minio
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-observability-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-observability-extra
        namespace: flux-system
    - events:
        namespace: flux-system

  # Deliberately AFTER the module apply, which is the single biggest change to this suite's
  # wall-clock. minio was previously waited for as a prerequisite, and the readiness data
  # shows what that cost: external-secrets became ready at T0+117s, minio at T0+188s, and
  # the module was only applied at T0+202s -- so thirteen HelmReleases sat idle for eighty
  # seconds, not pulling a single byte, waiting on something none of them needs in order to
  # be applied. minio ships no CRDs and the module creates no minio resources; what the
  # module wants from it is an S3 endpoint, and only Loki wants that, minutes later.
  #
  # Moving the wait here lets the module's images pull while minio finishes installing, and
  # the validate steps still cannot start until minio is confirmed, so nothing downstream
  # loses a guarantee.
  #
  # The falsifier, stated because it is not a certainty: this raises peak contention by
  # overlapping minio's install with thirteen concurrent image pulls on a four-core runner.
  # If the suite gets *slower* or the minio reconcile starts approaching its budget again,
  # that is this change, and it should go back.
  - name: Reconcile helmrelease/minio-release
    try:
    # 4m: was 2m, which expired at exactly 120.0s on 4 of the 6 re-run-proven flakes in this
    # suite -- the largest single failure bucket here. Green observations ran 54.3-86.1s, so
    # a good day already consumed 72% of it, and one run on this branch took 126s.
    - description: Reconcile helmrelease/minio-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=minio-release --namespace=minio --timeout=4m
        timeout: 4m
    catch:
    - describe:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: minio-release
        namespace: minio
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: pre-requisites-minio
        namespace: flux-system
    - events:
        namespace: minio

  # Validation order below is measured, not arbitrary: ascending by when each component
  # actually became ready, taken from the `kubectl get` dumps of failed runs (creation
  # offsets from module apply, across five dumps). Flux applies the whole module at once
  # and every pod starts in parallel, but chainsaw asserts sequentially -- so a step's
  # budget only starts counting when chainsaw reaches it, and a late-validated component
  # has already spent most of its startup before its own clock starts. Asserting the
  # slowest thing first, as this suite used to, is the one arrangement that guarantees the
  # slowest component the least time.
  #
  # Measured pod Ready transitions from the readiness report this suite emits as its last
  # step, in seconds after the first pod in the cluster became Ready. A step is placed by
  # the LAST of the pods it asserts, because that is what its assertion waits for:
  #
  #   unpoller 191 . syslog 204 . node-problem-detector 196-206 . blackbox 220
  #   . snmp 233 . loki 247-248 (chunks/results caches 210, canary 224-231)
  #   . grafana 254 . alloy 253-264 . node-exporter 274-275
  #
  # goldilocks is not in that list and is first anyway: it is the step that absorbs the
  # module's initial convergence, and its budget is sized for that rather than for its own
  # component (see validate-goldilocks.yaml).
  #
  # Two swaps came out of this data: unpoller (191) ahead of syslog (204), and blackbox (220)
  # ahead of snmp (233). Both had been the other way round. node-problem-detector and syslog
  # are NOT swapped -- 196-206 straddles 204, so the data does not separate them and the
  # existing order stands.
  #
  # They are not worth the same, and a second run says so. The unpoller/syslog gap replicates
  # exactly - 191/204 in the run above, 134/147 in another - 13s both times. The snmp/blackbox
  # gap does not: the second run has snmp 163 and blackbox 164, one second apart and in the
  # opposite order. Those two components are effectively tied and the order between them is
  # noise. It is kept because ascending-by-measurement is the rule and it costs nothing, but
  # it should not be defended as a saving if someone reverts it later.
  #
  # And it is not a saving. Measured across the swap: SNMP 11s + blackbox 0s before, blackbox
  # 7s + SNMP 3s after. The pair's total is invariant, as it must be - what changes is which
  # step holds the wait, not how long the suite spends waiting.
  #
  # Note grafana's position, because the first cut of this ordering got it wrong. Derived
  # from object CREATION times in failure dumps, grafana looked like a T0+1..8s component
  # and was placed fifth; it is actually among the slowest to become READY, because it is
  # the second-heaviest image in the module. Creation is not readiness, and the gap between
  # them is the whole quantity this ordering depends on.
  #
  # Be careful what this is worth. In THIS suite the reordering is worth only ~18-30s,
  # because the twenty non-Prometheus validate steps take about 18s combined -- it is a
  # supplement to the budgets in validate-prometheus.yaml and validate-alloy.yaml, not a
  # substitute for them. Reordering pays where several steps are slow; here one dominates.
  #
  # The tail of this list is constrained and must stay put: the Loki/Prometheus query steps
  # further down read from Prometheus and Loki, so those two have to be validated first.
  - name: Validate goldilocks
    use:
      template: ./validate-goldilocks.yaml

  - name: Validate UniFi Poller
    use:
      template: ./validate-unifi-poller.yaml

  - name: Validate Syslog-NG
    use:
      template: ./validate-syslog-ng.yaml

  - name: Validate Node Problem Detector
    use:
      template: ./validate-node-problem-detector.yaml

  - name: Validate Blackbox Exporter
    use:
      template: ./validate-blackbox-exporter.yaml

  - name: Validate SNMP Exporter
    use:
      template: ./validate-snmp-exporter.yaml

  - name: Validate Loki
    use:
      template: ./validate-loki.yaml

  # The only thing in the suite that would catch a postRenderers patch whose target
  # silently stops matching (a no-op, not an error) - see check-loki-rbac.sh for the
  # full RBAC rationale.
  - name: Validate Loki RBAC
    try:
    - description: Assert the loki ServiceAccount can read ConfigMaps but not Secrets
      script:
        content: ./scripts/check-loki-rbac.sh
        timeout: 1m
    catch:
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        name: loki-clusterrole
    - describe:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: loki-release
        namespace: logging

  - name: Validate Grafana
    use:
      template: ./validate-grafana.yaml

  # Last two, and in this order, because they are the two slowest and they swap places
  # between runs: alloy was ready before kube-prometheus-stack in some dumps and 50s after
  # it in others. Whichever loses the race needs the larger budget, so both carry one.
  - name: Validate Alloy
    use:
      template: ./validate-alloy.yaml

  - name: Validate Prometheus
    use:
      template: ./validate-prometheus.yaml

  # node-exporter's stock --collector.vmstat.fields regex
  # (^(oom_kill|pgpg|pswp|pg.*fault).*) deliberately excludes pgscan_*/pgsteal_* -
  # the counters that distinguish background reclaim (kswapd) from synchronous direct
  # reclaim, which is a real latency cost invisible from node_memory_* alone. This is
  # the only thing in the suite that would catch that widened regex regressing back to
  # the stock default - a healthy node-exporter DaemonSet (asserted just above) says
  # nothing about which vmstat fields it was told to collect.
  - name: Validate node-exporter collects reclaim scan/steal counters
    use:
      template: ../chainsaw/steps/assert-prometheus-query.yaml
      with:
        bindings:
        - name: prometheus_query
          value: 'node_vmstat_pgscan_direct'
        - name: prometheus_diagnostic_match
          value: '{__name__=~"node_vmstat_pg(scan|steal).*"}'

  # The first assertion in this repo that looks at a pipeline's OUTPUT rather than at
  # resource status. Everything above proves Alloy and Loki are running; only this
  # proves a line written by a pod is retrievable from Loki afterwards.
  - name: Validate log collection
    use:
      template: ../chainsaw/steps/assert-loki-query.yaml
      with:
        bindings:
        - name: loki_query
          value: '{job="default/logspewer"} |= "chainsaw-logspewer-marker"'
        # One stream per direction of the fixture's output (stdout and stderr). This
        # step asks only whether anything at all retrieved these logs; the contract step
        # below asserts the count exactly, which is where a collector that shipped
        # nothing or fragmented the fixture's identity is actually caught.
        - name: loki_min_streams
          value: "2"
        - name: loki_diagnostic_match
          value: '{namespace="default"}'
        - name: loki_deadline
          value: "180"

  # Runs after the retrievability check above deliberately: if nothing was collected at
  # all, that step says so in one line, instead of this one reporting twelve simultaneous
  # label failures for a single root cause.
  - name: Validate log-label contract
    use:
      template: ./validate-log-label-contract.yaml

  # Applied here rather than alongside logspewer at the top of the suite: an Event's TTL
  # on the API server is about an hour, and this suite is long. Creating the fixture
  # immediately before the assertions keeps what it produces unambiguously fresh, and
  # costs nothing - unlike the log fixture, nothing needs to have been emitting during
  # the module rollout, because the collector only has to see the events once.
  - name: Apply kubernetes event fixture
    try:
    - description: Apply event-emitter
      apply:
        file: ./test-resources/event-emitter.yaml
    # Waiting on the specific waiting-reason, not on the Pod being Ready (it never will
    # be): this is the state the kubelet emits the Warning event from, so it is also the
    # signal that the event now exists.
    - description: Assert pod/event-emitter is stuck on its missing image
      assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: event-emitter
            namespace: default
          status:
            (containerStatuses[?name == 'event-emitter']):
            - (state.waiting.reason): ErrImageNeverPull
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        name: event-emitter
        namespace: default
    - events:
        namespace: default

  # The event equivalent of "Validate log collection" above, and for the same reason: a
  # Ready singleton with a healthy component graph still proves nothing about whether an
  # event that happened in the cluster is retrievable from Loki afterwards.
  - name: Validate kubernetes event collection
    use:
      template: ../chainsaw/steps/assert-loki-query.yaml
      with:
        bindings:
        - name: loki_query
          value: '{job="kubernetes-events", namespace="default", severity="warning"} |= "chainsaw-event-marker"'
        # A floor, not an exact count - this template asserts ">= n" (see its header).
        # This step asks only whether anything at all retrieved the fixture's events; the
        # contract step below asserts the stream count exactly, against /series, which is
        # where a leaked label is actually caught.
        - name: loki_min_streams
          value: "1"
        - name: loki_diagnostic_match
          value: '{job="kubernetes-events"}'
        - name: loki_deadline
          value: "180"

  # Same ordering rationale as the log-label contract: retrievability first so a pipeline
  # that shipped nothing reports one cause rather than every label at once.
  - name: Validate kubernetes event stream contract
    try:
    - description: Assert the kubernetes event stream contract
      script:
        content: ./scripts/check-event-stream-contract.sh
        # Four Loki queries, each with its own port-forward wait (up to 60s) and its own
        # retry deadline (180 + 120 + 60 + 120s). This has to exceed their sum, or a slow
        # pipeline fails as an unexplained step timeout instead of a named assertion.
        timeout: 15m
    catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: alloy-events
        namespace: logging
    # As yaml, not the default table: what a label failure needs is the config that
    # produced the labels. The ConfigMap is kustomize-generated with no
    # app.kubernetes.io labels, so it cannot be found by selector and has to be named.
    - get:
        apiVersion: v1
        kind: ConfigMap
        name: alloy-events-config
        namespace: logging
        format: yaml
    - podLogs:
        selector: app.kubernetes.io/name=alloy-events
        namespace: logging
        tail: 100
    - podLogs:
        selector: app.kubernetes.io/name=loki
        namespace: logging
        tail: 100

  # The alert rules in prometheusrule-alloy.yaml select on job="alloy" to keep the event
  # singleton out of the node collector's liveness rules. That `job` value is not written
  # anywhere - prometheus-operator derives it from the Service name because the chart's
  # ServiceMonitor sets no jobLabel - so a chart change could rename it and leave every
  # one of those alerts matching nothing at all, which looks exactly like a healthy
  # cluster. Both values are asserted, which also proves both instances are scraped.
  - name: Validate alloy metrics carry the job label the alert rules select on
    use:
      template: ../chainsaw/steps/assert-prometheus-query.yaml
      with:
        bindings:
        - name: prometheus_query
          value: 'loki_write_sent_entries_total{job="alloy"}'
        - name: prometheus_diagnostic_match
          value: '{__name__="loki_write_sent_entries_total"}'
  - name: Validate the event singleton is scraped under its own job label
    use:
      template: ../chainsaw/steps/assert-prometheus-query.yaml
      with:
        bindings:
        - name: prometheus_query
          value: 'alloy_component_controller_running_components{job="alloy-events"}'
        # Deliberately a component-controller metric rather than a loki_write one: on an
        # idle cluster the singleton can legitimately have shipped nothing yet, and a
        # counter that has never been incremented is not exported at all.
        - name: prometheus_diagnostic_match
          value: '{__name__="alloy_component_controller_running_components"}'

  # End-to-end proof, not just config-looks-right: checks that
  # configmap-loki-rule-demo.yaml's demo rule actually landed as a series in
  # Prometheus. See that file's comment for why remote_write needs a real rule to be
  # meaningfully tested, and why it's shipped from monitoring rather than logging.
  - name: Validate Loki ruler remote_write
    use:
      template: ../chainsaw/steps/assert-prometheus-query.yaml
      with:
        bindings:
        - name: prometheus_query
          value: 'loki_ruler_canary:log_lines:count1m{namespace="logging"}'
        - name: prometheus_diagnostic_match
          value: '{__name__=~"loki_ruler.*"}'

  # Asserts nothing; prints the readiness ordering this suite's step order is derived from,
  # so the next person to tune it has current data instead of an archaeology exercise.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
