---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-goldilocks
spec:
  try:
  # First assertion after the module is applied, so this is where the module's initial
  # convergence lands -- image pulls for thirteen HelmReleases, on a runner that is also
  # still installing minio. What this step measures is therefore not goldilocks (a 2-pod,
  # ~60MB component) but whatever the suite has to get through before anything at all is
  # Ready, and the budget has to be sized for that instead: measured at 25.0s, so 90s by the
  # x3 rule. It inherited the shared 1m default, which was never chosen for this job.
  #
  # This number belongs to the position, not to goldilocks. If the step order above changes
  # so that something else is first, the budget moves with the position.
  - description: Assert deployment/goldilocks-controller
    assert:
      bindings:
      - name: name
        value: goldilocks-controller
      - name: namespace
        value: goldilocks
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 90s
  - description: Assert deployment/goldilocks-dashboard
    assert:
      bindings:
      - name: name
        value: goldilocks-dashboard
      - name: namespace
        value: goldilocks
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert helmrelease/goldilocks-release
    assert:
      bindings:
      - name: name
        value: goldilocks-release
      - name: namespace
        value: goldilocks
      file: ../chainsaw/assertions/helmrelease-ready.yaml
  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: goldilocks-release
      namespace: goldilocks
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: goldilocks-controller
      namespace: goldilocks
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: goldilocks-dashboard
      namespace: goldilocks
  - podLogs:
      selector: app.kubernetes.io/name=goldilocks
      namespace: goldilocks
  - events:
      namespace: goldilocks
