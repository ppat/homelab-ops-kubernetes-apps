---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-garage-operator
spec:
  try:
  - description: Assert deployment/garage-operator
    assert:
      bindings:
      - name: name
        value: garage-operator
      - name: namespace
        value: garage-operator-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert helmrelease/garage-operator-release
    assert:
      bindings:
      - name: name
        value: garage-operator-release
      - name: namespace
        value: garage-operator-system
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: garage-operator-release
      namespace: garage-operator-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: garage-operator
      namespace: garage-operator-system
  - podLogs:
      selector: control-plane=controller-manager
      namespace: garage-operator-system
  - events:
      namespace: garage-operator-system
