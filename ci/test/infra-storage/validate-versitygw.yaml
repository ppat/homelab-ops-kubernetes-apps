---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-versitygw
spec:
  try:
  - description: Assert pvc/versitygw-data-test
    assert:
      bindings:
      - name: name
        value: versitygw-data-test
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/pvc-bound.yaml
      timeout: 2m
  - description: Assert externalsecret/versitygw-credentials
    assert:
      bindings:
      - name: name
        value: versitygw-credentials
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert deployment/versitygw
    assert:
      bindings:
      - name: name
        value: versitygw
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 5m
  - description: Assert deployment/versitygw-inventory
    assert:
      bindings:
      - name: name
        value: versitygw-inventory
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 3m
  - description: Assert deployment/versitygw-wal-continuity
    assert:
      bindings:
      - name: name
        value: versitygw-wal-continuity
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 3m
  - description: Assert deployment/versitygw-metrics
    assert:
      bindings:
      - name: name
        value: versitygw-metrics
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 3m
  - description: Assert helmrelease/versitygw-release
    assert:
      bindings:
      - name: name
        value: versitygw-release
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 90s
  - description: Assert service/versitygw
    assert:
      bindings:
      - name: name
        value: versitygw
      - name: namespace
        value: versitygw
      file: ../chainsaw/assertions/service-clusterip-ready.yaml
  # Asserts each ServiceMonitor's selector AND the labels/port of the Service it selects,
  # so a rename on either side reddens this step. What it proves: the Prometheus Operator
  # CRD accepted the resources as written (more than kubeconform's static schema check),
  # and the two halves of each pairing still agree. What it does NOT prove: that a
  # collector scrapes them -- kind runs none. The pairing is the part worth holding,
  # because a selector that stops matching yields no target, no series and no error, so
  # nothing downstream can tell it from an exporter that never shipped.
  #
  # Service ports are probed by name rather than asserted as a literal list: arrays here
  # are length-strict and index-matched (ci/test/assertion-semantics), so a literal
  # one-element list would fail against the statsd Service's two ports and would silently
  # depend on port order for the other two.
  - description: Assert servicemonitor/versitygw-metrics selects the labels service/versitygw-metrics carries
    assert:
      resource:
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: versitygw-metrics
          namespace: versitygw
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: versitygw-metrics
          endpoints:
          - port: metrics
  - description: Assert service/versitygw-metrics carries that label and a port named metrics
    assert:
      resource:
        apiVersion: v1
        kind: Service
        metadata:
          name: versitygw-metrics
          namespace: versitygw
          labels:
            app.kubernetes.io/name: versitygw-metrics
        spec:
          (ports[?name == 'metrics'] | [0].port): 9102
  - description: Assert servicemonitor/versitygw-inventory selects the labels service/versitygw-inventory carries
    assert:
      resource:
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: versitygw-inventory
          namespace: versitygw
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: versitygw-inventory
          endpoints:
          - port: metrics
  - description: Assert service/versitygw-inventory carries that label and a port named metrics
    assert:
      resource:
        apiVersion: v1
        kind: Service
        metadata:
          name: versitygw-inventory
          namespace: versitygw
          labels:
            app.kubernetes.io/name: versitygw-inventory
        spec:
          (ports[?name == 'metrics'] | [0].port): 9103
  - description: Assert servicemonitor/versitygw-wal-continuity selects its Service's labels
    assert:
      resource:
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          name: versitygw-wal-continuity
          namespace: versitygw
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: versitygw-wal-continuity
          endpoints:
          - port: metrics
  - description: Assert service/versitygw-wal-continuity carries that label and a port named metrics
    assert:
      resource:
        apiVersion: v1
        kind: Service
        metadata:
          name: versitygw-wal-continuity
          namespace: versitygw
          labels:
            app.kubernetes.io/name: versitygw-wal-continuity
        spec:
          (ports[?name == 'metrics'] | [0].port): 9104
  - description: Assert the postRenderer patches landed on deployment/versitygw
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: versitygw
          namespace: versitygw
        spec:
          template:
            spec:
              initContainers:
              - name: verify-store-identity
              - name: verify-xattr
              containers:
              - name: versitygw
                livenessProbe:
                  httpGet:
                    path: /_/health
  - description: Assert the gateway root is a subpath, not the volume root
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: versitygw
          namespace: versitygw
        spec:
          template:
            spec:
              containers:
              - name: versitygw
                (env[?name == 'VGW_BACKEND_ARGS'].value): [/mnt/data]
                (env[?name == 'VGW_IAM_DIR'].value): [/mnt/iam]
                (volumeMounts[?mountPath == '/mnt/data'].subPath): [data]
                (volumeMounts[?mountPath == '/mnt/iam'].subPath): [iam]
  - description: Assert the pod carries the fsGroup the gateway's writes depend on
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: versitygw
          namespace: versitygw
        spec:
          template:
            spec:
              securityContext:
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
  - description: Assert the three ingresses, one per listener
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: versitygw
          namespace: versitygw
          annotations:
            external-dns.alpha.kubernetes.io/hostname: versitygw-s3.cluster.example.com
        spec:
          rules:
          - host: versitygw-s3.cluster.example.com
            http:
              paths:
              - backend:
                  service:
                    name: versitygw
                    port:
                      name: s3-api
  - description: Assert ingress/versitygw-admin
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: versitygw-admin
          namespace: versitygw
        spec:
          rules:
          - host: versitygw-admin.cluster.example.com
            http:
              paths:
              - backend:
                  service:
                    name: versitygw
                    port:
                      name: admin
  - description: Assert ingress/versitygw-webui
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: versitygw-webui
          namespace: versitygw
        spec:
          rules:
          - host: versitygw.cluster.example.com
            http:
              paths:
              - backend:
                  service:
                    name: versitygw
                    port:
                      name: webui
  - description: Provision the store and assert account removal never removes a bucket
    script:
      content: ../chainsaw/scripts/versitygw/provision.sh
      timeout: 5m
  - description: Assert the S3 API serves, isolates consumers, hides the IAM store, and moves its counters
    script:
      content: ../chainsaw/scripts/versitygw/roundtrip.sh
      timeout: 5m
  - description: Assert the object is one file at its 1:1 unencoded path with its metadata attached
    script:
      content: ../chainsaw/scripts/versitygw/stored-form.sh
      timeout: 5m
  - description: Assert the sweep reclaims aged residue and leaves in-flight state intact
    script:
      content: ../chainsaw/scripts/versitygw/sweep.sh
      timeout: 8m
  # Ordering is load-bearing: after the round-trip for a store with known
  # contents, and after the sweep, whose residue would otherwise move under the
  # walk.
  - description: Assert the exported object counts are the store's and track it
    script:
      content: ../chainsaw/scripts/versitygw/inventory.sh
      timeout: 10m
  # Must follow the inventory check: it breaks a probe archive in the same
  # bucket whose object count that check asserts.
  - description: Assert the WAL chain's continuity is exported and goes red on a break
    script:
      content: ./scripts/versitygw-wal-continuity.sh
      timeout: 15m
  - description: Assert the startup xattr guard fails on a read-only mount
    script:
      content: ../chainsaw/scripts/versitygw/xattr-guard.sh
      timeout: 5m
  - description: Assert the store-identity guard refuses a blank volume
    script:
      content: ../chainsaw/scripts/versitygw/identity-guard.sh
      timeout: 5m

  catch:
  - describe:
      apiVersion: v1
      kind: PersistentVolumeClaim
      name: versitygw-data-test
      namespace: versitygw
  - describe:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: versitygw-credentials
      namespace: versitygw
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: versitygw-release
      namespace: versitygw
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: versitygw
      namespace: versitygw
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: versitygw-metrics
      namespace: versitygw
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: versitygw-inventory
      namespace: versitygw
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: versitygw-wal-continuity
      namespace: versitygw
  # yamllint disable rule:line-length
  - script:
      timeout: 1m
      content: |
        echo '--- versitygw init container (verify-xattr) ---'
        for p in $(kubectl get pods -n versitygw -l app.kubernetes.io/name=versitygw -o name); do
        echo "=== $p ==="
        kubectl logs -n versitygw "$p" -c verify-xattr --tail=50 2>&1 || true
        done
        echo '--- provisioning and sweep jobs ---'
        kubectl get jobs,pods -n versitygw
        for j in $(kubectl get jobs -n versitygw -o name); do
        echo "=== $j ==="
        kubectl logs -n versitygw "$j" --tail=50 2>&1 || true
        done
  # yamllint enable rule:line-length
  - podLogs:
      selector: app.kubernetes.io/name=versitygw
      namespace: versitygw
      container: versitygw
  - podLogs:
      selector: app.kubernetes.io/name=versitygw-metrics
      namespace: versitygw
  - podLogs:
      selector: app.kubernetes.io/name=versitygw-inventory
      namespace: versitygw
  - podLogs:
      selector: app.kubernetes.io/name=versitygw-wal-continuity
      namespace: versitygw
  - events:
      namespace: versitygw
