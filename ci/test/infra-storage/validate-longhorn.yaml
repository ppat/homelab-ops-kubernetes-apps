---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-longhorn
spec:
  try:
  - description: Assert deployment/longhorn-driver-deployer
    assert:
      bindings:
      - name: name
        value: longhorn-driver-deployer
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/longhorn-ui
    assert:
      bindings:
      - name: name
        value: longhorn-ui
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  # 1.9/4.1/30.4s over five green runs -- a 7.4x spread on a median of four seconds, which
  # is the signature of a race rather than of a slow start. It is: on the runs that take the
  # long path, one longhorn-manager pod hits `level=fatal Error starting manager: Operation
  # cannot be fulfilled` (an optimistic-concurrency conflict on Longhorn's own settings) and
  # recovers through CrashLoopBackOff with 2-3 restarts, while the DaemonSet sits at 2/3.
  #
  # 2m is the sizing rule against the 30.4s maximum, and it is worth being explicit about
  # what that buys and what it hides: this budget now spans that restart loop, so a green
  # run here is no longer evidence that the conflict did not happen. It is still visible in
  # the Ready timeline the final step prints, as a longhorn-manager pod whose Ready
  # transition trails its peers. This is a re-budgeting on headroom evidence and nothing
  # more -- it does not address the startup conflict, which remains the variance source for
  # every CSI workload below.
  - description: Assert daemonset/longhorn-manager
    assert:
      bindings:
      - name: name
        value: longhorn-manager
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/daemonset-ready.yaml
      timeout: 2m

  # The five CSI workloads below are not created by the Helm chart: longhorn-driver-deployer
  # creates them at runtime, and only once longhorn-manager reports ready. So this budget
  # has to cover creation as well as readiness -- across six failure dumps they first exist
  # between t+76s and t+125s after module apply, and every longhorn-manager restart above
  # pushes that later. It also means the HelmRelease-Ready condition asserted further down
  # cannot stand in for these assertions the way it can for a chart-owned workload; helm
  # never waited for objects it did not create.
  #
  # csi-attacher carries the budget for all five because it is asserted first and therefore
  # absorbs the creation wait: 9.1/46.4/51.8s green (0.86 of the 1m default it used to
  # inherit, the second-worst headroom in the infra suites), while the four behind it then
  # complete in 0.1-8.3s. 3m is the sizing rule against 51.8s.
  - description: Assert deployment/csi-attacher
    assert:
      bindings:
      - name: name
        value: csi-attacher
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 3m
  - description: Assert deployment/csi-provisioner
    assert:
      bindings:
      - name: name
        value: csi-provisioner
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/csi-resizer
    assert:
      bindings:
      - name: name
        value: csi-resizer
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/csi-snapshotter
    assert:
      bindings:
      - name: name
        value: csi-snapshotter
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert daemonset/longhorn-csi-plugin
    assert:
      bindings:
      - name: name
        value: longhorn-csi-plugin
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/daemonset-ready.yaml

  - description: Assert helmrelease/longhorn-release
    assert:
      bindings:
      - name: name
        value: longhorn-release
      - name: namespace
        value: longhorn-system
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  - description: Apply test-pvc
    apply:
      file: ./test-pvc.yaml
  - description: Assert storageclass/test-storage-class
    assert:
      resource:
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: test-storage-class
  - description: Assert persistentvolumeclaim/test-pvc
    assert:
      bindings:
      - name: name
        value: test-pvc
      - name: namespace
        value: default
      file: ../chainsaw/assertions/pvc-bound.yaml
      timeout: 3m

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn-release
      namespace: longhorn-system

  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: longhorn-driver-deployer
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: longhorn-ui
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: longhorn-manager
      namespace: longhorn-system

  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-attacher
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-provisioner
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-resizer
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-snapshotter
      namespace: longhorn-system
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: longhorn-csi-plugin
      namespace: longhorn-system

  - describe:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      name: test-storage-class
  - describe:
      apiVersion: v1
      kind: PersistentVolumeClaim
      name: test-pvc
      namespace: default

  - podLogs:
      selector: app=longhorn-manager
      namespace: longhorn-system
  - podLogs:
      selector: app=longhorn-ui
      namespace: longhorn-system
  # The CSI Deployments above are created by longhorn-driver-deployer only once
  # longhorn-manager reports ready, so a csi-* assertion failing is very often a
  # longhorn-manager crash wearing a downstream costume - see #3643, where three different
  # CSI components failed interchangeably and the shared cause was
  # `level=fatal Error starting manager: Operation cannot be fulfilled`.
  #
  # `podLogs` fetches the CURRENT container, which after a restart is the one that has not
  # crashed yet, so the message that explains the failure is exactly the one the dump loses.
  # This grabs the previous container's logs and the restart counts, which is what
  # distinguishes "late" from "crash-looping" - the distinction that decides whether a
  # budget is the right fix or a mask.
  # yamllint disable rule:line-length
  - script:
      timeout: 1m
      content: |
        echo '--- longhorn-manager restarts + previous-container logs ---'
        kubectl get pods -n longhorn-system -l app=longhorn-manager -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount
        for p in $(kubectl get pods -n longhorn-system -l app=longhorn-manager -o name); do
        echo "=== $p (previous) ==="
        kubectl logs -n longhorn-system "$p" -c longhorn-manager --previous --tail=50 2>&1 || true
        done
  # yamllint enable rule:line-length
  - events:
      namespace: longhorn-system
  - events:
      namespace: default
