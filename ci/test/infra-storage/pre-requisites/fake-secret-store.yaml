---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      # minio ExternalSecret mappings (using common key patterns)
      - key: "minio_admin_username"
        value: "minio-root"
      - key: "minio_admin_password"
        value: "root-passwrd-placeholder"
      # garage-credentials ExternalSecret mappings
      - key: "garage_admin_token"
        value: "chainsaw-test-admin-token"
      # Throwaway CI-only value, not a real credential. Garage requires
      # rpc_secret to be a 32-byte (64 hex char) string (see the Garage
      # v2.3.0 reference manual's `rpc_secret` entry), so a word-style
      # placeholder like "placeholder-example-secret" isn't valid here --
      # this repeating pattern is deliberately obvious filler instead. It
      # grants nothing outside this ephemeral chainsaw cluster.
      - key: "garage_rpc_secret"
        value: "cafecafecafecafecafecafecafecafecafecafecafecafecafecafecafecafe"
      # versitygw-credentials ExternalSecret mappings
      - key: "versitygw_root_accesskey"
        value: "chainsaw-versitygw-root"
      - key: "versitygw_root_secretkey"
        value: "chainsaw-root-secret-placeholder"
