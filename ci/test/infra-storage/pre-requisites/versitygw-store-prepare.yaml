---
apiVersion: batch/v1
kind: Job
metadata:
  name: versitygw-store-prepare
  namespace: versitygw
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: prepare
        image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
        command: [sh, /scripts/prepare-store.sh]
        env:
        - name: VERSITYGW_STORE_ROOT
          value: /mnt/store
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /mnt/store
        - name: scripts
          mountPath: /scripts
          readOnly: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: versitygw-data-test
      - name: scripts
        configMap:
          name: versitygw-store-prepare-scripts
          defaultMode: 0555
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
