---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../chainsaw/pre-requisites/cert-manager/
- ../../chainsaw/pre-requisites/external-secrets/
- fake-secret-store.yaml
- namespaces.yaml
- pvc/
- versitygw-store-prepare.yaml
- provisioning/

configMapGenerator:
- name: versitygw-store-prepare-scripts
  namespace: versitygw
  files:
  - scripts/prepare-store.sh

sortOptions:
  order: fifo
