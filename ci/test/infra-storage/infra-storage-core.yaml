---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage-core
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/storage-core
  postBuild:
    substitute:
      secret_store: fake
      dns_zone: example.com
      domain_name: cluster.example.com
      minio_admin_username_key: minio_admin_username
      minio_admin_password_key: minio_admin_password
      garage_admin_token_key: garage_admin_token
      garage_data_claim: garage-data-test
      garage_metadata_claim: garage-metadata-test
      garage_rpc_secret_key: garage_rpc_secret
      # Matches this estate's real production value (see conf.d/garage.toml's
      # comment), not a synthetic CI-only value -- so this suite actually
      # exercises what a cluster will run, not a stand-in that happens to work.
      garage_s3_region: us-east-1
  prune: false
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
  patches:
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: minio-release
        namespace: minio
      spec:
        values:
          persistence:
            enabled: true
            size: 1Gi
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: minio-release
      namespace: minio
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn-release
        namespace: longhorn-system
      spec:
        values:
          persistence:
            defaultClass: false
          defaultSettings:
            storageReservedPercentageForDefaultDisk: 2
            storageMinimalAvailablePercentage: 2
            storageOverProvisioningPercentage: 200
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: longhorn-release
      namespace: longhorn-system
