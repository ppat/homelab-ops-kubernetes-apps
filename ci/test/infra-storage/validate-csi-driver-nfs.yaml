---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-csi-driver-nfs
spec:
  try:
  # A five-container pod on the inherited 1m default: 17.8/32.6/34.1s (min/med/max) over
  # five green runs, 0.57 of the budget on the worst. It has already been observed expiring
  # at 60s of 60s with the Deployment created only 5s before its own window opened. 2m is
  # the sizing rule against the 34.1s maximum.
  - description: Assert deployment/csi-nfs-controller
    assert:
      bindings:
      - name: name
        value: csi-nfs-controller
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 2m
  - description: Assert daemonset/csi-nfs-node
    assert:
      bindings:
      - name: name
        value: csi-nfs-node
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/daemonset-ready.yaml
  - description: Assert helmrelease/csi-driver-nfs-release
    assert:
      bindings:
      - name: name
        value: csi-driver-nfs-release
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: csi-driver-nfs-release
      namespace: csi-driver-nfs
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-nfs-controller
      namespace: csi-driver-nfs
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: csi-nfs-node
      namespace: csi-driver-nfs
  - podLogs:
      selector: app=csi-nfs-controller
      namespace: csi-driver-nfs
  - events:
      namespace: csi-driver-nfs
