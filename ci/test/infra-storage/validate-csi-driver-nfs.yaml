---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-csi-driver-nfs
spec:
  try:
  # A five-container pod, and the clearest demonstration in this repo of why a budget sized
  # from green runs is sized from a truncated sample.
  #
  # Five green runs gave 17.8/32.6/34.1s (min/med/max), which by the x3 rule set this to 2m -
  # already a raise from the inherited 1m default it had been observed expiring at. Then a
  # genuinely slow runner turned up and it took **108s**: 0.90 of the new budget, more than
  # three times the green maximum, and nearly double the old default it would have failed at.
  # The same run had csi-attacher at 80s against its own 1m default.
  #
  # So the tail is far longer than five green runs could show, which is the general hazard:
  # every timeout failure is censored at its own budget, so the sample that survives is the
  # sample that fit. 6m is the rule applied to the 108s now observed. It costs nothing on a
  # healthy run - this assertion returns in ~18s there - and it is the difference between a
  # slow runner and a red build.
  #
  # Unchanged by the step reorder, deliberately. This step is no longer first (garage and
  # minio are measured Ready at 118s and 132s against csi-nfs-controller's 139s), which
  # hands it ~21s of head start it previously had none of - but ~21s against a 108s
  # observation is not a reason to cut a budget sized from that observation. Reordering
  # redistributes slack; it does not shorten the thing being waited for.
  - description: Assert deployment/csi-nfs-controller
    assert:
      bindings:
      - name: name
        value: csi-nfs-controller
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 6m
  - description: Assert daemonset/csi-nfs-node
    assert:
      bindings:
      - name: name
        value: csi-nfs-node
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/daemonset-ready.yaml
  - description: Assert helmrelease/csi-driver-nfs-release
    assert:
      bindings:
      - name: name
        value: csi-driver-nfs-release
      - name: namespace
        value: csi-driver-nfs
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: csi-driver-nfs-release
      namespace: csi-driver-nfs
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: csi-nfs-controller
      namespace: csi-driver-nfs
  - describe:
      apiVersion: apps/v1
      kind: DaemonSet
      name: csi-nfs-node
      namespace: csi-driver-nfs
  - podLogs:
      selector: app=csi-nfs-controller
      namespace: csi-driver-nfs
  - events:
      namespace: csi-driver-nfs
