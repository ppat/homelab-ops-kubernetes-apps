---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-storage
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap CRDs
    use:
      template: ../chainsaw/steps/bootstrap-crds.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-storage/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/cert-manager-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cert-manager-release --namespace=cert-manager --timeout=3m
        timeout: 3m
    # 36.1s on four of five green runs and 106.1s on the fifth -- a 2.9x outlier, not a
    # spread. Whatever produces the slow case produces it in full, so the budget has to
    # cover the outlier rather than the cluster of fast runs. 5m is the sizing rule against
    # 106.1s. This step runs before any module exists, so no validate-step reordering can
    # buy it headroom; only the number can.
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=5m
        timeout: 5m
    - description: Assert job/versitygw-store-prepare wrote the store-identity sentinel
      assert:
        timeout: 3m
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: versitygw-store-prepare
            namespace: versitygw
          status:
            # Must have COMPLETED, not merely been applied: a Kustomization reports Ready for
            # a Job it has only created, and the gateway refuses to start without the
            # sentinel this Job writes.
            (succeeded > `0`): true

  - name: Apply infra-storage modules
    try:
    - description: Apply infra-storage-core
      apply:
        file: ./infra-storage-core.yaml
    - description: Apply infra-storage-core-versitygw
      apply:
        file: ./infra-storage-core-versitygw.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-storage-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-storage-core-versitygw
        namespace: flux-system
    - events:
        namespace: flux-system

  # garage is asserted before csi-driver-nfs because the readiness reporter at the bottom of
  # this file measures it Ready first (garage ~118s, csi-nfs-controller ~139s, replicated
  # across runners). csi-nfs-controller -- five containers, 356 MB of images, the slowest
  # assert here -- then gets a head start rather than none. garage's PVCs take kind's default
  # WaitForFirstConsumer class and bind once its pod is scheduled, within the first-position
  # budget in validate-garage.yaml. No dependency is crossed: garage does not use the NFS
  # CSI driver.
  - name: Validate garage
    use:
      template: ./validate-garage.yaml
  - name: Validate csi-driver-nfs
    use:
      template: ./validate-csi-driver-nfs.yaml
  # Correctly last of the module-root workload steps: the five Longhorn CSI Deployments are
  # the latest-created objects among them by a wide margin (t+76..125s across six failure
  # dumps, against t+1..18s for everything else), because longhorn-driver-deployer does not
  # create them until longhorn-manager reports ready.
  - name: Validate longhorn
    use:
      template: ./validate-longhorn.yaml
  - name: Validate versitygw
    use:
      # Provisional: local runs put versitygw ahead of longhorn's csi-attacher, which
      # argues for moving this above it. What settles it is three CI runs.
      template: ./validate-versitygw.yaml

  # Asserts nothing; prints real pod Ready transition times. This suite's ordering had only
  # ever been reasoned about from catch dumps of failed runs -- a sample biased entirely
  # toward slow ones, and one that reports creation rather than readiness. This is what
  # closed that gap, and the figures the order above rests on come from it.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
