---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-minio
spec:
  try:
  - description: Assert externalsecret/minio-admin-credentials
    assert:
      bindings:
      - name: name
        value: minio-admin-credentials
      - name: namespace
        value: minio
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert deployment/minio
    assert:
      bindings:
      - name: name
        value: minio
      - name: namespace
        value: minio
      file: ../chainsaw/assertions/deployment-ready.yaml
  # This is what the step reorder exposed, and it is the fourth instance of the same shape:
  # an aggregate HelmRelease assert that runs after its own workloads, so the release's Ready
  # condition lags them and the step inherits none of the slack ahead of it. Measured 21s on
  # the first run after the reorder, against 1s for the whole step before it - the deployment
  # assert above took 5s, so the release condition alone accounted for the other 21s.
  # 21 x 3 = 63s, so 90s.
  - description: Assert helmrelease/minio-release
    assert:
      bindings:
      - name: name
        value: minio-release
      - name: namespace
        value: minio
      file: ../chainsaw/assertions/helmrelease-ready.yaml
      timeout: 90s

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: minio-release
      namespace: minio
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: minio
      namespace: minio
  - podLogs:
      selector: app=minio
      namespace: minio
  - events:
      namespace: minio
