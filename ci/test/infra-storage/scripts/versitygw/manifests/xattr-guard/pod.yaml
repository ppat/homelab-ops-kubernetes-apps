---
apiVersion: v1
kind: Pod
metadata:
  name: ${GUARD_POD}
  namespace: ${GUARD_NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: verify-xattr
    image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
    command: [python3, /scripts/verify-xattr.py]
    env:
    - name: VERSITYGW_GATEWAY_ROOT
      value: /mnt/data
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: data
      mountPath: /mnt/data
      subPath: data
      readOnly: true
    - name: scripts
      mountPath: /scripts
      readOnly: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: data
    persistentVolumeClaim:
      # Defaulted only so CI's kubeconform pass over ci/test, which knows the modules'
      # variables and not the fixtures', renders a string rather than a null.
      claimName: ${GUARD_CLAIM:=claim-name-was-not-supplied}
  - name: scripts
    configMap:
      name: versitygw-scripts
      defaultMode: 0555
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
