---
apiVersion: v1
kind: Pod
metadata:
  name: ${GUARD_POD_BLANK}
  namespace: ${GUARD_NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: verify-store-identity
    image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
    command: [python3, /scripts/verify-store-identity.py]
    env:
    - name: VERSITYGW_STORE_IDENTITY
      value: /mnt/store/.versitygw-store-identity
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: blank
      mountPath: /mnt/store
    - name: scripts
      mountPath: /scripts
      readOnly: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: blank
    emptyDir: {}
  - name: scripts
    configMap:
      name: versitygw-scripts
      defaultMode: 0555
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
