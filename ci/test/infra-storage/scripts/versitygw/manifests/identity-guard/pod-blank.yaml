---
apiVersion: v1
kind: Pod
metadata:
  name: ${GUARD_POD_BLANK}
  namespace: ${GUARD_NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: verify-store-identity
    image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
    command: [python3, /scripts/verify-store-identity.py]
    env:
    - name: VERSITYGW_STORE_IDENTITY
      value: /mnt/store/.versitygw-store-identity
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: blank
      mountPath: /mnt/store
    - name: scripts
      mountPath: /scripts
      readOnly: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: blank
    emptyDir: {}
  - name: scripts
    configMap:
      name: versitygw-scripts
      defaultMode: 0555
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
