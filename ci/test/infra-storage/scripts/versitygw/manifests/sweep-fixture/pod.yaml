---
apiVersion: v1
kind: Pod
metadata:
  name: ${SWEEP_POD}
  namespace: ${SWEEP_NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: fixture
    image: docker.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
    command: [python3, /fixture/fixture.py]
    env:
    - name: MODE
      value: ${SWEEP_MODE}
    - name: BUCKET_ONE
      value: ${SWEEP_BUCKET}
    - name: AGE_MINUTES
      value: "${SWEEP_AGE_MINUTES}"
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: data
      mountPath: /pvc
    - name: fixture
      mountPath: /fixture
      readOnly: true
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: data
    persistentVolumeClaim:
      # Defaulted only so CI's kubeconform pass over ci/test, which knows the modules'
      # variables and not the fixtures', renders a string rather than a null.
      claimName: ${SWEEP_CLAIM:=claim-name-was-not-supplied}
  - name: fixture
    configMap:
      name: versitygw-sweep-fixture
      defaultMode: 0555
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
