---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespaces.yaml
- pvc/
# Three shared fixtures in place of the whole database-core and security-core modules.
# harbor ships exactly one `Cluster`, one `Dragonfly` and one `ExternalSecret`, and no
# `Certificate` or `Issuer` at all -- its Ingress objects set `tls: []` and the chart runs
# with `expose.tls.certSource: none`, so cert-manager is deliberately not composed here.
#
# The cnpg-operator fixture omits the Barman Cloud plugin. harbor's `Cluster` declares no
# plugins and this suite applies neither components/db-backups nor components/db-restore,
# so nothing here reaches the barmancloud.cnpg.io API.
#
# See ../../chainsaw/pre-requisites/README.md.
- ../../chainsaw/pre-requisites/cnpg-operator/
- ../../chainsaw/pre-requisites/dragonfly-operator/
- ../../chainsaw/pre-requisites/external-secrets/
- fake-secret-store.yaml

sortOptions:
  order: fifo
