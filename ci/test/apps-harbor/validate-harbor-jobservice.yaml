---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-harbor-jobservice
spec:
  try:
  - description: Assert deployment/harbor-jobservice
    assert:
      bindings:
      - name: name
        value: harbor-jobservice
      - name: namespace
        value: harbor
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Was the inherited 60s default, at 0.70 of it: 31/34/42s over 5 green runs, and the
      # slowest measured component in this suite (Ready 76-92s after module apply). It is
      # late for a structural reason, not an image-size one -- jobservice blocks on the CNPG
      # cluster and on harbor-redis before it can pass its own probes -- so it stays where it
      # is and takes the budget rather than a later slot. 3m is three times the worst
      # observation and also covers the full 92s readiness if it were ever asserted at t+0.
      timeout: 3m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: harbor-jobservice
      namespace: harbor
  - podLogs:
      selector: app.kubernetes.io/name=harbor,app.kubernetes.io/component=jobservice
      namespace: harbor
  - events:
      namespace: harbor
