---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-security-extra
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/security-extra
  postBuild:
    substitute:
      secret_store: fake
      cert_issuer: selfsigned-issuer
      db_replicas: "1"
      db_storage_class: standard
      db_storage_size: 1Gi
      db_suffix_current: test
      dns_zone: example.com
      domain_name: cluster.example.com
  # Test-only: an admin API token from first start, so the OIDC step can wait on authentik's
  # own record of its default blueprints before touching anything they create (see
  # validate-authentik-oidc.yaml). The estate's clusters set no bootstrap credentials.
  patches:
  - target:
      kind: HelmRelease
      name: authentik-release
    # yamllint disable-line rule:indentation
    patch: |-
      - op: add
        path: /spec/values/global/env/-
        value:
          name: AUTHENTIK_BOOTSTRAP_TOKEN
          value: oidc-e2e-bootstrap-token-3f9c1d7a52b64e08a1c7
  prune: false
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
