---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-security
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-security/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/cloudnative-pg-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cloudnative-pg-release --namespace=cnpg-system --timeout=2m
        timeout: 2m

  - name: Apply infra-security modules
    try:
    - description: Apply infra-security-core
      apply:
        file: ./infra-security-core.yaml
    - description: Apply infra-security-extra
      apply:
        file: ./infra-security-extra.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-security-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-security-extra
        namespace: flux-system
    - events:
        namespace: flux-system

  # Not reordered, and that is a decision. Measured readiness from module apply runs
  # cert-manager 11-48s, external-secrets 92s, kyverno (all four controllers plus policy
  # reporter) censored at <=122s, authentik 234s -- the suite is already ascending, and the
  # slowest component is already validated last. What is wrong here is the budgets, not the
  # sequence: three of the four steps carry an at-risk operation and every one of them is
  # fixed in its own file.
  - name: Validate cert-manager
    use:
      template: ./validate-cert-manager.yaml
  - name: Validate external-secrets
    use:
      template: ./validate-external-secrets.yaml
  - name: Validate kyverno
    use:
      template: ./validate-kyverno.yaml

  - name: Validate authentik
    use:
      template: ./validate-authentik.yaml

  # Asserts nothing; prints the readiness ordering the step order above is derived from.
  # Everything between external-secrets and authentik currently returns in 0.1s, so its
  # true readiness is censored and the ordering claim above rests on upper bounds.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
