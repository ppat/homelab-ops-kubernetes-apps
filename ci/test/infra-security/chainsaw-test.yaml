---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-security
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/infra-security/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/cloudnative-pg-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cloudnative-pg-release --namespace=cnpg-system --timeout=2m
        timeout: 2m

  - name: Apply infra-security modules
    try:
    - description: Apply infra-security-core
      apply:
        file: ./infra-security-core.yaml
    - description: Apply infra-security-extra
      apply:
        file: ./infra-security-extra.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-security-core
        namespace: flux-system
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-security-extra
        namespace: flux-system
    - events:
        namespace: flux-system

  # Measured pod Ready transitions from the readiness report this suite emits as its last
  # step, in seconds after the first pod in the cluster became Ready. A step is placed by
  # the LAST of the pods it asserts:
  #
  #   cert-manager (before 104) . kyverno 104-175 (four controllers + policy reporter)
  #   . external-secrets 147-180 (+ trust-manager, bitwarden-sdk-server)
  #   . authentik-worker 227 . authentik-server 267-287
  #
  # kyverno moves ahead of external-secrets on that data. The earlier ordering here was
  # inferred rather than measured: every step between cert-manager and authentik returned
  # in ~0.1s, which records only that a component was ready by the time chainsaw arrived,
  # so external-secrets was placed second on an upper bound of <=92s that the reporter has
  # now replaced with a real transition at 147-180s.
  #
  # Worth being honest about the size: the two overlap at the top (175 vs 180), so the
  # separation is clean at the front of the distribution and marginal at the back. It is
  # free, though, and it hands external-secrets -- the step carrying this suite's
  # worst-provisioned Deployment assert, 8.8/47.8/61.1s over four green runs -- the whole
  # of kyverno's elapsed time as head start rather than the reverse.
  #
  # No dependency is crossed. kyverno-release declares no dependsOn; only
  # kyverno-policy-reporter-release does, on kyverno-release, and both are inside this one
  # step in that order. external-secrets-release and trust-manager-release both dependsOn
  # cert-manager-release, which stays first. The kyverno step asserts no ExternalSecret,
  # Certificate or Bundle, so nothing in it needs external-secrets to have converged.
  #
  # authentik stays last: it is the slowest by a wide margin and its step is where this
  # suite's known CNPG failure lives (#3678).
  - name: Validate cert-manager
    use:
      template: ./validate-cert-manager.yaml
  - name: Validate kyverno
    use:
      template: ./validate-kyverno.yaml
  - name: Validate external-secrets
    use:
      template: ./validate-external-secrets.yaml

  - name: Validate authentik
    use:
      template: ./validate-authentik.yaml

  # Asserts nothing; prints the readiness ordering the step order above is derived from.
  # It is what corrected that order: the intermediate steps return in ~0.1s, so their true
  # readiness is censored and the ordering used to rest on upper bounds.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
