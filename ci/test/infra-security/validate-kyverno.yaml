---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-kyverno
spec:
  try:
  # This step used to run third, behind external-secrets, and every assertion in it returned
  # in ~0.1s. It now runs second, and it inherits the pressure external-secrets was holding:
  # that step measured 73.4s in this position, and the kyverno namespace's last pod becomes
  # Ready at 175s against an arrival at ~107s (180 - 73.4). So this step has to absorb ~68s
  # that it has never had to absorb before, on assertions that all carry the shared 1m
  # default. Reordering moves pressure rather than removing it; this is the move's cost,
  # priced before the run rather than after a red one.
  #
  # 68.0 x 3 = 204s, which takes the 4m rung. Two assertions carry it rather than all ten,
  # because the module's structure says where the wait lands: the four controllers below are
  # one chart and one image and become Ready together at the FRONT of the window (something
  # in this namespace is already Ready at 104s, before chainsaw even arrives), while
  # policy-reporter is a second HelmRelease with `dependsOn: kyverno-release` and so cannot
  # start until that release has finished waiting for those four - which is what puts the
  # BACK of the window at 175s.
  #
  # The falsifier, and it is worth watching for: if some other assertion in this step is the
  # one that expires, that structural argument is wrong and the budget belongs on the step
  # rather than on two of its assertions.
  #
  # One gotcha, recorded because it will otherwise be blamed on the ordering. This step can
  # fail at deployment/policy-reporter with `actual resource not found` while every kyverno
  # controller above it is healthy, when kyverno-policy-reporter-release is left holding a
  # stale `dependency 'kyverno/kyverno-release' is not ready` - the dependency was evaluated
  # before kyverno-release went Ready and had not been re-evaluated by the end of the suite.
  # It is not caused by validating kyverno early: on the run where it was first seen,
  # external-secrets-release was stalled the same way on cert-manager-release, with no
  # external-secrets Deployments in the cluster at all, so the previous ordering would have
  # failed one step sooner on the same cluster. `flux get all -A` in the catch dump is what
  # distinguishes the two - a release reading Ready=False with a DependencyNotReady message
  # against a dependency that is plainly Ready is this, not a budget and not an order.
  #
  # Kyverno Resources
  - description: Assert deployment/kyverno-admission-controller
    assert:
      bindings:
      - name: name
        value: kyverno-admission-controller
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 4m
  - description: Assert deployment/kyverno-background-controller
    assert:
      bindings:
      - name: name
        value: kyverno-background-controller
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/kyverno-cleanup-controller
    assert:
      bindings:
      - name: name
        value: kyverno-cleanup-controller
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/kyverno-reports-controller
    assert:
      bindings:
      - name: name
        value: kyverno-reports-controller
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert helmrelease/kyverno-release
    assert:
      bindings:
      - name: name
        value: kyverno-release
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/helmrelease-ready.yaml
  - description: Assert clusterrole/kyverno:cleanup-controller:additional
    assert:
      resource:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: kyverno:cleanup-controller:additional

  # Kyverno Policy Reporter Resources
  #
  # The far end of the 104-175s readiness window, and the second of the two assertions
  # carrying this step's 4m (see the header for the derivation). Gated behind
  # `dependsOn: kyverno-release`, so nothing here can start until the four controllers above
  # are Ready and helm-controller has reported that release - which is why these three pods,
  # not the controllers, are what this step actually ends up waiting on.
  - description: Assert deployment/policy-reporter
    assert:
      bindings:
      - name: name
        value: policy-reporter
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 4m
  - description: Assert deployment/policy-reporter-kyverno-plugin
    assert:
      bindings:
      - name: name
        value: policy-reporter-kyverno-plugin
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/policy-reporter-ui
    assert:
      bindings:
      - name: name
        value: policy-reporter-ui
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert helmrelease/kyverno-policy-reporter-release
    assert:
      bindings:
      - name: name
        value: kyverno-policy-reporter-release
      - name: namespace
        value: kyverno
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno-release
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kyverno-admission-controller
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kyverno-background-controller
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kyverno-cleanup-controller
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kyverno-reports-controller
      namespace: kyverno

  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno-policy-reporter-release
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: policy-reporter
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: policy-reporter-kyverno-plugin
      namespace: kyverno
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: policy-reporter-ui
      namespace: kyverno
  - events:
      namespace: kyverno
