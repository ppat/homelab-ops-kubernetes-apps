---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-authentik
spec:
  try:
  - description: Assert externalsecret/authentik-credentials
    assert:
      bindings:
      - name: name
        value: authentik-credentials
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert certificate/authentik-signing-cert
    assert:
      bindings:
      - name: name
        value: authentik-signing-cert
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/certificate-ready.yaml
  # This 2m is deliberately not raised, despite being the single most frequent failure in
  # this suite (9 of 11 real failures, each expiring at exactly its declared value with
  # `Instances: 2, Ready Instances: 1` -- the second replica never joining). The experiment
  # has already been run: on `fix/cert-manager-traefik-extraobjects` the value was walked
  # 2m -> 3m -> 4m across three consecutive runs and failed at every one of them. A budget
  # that has been tripled without passing is not an under-sized budget, and raising it
  # again would convert a fast, loud failure into a slow one while removing the pressure to
  # find what is actually stopping the second instance.
  - description: Assert cluster.postgresql.cnpg.io/authentik-db
    assert:
      bindings:
      - name: name
        value: authentik-db-test
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/cnpg-cluster-ready.yaml
      timeout: 2m
  # Highest-variance workload measured anywhere in this repo, and the variance is in
  # *creation*, not startup: across ten failure dumps the authentik Deployments first exist
  # anywhere between t+4s and t+317s after the module is applied, a 313-second spread. The
  # green assert durations (97.0/102.5/112.4s against the old 3m) only sample the runs where
  # it was created early, so they understate what this has to survive rather than bound it.
  # 6m is the sizing rule against the 112.4s green maximum; the creation spread is the
  # reason not to shave it back toward the median.
  - description: Assert deployment/authentik-server
    assert:
      bindings:
      - name: name
        value: authentik-server
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 6m
  - description: Assert deployment/authentik-worker
    assert:
      bindings:
      - name: name
        value: authentik-worker
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 2m
  - description: Assert poddisruptionbudget/authentik-server
    assert:
      bindings:
      - name: name
        value: authentik-server
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/poddisruptionbudget-ready.yaml
  - description: Assert helmrelease/authentik-release
    assert:
      bindings:
      - name: name
        value: authentik-release
      - name: namespace
        value: authentik
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  catch:
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik-release
      namespace: authentik

  # Authentik resources
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: authentik-signing-cert
      namespace: authentik
  - describe:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: authentik-db-test
      namespace: authentik
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: authentik-server
      namespace: authentik
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: authentik-worker
      namespace: authentik
  - describe:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      name: authentik-server
      namespace: authentik

  # Pod logs
  - podLogs:
      selector: app.kubernetes.io/name=authentik
      namespace: authentik
  - events:
      namespace: authentik
