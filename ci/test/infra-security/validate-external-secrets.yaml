---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-external-secrets
spec:
  try:
  # External Secrets resources

  # 8.8/47.8/61.1s (min/med/max) over four green runs -- a 6.9x spread on the same
  # Deployment, and the worst of the four already spent 61.1s of the 2m this used to carry.
  # A budget sized to that median would fail at roughly the rate of the tail, so this is
  # sized against the maximum instead: 61.1 x 3 = 183.3s, which lands just above the 3m
  # rung and so takes the next one. The two controllers behind it stay at 2m: they are
  # measured at 31.0s and 0.1s and neither is at risk.
  - description: Assert deployment/external-secrets
    assert:
      bindings:
      - name: name
        value: external-secrets
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 4m
  - description: Assert deployment/external-secrets-cert-controller
    assert:
      bindings:
      - name: name
        value: external-secrets-cert-controller
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 2m
  - description: Assert deployment/external-secrets-webhook
    assert:
      bindings:
      - name: name
        value: external-secrets-webhook
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 2m
  - description: Assert helmrelease/external-secrets-release
    assert:
      bindings:
      - name: name
        value: external-secrets-release
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  # Trust Manager resources
  - description: Assert deployment/trust-manager
    assert:
      bindings:
      - name: name
        value: trust-manager
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert helmrelease/trust-manager-release
    assert:
      bindings:
      - name: name
        value: trust-manager-release
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/helmrelease-ready.yaml

  # Bitwarden-SDK-Server resources
  - description: Assert certificate/bitwarden-ca-cert
    assert:
      bindings:
      - name: name
        value: bitwarden-ca-cert
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/certificate-ready.yaml
  - description: Assert certificate/bitwarden-sdk-server-cert
    assert:
      bindings:
      - name: name
        value: bitwarden-sdk-server-cert
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/certificate-ready.yaml
  - description: Assert deployment/bitwarden-sdk-server
    assert:
      bindings:
      - name: name
        value: bitwarden-sdk-server
      - name: namespace
        value: external-secrets
      file: ../chainsaw/assertions/deployment-ready.yaml

  # Nightly restart CronJob
  #
  # Shape only for the CronJob/ServiceAccount/Role/RoleBinding themselves -- there is no
  # "restart fixed a real desync" to test against on kind, so this doesn't pretend to.
  # What it does prove, via verify-restart-cronjob.sh below: the RBAC triple actually
  # authorizes the restart (can-i, not just reading the Role's rules) and one real Job run
  # from the CronJob's own jobTemplate leaves `kubectl.kubernetes.io/restartedAt` on every
  # Deployment in the namespace -- the necessary consequence of `rollout restart` having
  # worked, and the one thing a shape-only assert on the CronJob object cannot show.
  - description: Assert serviceaccount/external-secrets-restart
    assert:
      resource:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: external-secrets-restart
          namespace: external-secrets
  - description: Assert role/external-secrets-restart
    assert:
      resource:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: external-secrets-restart
          namespace: external-secrets
        rules:
        - apiGroups:
          - apps
          resources:
          - deployments
          verbs:
          - get
          - list
          - patch
  - description: Assert rolebinding/external-secrets-restart
    assert:
      resource:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: external-secrets-restart
          namespace: external-secrets
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: external-secrets-restart
        subjects:
        - kind: ServiceAccount
          name: external-secrets-restart
          namespace: external-secrets
  - description: Assert cronjob/external-secrets-restart
    assert:
      resource:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: external-secrets-restart
          namespace: external-secrets
        spec:
          schedule: 0 6 * * *
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
  - description: Verify external-secrets-restart RBAC is scoped to exactly get/list/patch on Deployments
    script:
      content: ./scripts/verify-restart-cronjob.sh --rbac
      timeout: 30s
  - description: Trigger external-secrets-restart and verify every Deployment picks up restartedAt
    script:
      content: ./scripts/verify-restart-cronjob.sh --trigger
      timeout: 3m

  - description: Create test namespace
    apply:
      file: ./test.yaml
  - description: Assert bundle/bitwarden-ca-cert
    assert:
      bindings:
      - name: name
        value: bitwarden-ca-cert
      file: ../chainsaw/assertions/bundle-synced.yaml
  - description: Assert configmap/bitwarden-ca-cert
    assert:
      resource:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: bitwarden-ca-cert
          namespace: test

  catch:
  # HelmRelease resources
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets-release
      namespace: external-secrets
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager-release
      namespace: external-secrets

  # Deployment resources
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: external-secrets
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: bitwarden-sdk-server
      namespace: external-secrets

  # Certificate resources
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      name: bitwarden-ca-issuer
      namespace: external-secrets
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: bitwarden-ca-cert
      namespace: external-secrets
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      name: bitwarden-cert-issuer
      namespace: external-secrets
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: bitwarden-sdk-server-cert
      namespace: external-secrets

  # Pod logs
  - podLogs:
      selector: app.kubernetes.io/instance=external-secrets
      namespace: external-secrets
  - podLogs:
      selector: app.kubernetes.io/name=trust-manager
      namespace: external-secrets

  # Bundle resources
  - describe:
      apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      name: bitwarden-ca-cert

  # ConfigMap resources
  - describe:
      apiVersion: v1
      kind: ConfigMap
      name: bitwarden-ca-cert
      namespace: test

  # Nightly restart CronJob resources
  - describe:
      apiVersion: batch/v1
      kind: CronJob
      name: external-secrets-restart
      namespace: external-secrets
  - describe:
      apiVersion: batch/v1
      kind: Job
      name: verify-external-secrets-restart
      namespace: external-secrets
  - describe:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      name: external-secrets-restart
      namespace: external-secrets
  - podLogs:
      selector: job-name=verify-external-secrets-restart
      namespace: external-secrets

  - events:
      namespace: external-secrets
  - events:
      namespace: test
