---
# The credential Garage's Deployment reads as GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN, supplied
# directly rather than through the ExternalSecret the storage-core module ships (which
# garage.yaml deletes).
#
# Same reasoning as ../minio/minio-admin-credentials.yaml, and taken for the same reason:
# wherever this fixture is used, Garage is *scaffolding* -- an S3 endpoint for something else
# -- never the subject. Resolving its own credential through external-secrets is storage-core's
# behaviour, exercised by the infra-storage suite, where Garage is the thing under test and
# keeps the ExternalSecret. Supplying it directly means a suite that needs only object storage
# does not have to stand up external-secrets, define a ClusterSecretStore, or add two keys to
# one it already has.
#
# Values are the ones infra-storage's fake ClusterSecretStore already feeds through that
# ExternalSecret, so this fixture exercises byte-identical inputs. The rpc-secret is not
# arbitrary: Garage requires rpc_secret to be exactly 32 bytes hex-encoded (64 characters) and
# refuses to start otherwise. Throwaway CI-only values, not real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: garage
type: Opaque
stringData:
  admin-token: chainsaw-test-admin-token
  rpc-secret: cafecafecafecafecafecafecafecafecafecafecafecafecafecafecafecafe
