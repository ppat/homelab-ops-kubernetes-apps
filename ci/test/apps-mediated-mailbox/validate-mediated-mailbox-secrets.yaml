---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-mediated-mailbox-secrets
spec:
  try:
  - description: Assert externalsecret/mediated-mailbox-api-db
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-api-db
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert externalsecret/mediated-mailbox-ui-db
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-ui-db
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert externalsecret/mediated-mailbox-backfill-db
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-backfill-db
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert externalsecret/mediated-mailbox-sync-db
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-sync-db
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert externalsecret/mediated-mailbox-sealing-keys
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-sealing-keys
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert externalsecret/mediated-mailbox-api-bearer-token
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-api-bearer-token
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  # The managed roles read these as basic-auth Secrets whose username is the role. A template that
  # lost its type or username would sync Ready and leave the role without its password.
  - description: Assert the role Secrets carry the basic-auth shape CloudNativePG reads
    assert:
      resource:
        apiVersion: v1
        kind: Secret
        metadata:
          name: mediated-mailbox-api-db
          namespace: mediated-mailbox
          labels:
            cnpg.io/reload: "true"
        type: kubernetes.io/basic-auth
        data:
          (base64_decode(username)): mediated_mailbox_api
  # decodingStrategy: Base64 turns the stored text back into the key's raw bytes: a 32-byte seed
  # is 44 characters once base64-encoded again, where the undecoded text would be 60.
  - description: Assert the sealing key pair is decoded from the store
    assert:
      resource:
        apiVersion: v1
        kind: Secret
        metadata:
          name: mediated-mailbox-sealing-keys
          namespace: mediated-mailbox
        data:
          (length("credential.key")): 44
  catch:
  - describe:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      namespace: mediated-mailbox
  - events:
      namespace: mediated-mailbox
  - podLogs:
      selector: app.kubernetes.io/name=external-secrets
      namespace: external-secrets
      tail: 100
