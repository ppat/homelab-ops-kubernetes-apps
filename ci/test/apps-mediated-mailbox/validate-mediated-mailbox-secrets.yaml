---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-mediated-mailbox-secrets
spec:
  try:
  - description: Assert pushsecret/mediated-mailbox-db-password
    assert:
      resource:
        apiVersion: external-secrets.io/v1alpha1
        kind: PushSecret
        metadata:
          name: mediated-mailbox-db-password
          namespace: mediated-mailbox
        status:
          (conditions[?type == 'Ready']):
          - status: 'True'
  - description: Assert externalsecret/mediated-mailbox-secrets
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-secrets
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  # The ExternalSecret reads the application user's password from the store, which the PushSecret
  # seeds only where it holds nothing. It waits on that push, hence the longer budget than an
  # ExternalSecret reading a seeded key.
  - description: Assert externalsecret/mediated-mailbox-app-db
    assert:
      bindings:
      - name: name
        value: mediated-mailbox-app-db
      - name: namespace
        value: mediated-mailbox
      file: ../chainsaw/assertions/externalsecret-ready.yaml
      timeout: 2m
  # decodingStrategy: Base64 turns the stored text back into the key's raw bytes: a 32-byte seed
  # is 44 characters once base64-encoded again, where the undecoded text would be 60.
  - description: Assert secret/mediated-mailbox-secrets holds the decoded key pair and the token
    assert:
      resource:
        apiVersion: v1
        kind: Secret
        metadata:
          name: mediated-mailbox-secrets
          namespace: mediated-mailbox
        data:
          (keys(@) | sort(@)):
          - api-bearer-token
          - credential.key
          - credential.pub
          (length("credential.key")): 44
          (base64_decode("api-bearer-token")): example-ci-only-bearer-token
  # CloudNativePG needs the basic-auth shape with the role as its username, and the database pods
  # can read this Secret, so the exact key list is what keeps anything else out of it.
  - description: Assert secret/mediated-mailbox-app-db holds the application user's password alone
    assert:
      resource:
        apiVersion: v1
        kind: Secret
        metadata:
          name: mediated-mailbox-app-db
          namespace: mediated-mailbox
          labels:
            cnpg.io/reload: "true"
        type: kubernetes.io/basic-auth
        data:
          (keys(@) | sort(@)):
          - password
          - username
          (base64_decode(username)): mediated_mailbox_app
          (length(base64_decode(password))): 32
  catch:
  - describe:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      namespace: mediated-mailbox
  - describe:
      apiVersion: external-secrets.io/v1alpha1
      kind: PushSecret
      namespace: mediated-mailbox
  - events:
      namespace: mediated-mailbox
  - podLogs:
      selector: app.kubernetes.io/name=external-secrets
      namespace: external-secrets
      tail: 100
