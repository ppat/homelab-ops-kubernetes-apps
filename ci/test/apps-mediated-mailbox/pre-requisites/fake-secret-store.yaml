---
# Exactly the seven keys this module's ExternalSecrets read, and no more, named as
# ../apps-mediated-mailbox.yaml substitutes the module's remote-key variables.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      - key: "mediated_mailbox_api_db_password"
        value: "example-ci-only-api"
      - key: "mediated_mailbox_ui_db_password"
        value: "example-ci-only-ui"
      - key: "mediated_mailbox_backfill_db_password"
        value: "example-ci-only-backfill"
      - key: "mediated_mailbox_sync_db_password"
        value: "example-ci-only-sync"
      - key: "mediated_mailbox_api_bearer_token"
        value: "example-ci-only-bearer-token"
      # A real key pair, base64-encoded as the module expects the store to hold it. Every process
      # that mounts it parses it at startup and exits on a malformed key, so a placeholder would
      # crashloop the API server, the worker and the UI. Throwaway, written for this suite with
      # mediated-mailbox-keygen and sealing nothing.
      - key: "mediated_mailbox_sealing_private_key"
        value: "kfKCNnEgJOZiVSyxWsvutf0vmjp9YiiYCxmWa+5okdo="
      - key: "mediated_mailbox_sealing_public_key"
        # yamllint disable-line rule:line-length
        value: ""
