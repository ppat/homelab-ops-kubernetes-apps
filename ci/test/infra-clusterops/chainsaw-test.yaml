---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: infra-clusterops
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap CRDs
    use:
      template: ../chainsaw/steps/bootstrap-crds.yaml

  - name: Apply infra-clusterops modules
    try:
    - description: Apply infra-clusterops-core
      apply:
        file: ./infra-clusterops-core.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: infra-clusterops-core
        namespace: flux-system
    - events:
        namespace: flux-system

  - name: Validate flux
    use:
      template: ./validate-flux.yaml

  - name: Validate flux capabilities
    use:
      template: ./validate-flux-capabilities.yaml

  - name: Validate system-upgrade-controller
    use:
      template: ./validate-system-upgrade-controller.yaml

  # Reloader is validated after the Flux steps because it is the slowest component to become
  # ready (its assert polled for 19-23s when it followed only instant steps) and the Flux
  # steps ahead of it now wait on real work: 14-32s together over twenty CI runs, which absorbs
  # most of that startup -- the reloader assert fell to 0-13s. Nothing in the Flux steps
  # depends on reloader, so no dependency is crossed.
  - name: Validate reloader
    use:
      template: ./validate-reloader.yaml

  # Needs reloader Running, which the step above asserts.
  - name: Validate reloader capabilities
    use:
      template: ./validate-reloader-capabilities.yaml

  # Asserts nothing; prints the readiness ordering the step order above is derived from.
  # This suite has no failed runs in the last 100, so the shared catch-block dump has never
  # fired for it and its ordering rests entirely on green timings -- which are censored for
  # every component that was already ready when chainsaw arrived. This is how that gap gets
  # closed without waiting for a failure.
  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
