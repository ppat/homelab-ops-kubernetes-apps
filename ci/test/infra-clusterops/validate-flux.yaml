---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-flux
spec:
  try:
  # First, because every Flux check after it would otherwise be exercising whichever Flux
  # happens to be running. The harness installs Flux before the module is applied, the same
  # release the module vendors, so until the module's rollout completes the controllers are
  # the harness's; see the script header for how the two are told apart. It is also the
  # first step to absorb the module's convergence: applying the module changes every
  # controller's pod template, so all four roll. Measured 5-28s (mean 13s) over twenty CI runs;
  # 120s is four times the maximum and costs nothing on a green run.
  - description: Assert the running Flux controllers are the module's
    script:
      content: ./scripts/flux-is-the-module.sh 120
      timeout: 150s
  - description: Assert deployment/kustomize-controller feature gates
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: kustomize-controller
          namespace: flux-system
        spec:
          template:
            spec:
              (containers[?name == 'manager'] | [0].args):
                (contains(@, '--feature-gates=StrictPostBuildSubstitutions=true')): true
                (contains(@, '--feature-gates=CancelHealthCheckOnNewRevision=true')): true
  - description: Assert deployment/helm-controller feature gates are unchanged
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: helm-controller
          namespace: flux-system
        spec:
          template:
            spec:
              (containers[?name == 'manager'] | [0].args):
                (contains(@, '--feature-gates=OOMWatch=true')): true
                (contains(@, 'CancelHealthCheckOnNewRevision')): false
                (contains(@, 'DefaultToRetryOnFailure')): false
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
  - podLogs:
      selector: app=kustomize-controller
      namespace: flux-system
  - podLogs:
      selector: app=helm-controller
      namespace: flux-system
  - events:
      namespace: flux-system
