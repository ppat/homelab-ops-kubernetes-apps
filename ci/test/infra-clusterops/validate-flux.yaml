---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-flux
spec:
  try:
  # No first-position budget here, deliberately, against the rule applied to the other infra
  # suites. Elsewhere the first validate step absorbs the module's initial convergence and
  # is budgeted for that (25-57s). This one absorbs 2.0s, because the four Deployments it
  # asserts are the Flux controllers installed by the `Bootstrap FluxCD` step at the top of
  # the suite: they have been Ready since long before the module was applied, so there is no
  # convergence for this position to absorb and nothing to size a number from.
  #
  # x3 on 2.0s is 6s, which is below every rung available; the shared 1m default is already
  # 30x the observation. Writing 60s here for symmetry with the other suites would look
  # measured and would be arbitrary.
  - description: Assert deployment/helm-controller
    assert:
      bindings:
      - name: name
        value: helm-controller
      - name: namespace
        value: flux-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/kustomize-controller
    assert:
      bindings:
      - name: name
        value: kustomize-controller
      - name: namespace
        value: flux-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/notification-controller
    assert:
      bindings:
      - name: name
        value: notification-controller
      - name: namespace
        value: flux-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/source-controller
    assert:
      bindings:
      - name: name
        value: source-controller
      - name: namespace
        value: flux-system
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/kustomize-controller feature gates
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: kustomize-controller
          namespace: flux-system
        spec:
          template:
            spec:
              (containers[?name == 'manager'] | [0].args):
                (contains(@, '--feature-gates=StrictPostBuildSubstitutions=true')): true
                (contains(@, '--feature-gates=CancelHealthCheckOnNewRevision=true')): true
  - description: Assert deployment/helm-controller feature gates are unchanged
    assert:
      resource:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: helm-controller
          namespace: flux-system
        spec:
          template:
            spec:
              (containers[?name == 'manager'] | [0].args):
                (contains(@, '--feature-gates=OOMWatch=true')): true
                (contains(@, 'CancelHealthCheckOnNewRevision')): false
                (contains(@, 'DefaultToRetryOnFailure')): false
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
  - podLogs:
      selector: app=kustomize-controller
      namespace: flux-system
  - podLogs:
      selector: app=helm-controller
      namespace: flux-system
  - events:
      namespace: flux-system
