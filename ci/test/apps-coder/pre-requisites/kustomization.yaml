---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Two shared fixtures in place of the whole database-core and security-core modules.
#
# cert-manager IS needed: `apps/subsystems/coder/certificate-coder.yaml` is a
# `Certificate` issued by `${cert_issuer}` -- substituted to `selfsigned-issuer`, which is
# what this fixture supplies -- and `Validate coder cert` asserts it Ready.
#
# external-secrets is NOT, and this is where the audit disagreed with the plan. The plan
# was cert-manager + external-secrets + cnpg-operator, from what the suite reconciles
# today. But `apps/subsystems/coder` contains no `ExternalSecret` at all, references no
# `${secret_store}`, and this suite has never had a `fake` ClusterSecretStore to resolve
# one against -- there is no fake-secret-store.yaml in this directory and never has been.
# The operator was standing purely because security-core happened to contain it.
#
# The cnpg-operator fixture omits the Barman Cloud plugin. coder's `Cluster` declares no
# plugins and this suite applies neither components/db-backups nor components/db-restore,
# so nothing here reaches the barmancloud.cnpg.io API.
#
# See ../../chainsaw/pre-requisites/README.md.
- ../../chainsaw/pre-requisites/cert-manager/
- ../../chainsaw/pre-requisites/cnpg-operator/

sortOptions:
  order: fifo
