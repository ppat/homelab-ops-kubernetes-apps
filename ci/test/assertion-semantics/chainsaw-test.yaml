---
# Every assertion in every one of the sixteen suites means what chainsaw's assertion-tree
# matcher says it means, and that matcher is pinned by CHAINSAW_VERSION in
# ppat/github-workflows -- a repository this one does not control, where Renovate bumps it.
# Assertion-tree behaviour is still v1alpha1. Without this suite a minor release that changed
# matching semantics would land underneath all sixteen suites in silence, and every assertion
# in the repo would quietly start meaning something slightly different.
#
# Each Test pairs a positive control with the semantic under test:
#   - the assert proves the object exists, the field path is right, and matching can succeed;
#   - the error proves the specific looser semantic is NOT in force.
# Without the paired control an `error` that passed for the wrong reason (typo'd name, wrong
# path) would read as a green result.
#
# One semantic -- `length()` over an absent key -- cannot be established that way, because the
# evaluation error it raises fails an `error` operation exactly as it fails an `assert`. That
# arm runs the negative half out-of-band instead, through `chainsaw assert`; see its own
# description for why, and for the control that keeps it from passing vacuously.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: maps-are-subset-matched
spec:
  description: |
    Maps match by subset -- an assertion names only the fields it cares about and ignores the
    rest. This is the single most load-bearing semantic in the repo: every shared assertion in
    ci/test/chainsaw/assertions/ is a partial object.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-subset
          data:
            a: "1"
            b: "2"
            c: "3"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-subset
          data:
            a: "1"
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: absent-fields-compare-equal
spec:
  description: |
    Two fields that are both absent compare EQUAL inside an expression. This is why an
    expression assertion over status fields that a controller has not populated yet can pass
    vacuously -- `(x == y): true` is true when neither x nor y exists. Assertions written as
    expressions must therefore also assert that the operands exist.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-absent
          data:
            present: "1"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-absent
          data:
            present: "1"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-absent
          data:
            (absentA == absentB): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scalars-do-not-glob-match
spec:
  description: |
    Scalars compare by strict equality; `*` in an expected value is a literal asterisk, not a
    wildcard. Kyverno *policies* glob-match, so the instinct transfers wrongly -- do not import
    it. If this Test ever fails, every scalar assertion in the repo has become weaker than its
    author intended.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-glob
          data:
            schedule: "0 */15 * * *"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-glob
          data:
            schedule: "0 */15 * * *"
    - error:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-glob
          data:
            schedule: "*/15 * * * *"
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: arrays-require-equal-length
spec:
  description: |
    Arrays are NOT subset-matched: an expected list shorter than the actual list fails. A
    LITERAL list-shaped assertion therefore already notices an extra element and needs no
    `(length(x)): n` guard beside it. That does not generalise to an array probed by
    expression selectors -- a filter picking one named element says nothing about the rest of
    the array, so there the length check is the only thing pinning the count (see the
    `(length(volumes)): 2` line in ci/test/infra-observability/validate-alloy.yaml).
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-length
          imagePullSecrets:
          - name: first
          - name: second
          - name: third
    - assert:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-length
          imagePullSecrets:
          - name: first
          - name: second
          - name: third
    - error:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-length
          imagePullSecrets:
          - name: first
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: arrays-match-index-wise
spec:
  description: |
    Arrays of equal length match element-by-element at the same index, so reordering an actual
    list fails an assertion that was written in the old order. The cost is brittleness, not
    vacuity: a list-shaped assertion produces a false red when a chart reorders its output.
    The expected and actual lists here are the same length, so the length check cannot fire
    first and mask the ordering question.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-order
          imagePullSecrets:
          - name: first
          - name: second
    - assert:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-order
          imagePullSecrets:
          - name: first
          - name: second
    - error:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-order
          imagePullSecrets:
          - name: second
          - name: first
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: length-of-a-missing-list-does-not-evaluate
spec:
  description: |
    `length()` over a key that is absent does not evaluate to anything -- it is an evaluation
    ERROR, not a false. An erroring expression ABORTS the step instead of retrying it, so an
    assertion that can observe a list before its controller has populated it must write
    `|| []`. ci/test/chainsaw/assertions/service-endpoints-ready.yaml load-bears on exactly
    this: an EndpointSlice whose Service selects no ready pod has no `endpoints` key at all,
    and without the fallback that assertion would abort during normal endpoint programming
    rather than retry until the first pod is ready.

    Unlike the other arms, the negative half runs out-of-band through `chainsaw assert`, which
    evaluates one assertion against one literal resource with no cluster involved. It has to:
    an evaluation error propagates out of an in-band `error` operation exactly as it does out
    of an in-band `assert` -- both report ERROR and fail the step -- so an in-band arm would
    go red in precisely the world where this semantic still holds.

    The out-of-band expression compares `length()` with itself rather than with a constant
    because any value `length()` could return equals itself: a non-zero exit therefore means
    the expression produced no value at all, and a release that made `length(null)` return `0`
    *or* `null` would exit zero and turn this arm red. The first script is the control for
    the out-of-band mechanism itself -- without it, a missing binary or a renamed flag would
    also exit non-zero and read as green.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-no-list
    - assert:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sa-no-list
          (length(imagePullSecrets || `[]`) == `0`): true
    - script:
        content: |
          set -eu
          d="$(mktemp -d)"
          cat > "${d}/resource.yaml" <<'EOF'
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: sa-no-list}
          EOF
          cat > "${d}/assertion.yaml" <<'EOF'
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: sa-no-list}
          (length(imagePullSecrets || `[]`) == `0`): true
          EOF
          chainsaw assert --no-color -f "${d}/assertion.yaml" -r "${d}/resource.yaml"
        check:
          ($error == null): true
    - script:
        content: |
          set -eu
          d="$(mktemp -d)"
          cat > "${d}/resource.yaml" <<'EOF'
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: sa-no-list}
          EOF
          cat > "${d}/assertion.yaml" <<'EOF'
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: sa-no-list}
          (length(imagePullSecrets) == length(imagePullSecrets)): true
          EOF
          chainsaw assert --no-color -f "${d}/assertion.yaml" -r "${d}/resource.yaml"
        check:
          ($error != null): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: collections-match-any-not-all
spec:
  description: |
    A resource-shaped assertion that names a Kind but no metadata.name is checked against
    every object of that Kind (filtered by whatever other metadata it does name, e.g.
    namespace/labels) and is satisfied the moment ANY ONE of them matches the tree -- not
    when ALL of them do. Confirmed here with two ConfigMaps carrying opposite values: an
    assertion for either value passes on its own, which could only happen under any-match
    (all-match would need every object to carry the SAME value). The paired `error` proves
    the mechanism can still go red -- a value neither object carries is rejected.

    This is why "every node in the DaemonSet's coverage advertises X" cannot be written as a
    bare collection assert: on a multi-node cluster, one node satisfying the tree passes the
    whole assertion even if every other node lacks the resource entirely.
    ci/test/chainsaw/scripts/daemonset-node-coverage.sh exists for exactly this gap -- an
    explicit count comparison, not a chainsaw assertion, is what "every node" requires. A
    single-node suite sidesteps the gap only because there is nothing for "any" and "all" to
    disagree about; it is not a chainsaw guarantee and does not generalize the moment a suite
    gains a second node.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-collection-a
            labels:
              test: collection
          data:
            marker: "yes"
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm-collection-b
            labels:
              test: collection
          data:
            marker: "no"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            labels:
              test: collection
          data:
            marker: "yes"
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            labels:
              test: collection
          data:
            marker: "no"
    - error:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            labels:
              test: collection
          data:
            marker: "neither-configmap-has-this-value"
