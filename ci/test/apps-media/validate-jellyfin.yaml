---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-jellyfin
spec:
  try:
  - description: Assert deployment/jellyfin
    assert:
      bindings:
      - name: name
        value: jellyfin
      - name: namespace
        value: media
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Was the inherited 60s default. jellyfin keeps the last slot: five green runs measure
      # it as the slowest component here (95-124s against plex's 84-121s) and it is the
      # second-heaviest image (~661MB). The single readiness report puts it 4s ahead of plex
      # (163 vs 167), which is inside the noise and is not enough to flip a call the larger
      # sample and the census both support. 3m, as for every workload in this suite.
      timeout: 3m
  - podLogs:
      selector: app.kubernetes.io/name=jellyfin
      namespace: media
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: jellyfin
      namespace: media
  - podLogs:
      selector: app.kubernetes.io/name=jellyfin
      namespace: media
  - events:
      namespace: media
