---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-openclaw
spec:
  try:
  - description: Assert pvc/openclaw-data
    assert:
      bindings:
      - name: name
        value: openclaw-data
      - name: namespace
        value: openclaw
      file: ../chainsaw/assertions/pvc-bound.yaml
  - description: Assert externalsecret/openclaw-secrets
    assert:
      bindings:
      - name: name
        value: openclaw-secrets
      - name: namespace
        value: openclaw
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert serviceaccount/openclaw
    assert:
      resource:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: openclaw
          namespace: openclaw
  # Readiness now probes /healthz (decoupled from channel pairing), not the old /readyz which
  # stayed 503 until a messaging channel connected. The only day-one channel is WhatsApp
  # (Baileys pairing), which can't connect in CI -- but since readiness no longer depends on
  # it, the Deployment does reach Available in kind, so we use the shared deployment-ready
  # assertion like every other module. Full readiness against a live WhatsApp session is still
  # validated at rollout.
  - description: Assert deployment/openclaw is ready
    assert:
      bindings:
      - name: name
        value: openclaw
      - name: namespace
        value: openclaw
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Generous: openclaw's startupProbe budget is up to 5m (failureThreshold 30 x 10s) before
      # readiness can even begin; by the time this step is reached the pod has usually long
      # since settled, but keep headroom so a slow image pull/boot doesn't false-fail.
      #
      # openclaw is Ready at T0+400-407, second-slowest measured in this suite, and it is the
      # step that pays for the two ordering exceptions in chainsaw-test.yaml -- open-webui and
      # n8n both asserted behind litellm. It is the only step in the tail that waits, and with
      # both exceptions in place it inherits the gap from obsidian's readiness to its own:
      # 123s measured, 0.34 of this 6m, and the longest step in the suite. It is a plain
      # Deployment assert, which is the point -- with n8n and open-webui both moved behind
      # litellm the tail's whole wait is parked on the widest budget available rather than on
      # a capped one.
      timeout: 6m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: openclaw
      namespace: openclaw
  - podLogs:
      selector: app.kubernetes.io/name=openclaw
      namespace: openclaw
      tail: 200
  - events:
      namespace: openclaw
