---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-mcp-grafana
spec:
  try:
  - description: Assert service/mcp-grafana
    assert:
      resource:
        apiVersion: v1
        kind: Service
        metadata:
          name: mcp-grafana
          namespace: ai
  - description: Assert externalsecret/mcp-grafana-admin-credentials
    assert:
      bindings:
      - name: name
        value: mcp-grafana-admin-credentials
      - name: namespace
        value: ai
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  # apps-ai.yaml's spec.patches swaps this ExternalSecret's spec for a plain
  # secret-store-backed one in CI (the real one needs a live Grafana admin API to mint a
  # token via the Grafana generator) -- see that file for why. Same name/namespace, so
  # this assertion is unchanged either way.
  - description: Assert externalsecret/mcp-grafana-secrets
    assert:
      bindings:
      - name: name
        value: mcp-grafana-secrets
      - name: namespace
        value: ai
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert deployment/mcp-grafana
    assert:
      bindings:
      - name: name
        value: mcp-grafana
      - name: namespace
        value: ai
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 5m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: mcp-grafana
      namespace: ai
  - events:
      namespace: ai
