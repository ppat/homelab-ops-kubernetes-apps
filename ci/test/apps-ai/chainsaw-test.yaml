---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apps-ai
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/apps-ai/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/infra-security-core
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/cloudnative-pg-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cloudnative-pg-release --namespace=cnpg-system --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/dragonfly-operator-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=dragonfly-operator-release --namespace=dragonfly-system --timeout=4m
        timeout: 4m

  - name: Verify mcp-kubernetes RBAC posture
    try:
    - description: Assert mcp-kubernetes-homelab / mcp-kubernetes-nas can-i checks
      script:
        content: ./scripts/check-mcp-kubernetes-rbac.sh
        timeout: 1m
    catch:
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: mcp-kubernetes-readonly

  - name: Build NAS kubeconfig secret
    try:
    - description: Assemble mcp-kubernetes-nas-secrets from the minted mcp-kubernetes-nas token
      script:
        content: ./scripts/build-nas-kubeconfig.sh
        timeout: 2m
    catch:
    - describe:
        apiVersion: v1
        kind: Secret
        name: mcp-kubernetes-nas-token
        namespace: mcp-access
    - events:
        namespace: mcp-access

  - name: Apply apps-ai module
    try:
    - description: Apply apps-ai
      apply:
        file: ./apps-ai.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: apps-ai
        namespace: flux-system
    - events:
        namespace: flux-system

  - name: Validate open-webui
    use:
      template: ./validate-open-webui.yaml

  - name: Validate litellm
    use:
      template: ./validate-litellm.yaml

  - name: Validate network policy
    use:
      template: ./validate-network-policy.yaml

  - name: Validate vault network policies
    use:
      template: ./validate-vault-network-policy.yaml

  # No validate step for the `obsidian` Deployment yet. Its image now resolves to a
  # public, digest-pinned reference, but the readiness chain (Xvfb, Electron, a
  # DevTools attach that disables Restricted Mode) is untested against `kind`'s resource
  # envelope, so a readiness assertion is deliberately withheld rather than shipped
  # unverified. The manifest is still applied and server-side-validated by the Flux
  # Kustomization above; how a desktop-application container should be exercised in CI
  # is an open decision tracked in ppat/homelab-ops-kubernetes-apps#3440.
  - name: Validate mcp-obsidian-agent
    use:
      template: ./validate-mcp-obsidian-agent.yaml

  - name: Validate mcp-obsidian-ingestor
    use:
      template: ./validate-mcp-obsidian-ingestor.yaml

  - name: Validate mcp-context7
    use:
      template: ./validate-mcp-context7.yaml

  - name: Validate mcp-github
    use:
      template: ./validate-mcp-github.yaml

  - name: Validate mcp-playwright
    use:
      template: ./validate-mcp-playwright.yaml

  - name: Validate mcp-grafana
    use:
      template: ./validate-mcp-grafana.yaml

  - name: Validate mcp-home-assistant
    use:
      template: ./validate-mcp-home-assistant.yaml

  - name: Validate mcp-kubernetes-homelab
    use:
      template: ./validate-mcp-kubernetes-homelab.yaml

  - name: Validate mcp-kubernetes-nas
    use:
      template: ./validate-mcp-kubernetes-nas.yaml

  - name: Validate mcp-unifi-network
    use:
      template: ./validate-mcp-unifi-network.yaml

  - name: Validate mcp-unifi-protect
    use:
      template: ./validate-mcp-unifi-protect.yaml

  - name: Validate n8n
    use:
      template: ./validate-n8n.yaml

  - name: Validate openclaw
    use:
      template: ./validate-openclaw.yaml
