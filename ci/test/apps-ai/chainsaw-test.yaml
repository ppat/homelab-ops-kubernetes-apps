---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apps-ai
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/apps-ai/pre-requisites

  - name: Reconcile pre-requisites
    try:
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/cloudnative-pg-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cloudnative-pg-release --namespace=cnpg-system --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/dragonfly-operator-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=dragonfly-operator-release --namespace=dragonfly-system --timeout=4m
        timeout: 4m

  - name: Verify mcp-kubernetes RBAC posture
    try:
    - description: Assert mcp-kubernetes-homelab / mcp-kubernetes-nas / mcp-kubernetes-sandbox can-i checks
      script:
        content: ./scripts/check-mcp-kubernetes-rbac.sh
        timeout: 1m
    catch:
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: mcp-kubernetes-readonly
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: mcp-kubernetes-sandbox-test-admin

  - name: Build remote-cluster kubeconfig secrets
    try:
    - description: Assemble mcp-kubernetes-nas-secrets from the minted mcp-kubernetes-nas token
      script:
        # yamllint disable-line rule:line-length
        content: ./scripts/build-remote-cluster-kubeconfig.sh mcp-kubernetes-nas-token mcp-access mcp-kubernetes-nas-secrets ai nas
        timeout: 2m
    - description: Assemble mcp-kubernetes-sandbox-secrets from the minted mcp-kubernetes-sandbox token
      script:
        # yamllint disable-line rule:line-length
        content: ./scripts/build-remote-cluster-kubeconfig.sh mcp-kubernetes-sandbox-token mcp-access mcp-kubernetes-sandbox-secrets ai sandbox
        timeout: 2m
    catch:
    - describe:
        apiVersion: v1
        kind: Secret
        name: mcp-kubernetes-nas-token
        namespace: mcp-access
    - describe:
        apiVersion: v1
        kind: Secret
        name: mcp-kubernetes-sandbox-token
        namespace: mcp-access
    - events:
        namespace: mcp-access

  - name: Apply apps-ai module
    try:
    - description: Apply apps-ai
      apply:
        file: ./apps-ai.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: apps-ai
        namespace: flux-system
    - events:
        namespace: flux-system

  # `Validate open-webui` stays first, and that is deliberate rather than inherited. Every
  # step between it and `Validate litellm` completes in 0-1s, so moving it later would buy it
  # a head start of essentially nothing, and the obvious swap is unsafe: promoting litellm
  # promotes `cluster/litellm-db-test` with it, whose readiness is censored at a step that
  # starts 218-275s after apply. Handing a 180s budget to a component whose readiness has
  # never been observed is how a reorder invents a failure.
  - name: Validate open-webui
    use:
      template: ./validate-open-webui.yaml

  - name: Validate network policy
    use:
      template: ./validate-network-policy.yaml

  - name: Validate vault network policies
    use:
      template: ./validate-vault-network-policy.yaml

  - name: Validate mcp-obsidian-agent
    use:
      template: ./validate-mcp-obsidian-agent.yaml

  - name: Validate mcp-obsidian-ingestor
    use:
      template: ./validate-mcp-obsidian-ingestor.yaml

  - name: Validate git-committer
    use:
      template: ./validate-git-committer.yaml

  - name: Validate mcp-context7
    use:
      template: ./validate-mcp-context7.yaml

  - name: Validate mcp-github
    use:
      template: ./validate-mcp-github.yaml

  - name: Validate mcp-playwright
    use:
      template: ./validate-mcp-playwright.yaml

  - name: Validate mcp-grafana
    use:
      template: ./validate-mcp-grafana.yaml

  - name: Validate mcp-home-assistant
    use:
      template: ./validate-mcp-home-assistant.yaml

  - name: Validate mcp-kubernetes-homelab
    use:
      template: ./validate-mcp-kubernetes-homelab.yaml

  - name: Validate mcp-kubernetes-nas
    use:
      template: ./validate-mcp-kubernetes-nas.yaml

  - name: Validate mcp-kubernetes-sandbox
    use:
      template: ./validate-mcp-kubernetes-sandbox.yaml

  - name: Verify mcp-kubernetes-sandbox write boundary
    try:
    # Runs only once the Deployment above is Ready: this calls the deployed pod's own
    # /mcp endpoint (not kubectl auth can-i, which the earlier "Verify mcp-kubernetes
    # RBAC posture" step already showed is a "yes" to everything for this identity --
    # see check-mcp-kubernetes-rbac.sh's check_sandbox_identity for why). This is what
    # actually proves the write boundary: a real write through the running server, and a
    # real, refused read of a Secret through it despite read_only = false.
    - description: Create/delete through the pod, and confirm Secret reads stay denied
      script:
        content: ./scripts/check-mcp-kubernetes-rbac.sh --sandbox-write-boundary
        timeout: 2m
    catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: mcp-kubernetes-sandbox
        namespace: ai
    - podLogs:
        selector: app.kubernetes.io/name=mcp-kubernetes-sandbox
        namespace: ai
        tail: 200

  - name: Validate mcp-unifi-network
    use:
      template: ./validate-mcp-unifi-network.yaml

  - name: Validate mcp-unifi-protect
    use:
      template: ./validate-mcp-unifi-protect.yaml

  # litellm moves from second to behind the whole mcp block. It is the slowest component this
  # suite measures -- Ready 287/302/329s after the module is applied, against every mcp-*
  # sidecar returning in 0-1s -- and it is gated on a Helm pre-install hook Job, a CNPG
  # Cluster and a Dragonfly before its own pod can start. The byte census agrees: ~600MB, the
  # heaviest step here after open-webui and openclaw.
  #
  # What this buys is head start for `cluster/litellm-db-test`, whose 3m budget is the one
  # thing in this step that has never been observed waiting. What it costs is that fourteen
  # mcp-* steps each start ~50-115s earlier; their readiness is censored, but every workload
  # among them carries 5m and the rest are Services, ConfigMaps and NetworkPolicies that
  # materialise with the Kustomization. It does not make the suite faster -- Flux starts
  # every pod in parallel, so ordering only decides which assert absorbs the wait.
  - name: Validate litellm
    use:
      template: ./validate-litellm.yaml

  - name: Validate n8n
    use:
      template: ./validate-n8n.yaml

  - name: Validate openclaw
    use:
      template: ./validate-openclaw.yaml

  # This assertion was deliberately withheld (see ppat/homelab-ops-kubernetes-apps#3440)
  # over an untested readiness chain (Xvfb, Electron, a DevTools attach that disables
  # Restricted Mode) and a registry `kind` couldn't pull from. Both reasons are gone: the
  # image is public and digest-pinned, and the chain is proven fast on real hardware --
  # Electron loaded, then the REST API answered about a second later. What forced the
  # issue: a real defect shipped that this assertion would have caught on its first PR.
  # The bundled Local REST API plugin defaults its listener to 127.0.0.1, so the
  # kubelet's probes -- which hit the pod IP, not loopback -- failed every attempt, the
  # startupProbe exhausted its budget, and the container restart-looped in production
  # (`dial tcp <pod-ip>:27124: connect: connection refused`). That is a plain probe
  # failure, not a NetworkPolicy-enforcement gap, so `kind` reproduces it exactly; the
  # blind spot this step closes is what let it through. Placed last: it pulls the
  # heaviest image and has the longest boot chain in the suite, so it should validate
  # after everything else has given its pull the most wall-clock head start for free
  # (see ppat/homelab-ops-kubernetes-apps#3415 on ordering by cost) -- not first, where
  # this suite's known flake source (a slow HelmRelease install) would compound with it.
  - name: Validate obsidian
    use:
      template: ./validate-obsidian.yaml

  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
