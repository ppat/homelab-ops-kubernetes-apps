---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apps-ai
spec:
  steps:
  - name: Bootstrap FluxCD
    use:
      template: ../chainsaw/steps/bootstrap-flux.yaml

  - name: Bootstrap CRDs
    use:
      template: ../chainsaw/steps/bootstrap-crds.yaml

  - name: Bootstrap pre-requisites
    use:
      template: ../chainsaw/steps/bootstrap-prerequisites.yaml
      with:
        bindings:
        - name: prerequisites_path
          value: ./ci/test/apps-ai/pre-requisites

  - name: Reconcile pre-requisites
    try:
    # Waited for explicitly, unlike in suites that get cert-manager for free: the
    # external-secrets fixture this suite composes drops the `dependsOn: cert-manager-release`
    # edge. The broker's Deployment mounts a cert-manager-issued Secret, so without this the
    # pod never starts. 3m matches apps-misc's budget for the same operation; the two waits
    # below run in series but the two installs do not.
    - description: Reconcile helmrelease/cert-manager-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cert-manager-release --namespace=cert-manager --timeout=3m
        timeout: 3m
    - description: Reconcile helmrelease/external-secrets-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=external-secrets-release --namespace=external-secrets --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/cloudnative-pg-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=cloudnative-pg-release --namespace=cnpg-system --timeout=4m
        timeout: 4m
    - description: Reconcile helmrelease/dragonfly-operator-release
      script:
        # yamllint disable-line rule:line-length
        content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=helmrelease --resource-name=dragonfly-operator-release --namespace=dragonfly-system --timeout=4m
        timeout: 4m

  - name: Verify mcp-kubernetes RBAC posture
    try:
    - description: Assert mcp-kubernetes-homelab / mcp-kubernetes-nas / mcp-kubernetes-sandbox can-i checks
      script:
        content: ./scripts/check-mcp-kubernetes-rbac.sh
        timeout: 1m
    catch:
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: mcp-kubernetes-readonly
    - describe:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: mcp-kubernetes-sandbox-test-admin

  - name: Build remote-cluster kubeconfig secrets
    try:
    - description: Assemble mcp-kubernetes-nas-secrets from the minted mcp-kubernetes-nas token
      script:
        # yamllint disable-line rule:line-length
        content: ./scripts/build-remote-cluster-kubeconfig.sh mcp-kubernetes-nas-token mcp-access mcp-kubernetes-nas-secrets ai nas
        timeout: 2m
    - description: Assemble mcp-kubernetes-sandbox-secrets from the minted mcp-kubernetes-sandbox token
      script:
        # yamllint disable-line rule:line-length
        content: ./scripts/build-remote-cluster-kubeconfig.sh mcp-kubernetes-sandbox-token mcp-access mcp-kubernetes-sandbox-secrets ai sandbox
        timeout: 2m
    catch:
    - describe:
        apiVersion: v1
        kind: Secret
        name: mcp-kubernetes-nas-token
        namespace: mcp-access
    - describe:
        apiVersion: v1
        kind: Secret
        name: mcp-kubernetes-sandbox-token
        namespace: mcp-access
    - events:
        namespace: mcp-access

  - name: Apply apps-ai module
    try:
    - description: Apply apps-ai
      apply:
        file: ./apps-ai.yaml
    catch:
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        name: apps-ai
        namespace: flux-system
    - events:
        namespace: flux-system

  # Validate steps are ordered ascending by measured pod readiness. Flux applies the whole
  # module in one shot and every pod converges in parallel, so the order decides only which
  # assert absorbs the wait -- the ~300s of validate time is redistributed, not reduced.
  #
  # Readiness comes from this suite's own `Report readiness ordering` step, in seconds after
  # the first pod in the cluster went Ready (T0), over three runs. The first validate step
  # begins at T0+142 / 143 / 156:
  #
  #   the twelve mcp-* 164-205 / 167-206 / 172-207 . obsidian 275 / 237 / 233 .
  #   n8n-db-test 342 / 342 / 314 . litellm-db-test 356 / 353 / 323 . n8n 353 / 369 / 326 .
  #   open-webui 388 / 384 / 343 . openclaw 407 / 400 / 356 . litellm 443 / 440 / 396
  #
  # The three runs agree on every position except n8n against the two Clusters, which is the
  # one place this file makes an exception; see the tail comment below.
  #
  # What this replaces: `Validate open-webui` ran FIRST while being the second-slowest
  # component in the suite, so the module's entire initial convergence was charged to the one
  # assert least able to afford it -- 240s of its 10m, with every step behind it returning in
  # 0-1s. The previous comment here defended that position from assert durations, which is
  # circular: those steps measured 0s precisely because open-webui had already absorbed the
  # wait. Only the readiness report distinguishes the two.
  #
  # The object-shape asserts lead because they are satisfied the moment kustomize-controller
  # applies the module, well before any pod is Ready -- measured at 2s after the apply step,
  # from the `litellm-openwebui-key` ExternalSecret assert that used to open this suite. That
  # 2s is also why `Validate network policy` keeps a 60s budget rather than a larger one: it
  # is now the step that reports a module that fails to reconcile at all, and 60s is where
  # that signal should land.
  - name: Validate network policy
    use:
      template: ./validate-network-policy.yaml

  - name: Validate vault network policies
    use:
      template: ./validate-vault-network-policy.yaml

  - name: Validate git-committer
    use:
      template: ./validate-git-committer.yaml

  # An object-shape assert like the three above it and placed for the same reason: it reads
  # the applied ConfigMap and waits for no pod, so it absorbs none of the convergence. Kept
  # separate from `Validate obsidian-vault-nats` below, which does wait, so that a widened or
  # typo'd subject grant is reported in seconds rather than behind a broker that may be slow
  # for unrelated reasons.
  - name: Validate obsidian-vault-nats permissions
    use:
      template: ./validate-obsidian-vault-nats-permissions.yaml

  # In the object-shape block for the same reason as the four steps above it: three CronJobs and
  # a ConfigMap are satisfied the moment kustomize-controller applies the module, and the two
  # ExternalSecret waits that open it settle with the rest of ESO's first sync -- the same 2s the
  # block comment above measures for the `litellm-openwebui-key` assert this suite used to open
  # with. Measured in this slot on a local kind rig: every assert in the step, the two
  # ExternalSecret waits included, completes inside the second the step begins -- so it absorbs
  # none of the convergence and would gain nothing from a later position.
  - name: Validate batch-processor
    use:
      template: ./validate-batch-processor.yaml

  # The twelve mcp-* Deployments are Ready within a ~40s band and are ordered inside it by
  # that measurement, but the gaps between neighbours are 0-8s -- smaller than the run-to-run
  # variation two reports can resolve, and four pairs already swap between them. Treat their
  # relative order as arbitrary; what matters is that the block as a whole sits ahead of
  # everything slower. Each already carries an explicit 5m, and the first of them
  # (mcp-context7) is the step that absorbs the module's pod convergence: measured 15s, 0.05.
  - name: Validate mcp-context7
    use:
      template: ./validate-mcp-context7.yaml

  - name: Validate mcp-github
    use:
      template: ./validate-mcp-github.yaml

  - name: Validate mcp-home-assistant
    use:
      template: ./validate-mcp-home-assistant.yaml

  - name: Validate mcp-kubernetes-homelab
    use:
      template: ./validate-mcp-kubernetes-homelab.yaml

  - name: Validate mcp-kubernetes-nas
    use:
      template: ./validate-mcp-kubernetes-nas.yaml

  - name: Validate mcp-playwright
    use:
      template: ./validate-mcp-playwright.yaml

  - name: Validate mcp-kubernetes-sandbox
    use:
      template: ./validate-mcp-kubernetes-sandbox.yaml

  - name: Validate mcp-unifi-protect
    use:
      template: ./validate-mcp-unifi-protect.yaml

  - name: Validate mcp-unifi-network
    use:
      template: ./validate-mcp-unifi-network.yaml

  - name: Validate mcp-obsidian-agent
    use:
      template: ./validate-mcp-obsidian-agent.yaml

  - name: Validate mcp-obsidian-ingestor
    use:
      template: ./validate-mcp-obsidian-ingestor.yaml

  - name: Validate mcp-grafana
    use:
      template: ./validate-mcp-grafana.yaml

  # At the tail of the band above on measured readiness, not appended to the end: T0+146 and
  # T0+151 over two runs, against T0+103-150 for the twelve mcp-* pods and T0+201 for obsidian
  # in both. Its position *inside* the band is as arbitrary as theirs and swaps with
  # mcp-unifi-protect between the two runs; what both settle, and what this slot turns on, is
  # the 50s gap to everything behind it. Those readings are from a local kind rig, so their T0
  # scale is not the one the block comment above quotes. The pod waits on no volume and no
  # other workload -- a ~45s image pull is its whole cost to reach Ready.
  - name: Validate vault-loaded-exporter
    use:
      template: ./validate-vault-loaded-exporter.yaml

  # This assertion was deliberately withheld (see ppat/homelab-ops-kubernetes-apps#3440)
  # over an untested readiness chain (Xvfb, Electron, a DevTools attach that disables
  # Restricted Mode) and a registry `kind` couldn't pull from. Both reasons are gone: the
  # image is public and digest-pinned, and the chain is proven fast on real hardware --
  # Electron loaded, then the REST API answered about a second later. What forced the
  # issue: a real defect shipped that this assertion would have caught on its first PR.
  # The bundled Local REST API plugin defaults its listener to 127.0.0.1, so the
  # kubelet's probes -- which hit the pod IP, not loopback -- failed every attempt, the
  # startupProbe exhausted its budget, and the container restart-looped in production
  # (`dial tcp <pod-ip>:27124: connect: connection refused`). That is a plain probe
  # failure, not a NetworkPolicy-enforcement gap, so `kind` reproduces it exactly; the
  # blind spot this step closes is what let it through.
  #
  # It no longer runs last. The placement argument used to be "heaviest image, longest boot
  # chain, so give it the most head start"; the readiness report puts obsidian at T0+275 and
  # T0+237, mid-pack, ahead of n8n, openclaw, litellm and open-webui. That was a prediction
  # from image bytes, and bytes lost to measurement here -- 30s of its 6m budget in this slot.
  - name: Validate obsidian
    use:
      template: ./validate-obsidian.yaml

  # Ready at T0+259, between obsidian and openclaw, so this slot is strict ascending order
  # against the two steps that follow. It sits here rather than with the mcp-* block despite
  # carrying the module's two smallest images: the pod is Ready ~22s after its claim binds on
  # an uncontended cluster, and the rest is queueing behind twenty-odd other image pulls on a
  # four-core node. Image bytes do not predict position in this suite; only the readiness
  # report does. The step's exposure is the Deployment assert alone -- the ExternalSecret and
  # Certificate ahead of it return in 0s from this slot -- so promoting it would only charge
  # that wait to a step that cannot use it.
  - name: Validate obsidian-vault-nats
    use:
      template: ./validate-obsidian-vault-nats.yaml

  # The tail deviates from strict ascending readiness twice, both times for a reason that is
  # not readiness, and both are one block move away from being reversed.
  #
  # 1. open-webui (388) is asserted AFTER litellm (443). litellm is late because of what it
  #    waits on -- a CNPG Cluster Ready at T0+353-356, a Dragonfly at ~190, a Helm pre-install
  #    hook Job -- so its readiness is roughly fixed wherever the step sits. open-webui is late
  #    because of a 1.77GB image pull, the highest-variance quantity in the suite: 208/238/270s
  #    green and three runs censored at the old 300s budget. The high-variance component goes
  #    where the whole suite's elapsed time is already working for it. Measured over two runs
  #    this costs nothing -- open-webui's whole step returns in 0s from a T0+440 start, where
  #    strict-mean order leaves it waiting ~35s -- and openclaw pays 30-123s of a 6m budget.
  #    Alternative (strict mean order): ... -> open-webui -> openclaw -> litellm. It is the
  #    better order only if open-webui's pull turns out to be stable.
  #
  # 2. n8n (369) is asserted AFTER litellm (440) even though it is Ready first, because the
  #    step's exposure is not on its slowest object but on its FIRST one, and n8n's first
  #    assert is `cluster/n8n-db-test` on a 3m budget that must not be raised
  #    (ppat/homelab-ops-kubernetes-apps#3678 -- those failures are an operator that never
  #    begins reconciling, and a bigger number would hide it).
  #
  #    This was tried the other way and measured. Promoted to directly behind obsidian, the
  #    n8n step took 133s, of which the Cluster assert alone was 105s -- 0.58 of a budget that
  #    cannot be raised, on a suite that had no such exposure before the reorder. The prior
  #    step's own variance is what did it: obsidian was Ready at T0+237 on that run against
  #    T0+275 on the previous one, so the Cluster assert inherited 38s less head start than
  #    predicted. Behind litellm the same assert measures 0s with 87s of margin, and the whole
  #    n8n step measures 0s.
  #
  #    This does not weaken #3678 detection. A Cluster that never reconciles consumes the full
  #    180s from wherever the step starts, so the late slot preserves the whole budget for
  #    reporting inaction instead of spending 0.58 of it on ordinary parallel convergence.
  #    What it costs is that n8n's own readiness goes back to being censored on green runs;
  #    the readiness report is what covers that, and it is why this is recoverable.
  - name: Validate openclaw
    use:
      template: ./validate-openclaw.yaml

  - name: Validate litellm
    use:
      template: ./validate-litellm.yaml

  - name: Validate n8n
    use:
      template: ./validate-n8n.yaml

  - name: Validate open-webui
    use:
      template: ./validate-open-webui.yaml

  # Deliberately last, and not on readiness grounds. This is not an assertion about a
  # component being up - the Deployment assert above already covers that - it drives a live
  # request through the running pod to the Kubernetes API and back. That makes it an
  # end-to-end check, and those belong at the end regardless of what they cost, for the same
  # reason `Validate bitwarden release` does in its suite.
  #
  # It was briefly moved up with the rest of the mcp block and failed there:
  #
  #   failed to create or update resources: Get "https://kubernetes.default.svc/api?timeout=10s":
  #   context deadline exceeded
  #
  # The pod was Ready; the cluster was not quiet. The MCP server's own client gives the API
  # ten seconds, and roughly ninety seconds into a module rollout on a four-core runner that
  # is not always enough. Its previous position happened to be safe only because the step
  # ahead of it used to absorb 240s of convergence - which is exactly the kind of accidental
  # protection this whole reordering exercise keeps uncovering.
  - name: Verify mcp-kubernetes-sandbox write boundary
    try:
    # Runs only once the Deployment above is Ready: this calls the deployed pod's own
    # /mcp endpoint (not kubectl auth can-i, which the earlier "Verify mcp-kubernetes
    # RBAC posture" step already showed is a "yes" to everything for this identity --
    # see check-mcp-kubernetes-rbac.sh's check_sandbox_identity for why). This is what
    # actually proves the write boundary: a real write through the running server, and a
    # real, refused read of a Secret through it despite read_only = false.
    - description: Create/delete through the pod, and confirm Secret reads stay denied
      script:
        content: ./scripts/check-mcp-kubernetes-rbac.sh --sandbox-write-boundary
        timeout: 2m
    catch:
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        name: mcp-kubernetes-sandbox
        namespace: ai
    - podLogs:
        selector: app.kubernetes.io/name=mcp-kubernetes-sandbox
        namespace: ai
        tail: 200

  - name: Report readiness ordering
    use:
      template: ../chainsaw/steps/report-readiness.yaml
