---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-obsidian-vault-nats-permissions
spec:
  try:
  # This asserts the ARTIFACT -- that the grant strings production ships are the intended
  # ones. obsidian-tools proves the MECHANISM, a scoped credential refused at a foreign
  # subject on a real nats-server. Do NOT add a NATS client here to re-prove the mechanism:
  # that would put a second, weaker copy of that test in the repo that does not own it, and
  # a green run would then be evidence about the fixture rather than about production.
  #
  # Each grant is matched as a whole literal line, so a widened subject, a typo, an added
  # `$JS.API.>` or a grant pointed at another message shape all fail. The three counts are
  # what catch an ADDITION rather than an edit: every user needs a password, so a sixth
  # `password: $NATS_` is a sixth user, and three permission blocks with three subscribe
  # grants mean no producer user can be added without one. The subscribe count is matched on
  # the key prefix alone so a `deny:` block swapped in cannot satisfy it. That count also
  # constrains the config file's own prose -- a comment quoting the grant text literally
  # counts as a grant, which is why the config describes the empty-allow-list trap rather
  # than writing it out.
  #
  # Asserted by unsuffixed name, which depends on `disableNameSuffixHash` in the module's
  # kustomization.yaml -- see there for why that is load-bearing rather than incidental.
  - description: Assert configmap/obsidian-vault-nats-config carries each producer's grant verbatim
    assert:
      resource:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: obsidian-vault-nats-config
          namespace: ai
          # Asserted because losing it is silent: without it Flux substitutes the config's
          # five bare `$NAME` hash references to empty strings and the broker comes up with
          # blank passwords.
          annotations:
            kustomize.toolkit.fluxcd.io/substitute: disabled
        # yamllint disable rule:line-length
        "(contains(data.\"nats-server.conf\", 'publish:   { allow: [ \"batch.>\" ] }'))": true
        "(contains(data.\"nats-server.conf\", 'publish:   { allow: [ \"promotion.>\" ] }'))": true
        "(contains(data.\"nats-server.conf\", 'publish:   { allow: [ \"drift.>\" ] }'))": true
        "(contains(data.\"nats-server.conf\", '{ service: \"batch.>\", accounts: [ PRODUCER_BATCH ] }'))": true
        "(contains(data.\"nats-server.conf\", '{ service: \"promotion.>\", accounts: [ PRODUCER_PROMOTION ] }'))": true
        "(contains(data.\"nats-server.conf\", '{ service: \"drift.>\", accounts: [ PRODUCER_DRIFT ] }'))": true
        "(contains(data.\"nats-server.conf\", 'subscribe: { allow: [ \"_INBOX_BATCH.*.*\" ] }'))": true
        "(contains(data.\"nats-server.conf\", 'subscribe: { allow: [ \"_INBOX_PROMOTION.*.*\" ] }'))": true
        "(contains(data.\"nats-server.conf\", 'subscribe: { allow: [ \"_INBOX_DRIFT.*.*\" ] }'))": true
        # `length(split(...))` is occurrences + 1: five users, three permission blocks,
        # three subscribe grants.
        "(length(split(data.\"nats-server.conf\", 'password: $NATS_')))": 6
        "(length(split(data.\"nats-server.conf\", 'permissions: {')))": 4
        "(length(split(data.\"nats-server.conf\", 'subscribe: { allow:')))": 4
        # yamllint enable rule:line-length
  # `catch` is a sibling of `try` on the StepTemplate spec, not a key inside a try entry --
  # see validate-git-committer.yaml. Nesting it one level deeper fails the whole suite at
  # load time, before any test in this directory runs.
  catch:
  - describe:
      apiVersion: v1
      kind: ConfigMap
      name: obsidian-vault-nats-config
      namespace: ai
  - events:
      namespace: ai
