---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-brain-network-policy
spec:
  try:
  # kind's default CNI (kindnetd) does not implement NetworkPolicy enforcement, so these
  # can only assert the objects exist and are shaped as expected. That gap matters more
  # here than for the `ai` namespace's policy: obsidian-ingress is the *sole* control on
  # the Local REST API's undisableable /mcp/ endpoint, so "the policy is enforced" has to
  # be proven by deliberate violation on a real cluster -- see TESTING.md and the epic's
  # Phase 0 injection list.
  - description: Assert networkpolicy/default-deny-ingress
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-ingress
          namespace: obsidian-brain
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
  - description: Assert networkpolicy/mcp-obsidian-ingress
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: mcp-obsidian-ingress
          namespace: obsidian-brain
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-server
          policyTypes:
          - Ingress
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ai
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
                  app.kubernetes.io/instance: litellm
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
  - description: Assert networkpolicy/obsidian-ingress
    assert:
      resource:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: obsidian-ingress
          namespace: obsidian-brain
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: obsidian
          policyTypes:
          - Ingress
          ingress:
          - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: mcp-server
  catch:
  - events:
      namespace: obsidian-brain
