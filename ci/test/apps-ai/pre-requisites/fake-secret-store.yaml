---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      - key: "litellm_master_key"
        value: "example"
      - key: "litellm_salt_key"
        value: "example"
      - key: "apikey_openrouter_litellm"
        value: "example"
      - key: "litellm_redis_password"
        value: "not-a-secure-password"
      - key: "apikey_context7_mcp"
        value: "example"
      - key: "github_pat_mcp"
        value: "example"
      - key: "apikey_litellm_openwebui"
        value: "example"
      - key: "grafana_service_account_token_mcp"
        value: "example"
      - key: "cluster_homelab_grafana_admin_password"
        value: "example"
      - key: "unifi_network_username_mcp"
        value: "example"
      - key: "unifi_network_password_mcp"
        value: "example"
      - key: "unifi_protect_username_mcp"
        value: "example"
      - key: "unifi_protect_password_mcp"
        value: "example"
      - key: "homeassistant_token_mcp"
        value: "example"
      - key: "n8n_encryption_key"
        value: "example"
      - key: "n8n_owner_password_hash"
        # n8n 2.31.6 hard-validates N8N_INSTANCE_OWNER_PASSWORD_HASH against a bcrypt regex
        # (^\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}$) on every boot under
        # N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true and exits if it fails; a plain "example"
        # crashloops the pod so the Deployment never becomes Ready. This is a throwaway
        # format-valid dummy hash (CI only), not a real credential.
        value: "$2b$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
      - key: "n8n_credentials_overwrite"
        value: "{}"
      - key: "apikey_litellm_n8n"
        value: "example"
      - key: "n8n_owner_email"
        value: "admin@example.com"
      - key: "n8n_smtp_sender"
        value: "n8n@example.com"
      - key: "n8n_smtp_user"
        value: "example"
      - key: "n8n_smtp_password"
        value: "example"
      - key: "openclaw_gateway_token"
        value: "example"
      - key: "apikey_litellm_openclaw"
        value: "example"
      - key: "obsidian_rest_api_key"
        value: "example"
      # cyanheads/obsidian-mcp-server hard-requires MCP_AUTH_SECRET_KEY to be >=32
      # characters when MCP_AUTH_MODE=jwt and exits at startup otherwise, so a plain
      # "example" would crashloop both MCP pods. Throwaway CI padding, not a credential.
      - key: "obsidian_agent_mcp_auth_secret"
        value: "example-ci-only-not-a-secret-0000000000"
      - key: "obsidian_ingestor_mcp_auth_secret"
        value: "example-ci-only-not-a-secret-1111111111"
      - key: "obsidian_agent_mcp_jwt"
        value: "example"
      - key: "obsidian_ingestor_mcp_jwt"
        value: "example"
      # Throwaway CI-only values, not real credentials -- the git-committer CronJob never
      # actually reaches a remote in this suite (see apps-ai.yaml's dummy
      # GIT_REMOTE_*_URL substitutions), so this only needs to exist as a file at the
      # mounted path. Deliberately not PEM-shaped: a real-looking
      # "-----BEGIN ... PRIVATE KEY-----" block trips the detect-private-key pre-commit
      # hook even when the body is obvious placeholder text.
      - key: "obsidian_git_committer_ssh_private_key"
        value: "example-ci-only-not-a-real-key-0000000000000000000000000000000"
      - key: "obsidian_git_committer_known_hosts"
        value: "example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleCIOnlyNotARealHostKey"
