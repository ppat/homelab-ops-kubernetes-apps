---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      - key: "litellm_master_key"
        value: "example"
      - key: "litellm_salt_key"
        value: "example"
      - key: "apikey_openrouter_litellm"
        value: "example"
      - key: "litellm_redis_password"
        value: "not-a-secure-password"
      - key: "apikey_context7_mcp"
        value: "example"
      - key: "apikey_litellm_openwebui"
        value: "example"
      - key: "grafana_service_account_token_mcp"
        value: "example"
      - key: "unifi_network_username_mcp"
        value: "example"
      - key: "unifi_network_password_mcp"
        value: "example"
      - key: "unifi_protect_username_mcp"
        value: "example"
      - key: "unifi_protect_password_mcp"
        value: "example"
      - key: "homeassistant_token_mcp"
        value: "example"
      - key: "n8n_encryption_key"
        value: "example"
      - key: "n8n_owner_password_hash"
        # n8n 2.31.6 hard-validates N8N_INSTANCE_OWNER_PASSWORD_HASH against a bcrypt regex
        # (^\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}$) on every boot under
        # N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true and exits if it fails; a plain "example"
        # crashloops the pod so the Deployment never becomes Ready. This is a throwaway
        # format-valid dummy hash (CI only), not a real credential.
        value: "$2b$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy"
      - key: "n8n_credentials_overwrite"
        value: "{}"
      - key: "apikey_litellm_n8n"
        value: "example"
      - key: "n8n_owner_email"
        value: "admin@example.com"
      - key: "n8n_smtp_sender"
        value: "n8n@example.com"
      - key: "n8n_smtp_user"
        value: "example"
      - key: "n8n_smtp_password"
        value: "example"
      - key: "openclaw_gateway_token"
        value: "example"
      - key: "apikey_litellm_openclaw"
        value: "example"
      - key: "openclaw_hooks_token"
        value: "example"
      - key: "openclaw_owner_whatsapp_number"
        value: "+10000000000"
