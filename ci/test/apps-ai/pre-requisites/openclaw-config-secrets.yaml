---
# Stands in for the cluster-provided `openclaw-config-secrets` ExternalSecret (co-located with
# the cluster-owned openclaw.json) so the openclaw Deployment's secretKeyRefs resolve in CI.
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-config-secrets
  namespace: openclaw
type: Opaque
stringData:
  OPENCLAW_HOOKS_TOKEN: example
  OWNER_WHATSAPP_NUMBER: "+10000000000"
