---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../infrastructure/bootstrap/crds/
- namespaces.yaml
- pvc/
# Three shared fixtures in place of the whole database-core and security-core modules.
# Audited against the module: `apps/subsystems/ai` ships two `Cluster` objects (litellm,
# n8n), one `Dragonfly` (litellm's cache) and eleven `ExternalSecret` objects, and no
# `Certificate` or `Issuer` at all -- nothing under the module references cert-manager.io
# or `${cert_issuer}` -- so cert-manager is deliberately not composed here even though
# security-core was installing it.
#
# The cnpg-operator fixture omits the Barman Cloud plugin. Neither `Cluster` declares a
# plugin and this suite applies neither components/db-backups nor components/db-restore,
# so nothing here reaches the barmancloud.cnpg.io API.
#
# See ../../chainsaw/pre-requisites/README.md.
- ../../chainsaw/pre-requisites/cnpg-operator/
- ../../chainsaw/pre-requisites/dragonfly-operator/
- ../../chainsaw/pre-requisites/external-secrets/
- fake-secret-store.yaml
- mcp-kubernetes-rbac.yaml
- openclaw-config.yaml
- openclaw-config-secrets.yaml

sortOptions:
  order: fifo
