---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../infrastructure/bootstrap/crds/
- namespaces.yaml
- pvc/
- ../../infra-database/infra-database-core.yaml
- ../../infra-security/infra-security-core.yaml
- fake-secret-store.yaml

patches:
# Trim the security-core fixture to cert-manager + external-secrets, which is all any suite
# other than infra-security depends on. The patch file states what goes and why each removal
# leaves nothing untested.
- path: ../../chainsaw/patches/trim-infra-security-core.yaml
  target:
    kind: Kustomization
    name: infra-security-core
# yamllint disable-line rule:indentation
- patch: |-
    - op: replace
      path: /spec/path
      value: ./infrastructure/subsystems/database-core/cloudnative-pg
  target:
    kind: Kustomization
    name: infra-database-core

sortOptions:
  order: fifo
