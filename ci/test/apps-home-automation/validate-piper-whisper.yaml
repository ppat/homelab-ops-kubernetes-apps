---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-piper-whisper
spec:
  try:
  - description: Assert deployment/wyoming-piper
    assert:
      bindings:
      - name: name
        value: wyoming-piper
      - name: namespace
        value: home-automation
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Was the inherited 60s default, set when both of these were censored -- they returned
      # in 0s on all 5 green runs, proving only "ready by then". The readiness report has now
      # produced the real numbers: wyoming-whisper T0+176, wyoming-piper T0+187, both ahead of
      # the CNPG Cluster at T0+207. So this step moves ahead of `Validate database` and is the
      # step that waits. piper is the later of the two, so this assert absorbs the whole gap
      # -- ~45s predicted, 0.25 of 3m -- and the whisper assert below it then returns in 0s.
      timeout: 3m
  - description: Assert deployment/wyoming-whisper
    assert:
      bindings:
      - name: name
        value: wyoming-whisper
      - name: namespace
        value: home-automation
      file: ../chainsaw/assertions/deployment-ready.yaml
      # Same reasoning and same evidence as wyoming-piper above.
      timeout: 3m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: wyoming-piper
      namespace: home-automation
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: wyoming-whisper
      namespace: home-automation
  - podLogs:
      selector: app.kubernetes.io/name=wyoming-piper
      namespace: home-automation
  - podLogs:
      selector: app.kubernetes.io/name=wyoming-whisper
      namespace: home-automation
  - events:
      namespace: home-automation
