---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-git-committer
spec:
  try:
  # A CronJob has no "Ready" condition/replica count to wait on the way a Deployment
  # does (see ../chainsaw/assertions/deployment-ready.yaml), and this suite has no
  # fixture vault with committable changes or a reachable remote to push to -- so
  # unlike every other validate-*.yaml step here, this doesn't wait for anything to
  # run; it asserts the object's shape the moment Flux creates it. Whether triggering
  # a one-off Job from this template and asserting a terminal state is worth adding
  # once such a fixture exists is discussed in this change's PR description.
  #
  # The readOnly: true assertion on the vault mount is the one that matters: it's the
  # structural half of the single-writer invariant (this module's README, "Single-writer
  # invariant"; ppat/homelab-ops-kubernetes-apps#3443), and this assertion is what turns
  # "a future patch didn't silently drop it" into something CI actually catches rather
  # than something only a manifest read would catch.
  - description: Assert cronjob/git-committer shape
    assert:
      resource:
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: git-committer
          namespace: obsidian-vault
        spec:
          schedule: "*/15 * * * *"
          timeZone: Etc/UTC
          # Forbid, not Replace -- see cronjob.yaml for why this diverges from
          # ../../downloaders/recyclarr/cronjob.yaml, this repo's only other CronJob.
          concurrencyPolicy: Forbid
          jobTemplate:
            spec:
              template:
                spec:
                  restartPolicy: OnFailure
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch
                    seccompProfile:
                      type: RuntimeDefault
                  (containers[?name == 'git-committer'] | [0].securityContext):
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                      - ALL
                  # The structural guarantee: this workload cannot become a second
                  # writer of vault content because the mount itself refuses writes,
                  # independent of anything the container's own code does.
                  (containers[?name == 'git-committer'] | [0].volumeMounts[?name == 'vault'] | [0].readOnly): true
                  (containers[?name == 'git-committer'] | [0].volumeMounts[?name == 'vault'] | [0].mountPath): /vault
                  (volumes[?name == 'vault'] | [0].persistentVolumeClaim.claimName): vault-data
                  (volumes[?name == 'vault'] | [0].persistentVolumeClaim.readOnly): true
                  (volumes[?name == 'git-dir'] | [0].persistentVolumeClaim.claimName): vault-git-cache
  # `catch` is a sibling of `try` on the StepTemplate spec, not a key inside a try
  # entry -- see validate-obsidian.yaml. Nesting it one level deeper fails the whole
  # suite at load time with "spec.try[0].catch: Invalid value: value provided for
  # unknown field", so a single malformed file stops every other test in this
  # directory from running at all, not just this one.
  catch:
  - describe:
      apiVersion: batch/v1
      kind: CronJob
      name: git-committer
      namespace: obsidian-vault
  - events:
      namespace: obsidian-vault
