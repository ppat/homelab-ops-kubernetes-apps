---
# Exactly the fourteen keys this module's ExternalSecrets read, and no more. Derived by
# grepping the module's own `remoteRef.key` values rather than by copying another suite's
# store: an extra key here is dead weight, and a missing one leaves an ExternalSecret that
# never syncs and a validate step that times out with nothing saying why.
#
# `litellm_master_key` is shared with `ci/test/apps-ai`'s store rather than moved out of it.
# The gateway reads it in that module and `batch-processor`/`batch-mode-watchdog` read it in
# this one, so it must exist in BOTH stores.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake
spec:
  provider:
    fake:
      data:
      - key: "obsidian_rest_api_key"
        value: "example"
      # cyanheads/obsidian-mcp-server hard-requires MCP_AUTH_SECRET_KEY to be >=32
      # characters when MCP_AUTH_MODE=jwt and exits at startup otherwise, so a plain
      # "example" would crashloop both MCP pods. Throwaway CI padding, not a credential.
      - key: "obsidian_agent_mcp_auth_secret"
        value: "example-ci-only-not-a-secret-0000000000"
      - key: "obsidian_ingestor_mcp_auth_secret"
        value: "example-ci-only-not-a-secret-1111111111"
      # Throwaway CI-only values, not real credentials -- the git-committer CronJob never
      # actually reaches a remote in this suite (see apps-obsidian-vault.yaml's dummy
      # GIT_REMOTE_ORIGIN_URL substitution), so this only needs to exist as a file at the
      # mounted path. Deliberately not PEM-shaped: a real-looking
      # "-----BEGIN ... PRIVATE KEY-----" block trips the detect-private-key pre-commit
      # hook even when the body is obvious placeholder text.
      - key: "obsidian_git_committer_ssh_private_key"
        value: "example-ci-only-not-a-real-key-0000000000000000000000000000000"
      # The broker's account passwords, as bcrypt hashes. These must be format-valid
      # bcrypt, not "example", and the failure mode if they are not is quiet: nats-server
      # accepts an unhashed value as a plaintext password, starts normally, emits only
      # `Plaintext passwords detected, use nkeys or bcrypt`, and the suite passes while
      # proving nothing about the shape production runs.
      #
      # Throwaway CI-only hashes of obvious non-secrets ("ci-only-not-a-secret-<user>"),
      # generated with `nats server passwd -p`.
      - key: "obsidian_vault_nats_sysadmin_password_hash"
        value: "$2a$11$7h9GcgXixMmeQPTLQRnG2.5gfRonuj2pdrC3SqONWl1aYKReKaDJS"
      - key: "obsidian_vault_nats_queue_admin_password_hash"
        value: "$2a$11$lka/ks46RoUMV2puerIBMeN67uPwYPSuY0wXgDevB702oBL1NWp3i"
      - key: "obsidian_vault_nats_batch_producer_password_hash"
        value: "$2a$11$4q4W4PhjSa4deGh4HrT8qenCZEmPQeVoOD35wfX5rhRkvOMOTIpUu"
      - key: "obsidian_vault_nats_promotion_producer_password_hash"
        value: "$2a$11$enE3pd1RWKGrvRRFhZkE/OVJVcLl.F4cg3wNo93r2cNorDzKJi0Sq"
      - key: "obsidian_vault_nats_drift_producer_password_hash"
        value: "$2a$11$lYcBmoI0lN3/w.xaLrKpcu8dFTrNtSfjPeWTJdeyJb7jiuiKoTDP."
      - key: "obsidian_vault_nats_batch_processor_password_hash"
        value: "$2a$11$I2/wNTZRho1CCGVMflhsBO8KLLw3R6e3MdaNRj1rxknat..iHuwDO"
      # The consumer's own three. Plaintext this time, not a hash: these are presented by
      # batch-processor rather than verified by the broker. Nothing in this suite connects to
      # the broker or the gateway, so the values only need to exist for the ExternalSecrets to
      # sync.
      - key: "obsidian_vault_nats_batch_processor_password"
        value: "example"
      - key: "apikey_litellm_batch_processor"
        value: "example"
      - key: "litellm_master_key"
        value: "example"
      - key: "litellm_obsidian_agent_handle_key"
        value: "example"
