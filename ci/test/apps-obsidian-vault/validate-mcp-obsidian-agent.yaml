---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-mcp-obsidian-agent
spec:
  try:
  # Readiness here proves the server booted and its unauthenticated /healthz answers --
  # not that it can reach Obsidian. This server connects to the REST API lazily rather
  # than at startup, so its own readiness says nothing about that path; obsidian's own
  # readiness is asserted separately (see "Validate obsidian" in chainsaw-test.yaml).
  - description: Assert deployment/mcp-obsidian-agent
    assert:
      bindings:
      - name: name
        value: mcp-obsidian-agent
      - name: namespace
        value: obsidian-vault
      file: ../chainsaw/assertions/deployment-ready.yaml
      timeout: 5m
  catch:
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: mcp-obsidian-agent
      namespace: obsidian-vault
  - events:
      namespace: obsidian-vault
