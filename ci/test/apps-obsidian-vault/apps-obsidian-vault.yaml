---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-obsidian-vault
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./apps/subsystems/obsidian-vault
  prune: false
  postBuild:
    substitute:
      secret_store: fake
      # Provided by ../chainsaw/pre-requisites/cert-manager/, composed into this suite's
      # pre-requisites.
      cert_issuer: selfsigned-issuer
      domain_name: cluster.example.com
      # Deliberately unreachable -- this suite only asserts the CronJob's shape (see
      # validate-git-committer.yaml), never a triggered run, so this just needs to be a
      # valid-looking value the env substitution can render.
      git_committer_remote_origin_url: git@example.com:example/unreachable-in-ci.git
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
  # No `patches`. Every object in this module renders and applies as production ships it: the
  # module's ExternalSecrets all read plain keys from the fake store, and nothing here depends
  # on a live external service the way apps-ai's Grafana generator and remote-cluster
  # kubeconfigs do. If a patch ever becomes necessary, note that Flux applies `spec.patches`
  # BEFORE `postBuild.substitute`.
