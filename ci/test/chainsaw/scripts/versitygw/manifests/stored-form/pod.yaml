---
apiVersion: v1
kind: Pod
metadata:
  name: ${STORED_FORM_POD}
  namespace: ${STORED_FORM_NAMESPACE}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: inspect
    image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
    command: [python3, /inspect/inspect.py]
    env:
    - name: BUCKET_ONE
      value: ${STORED_FORM_BUCKET}
    - name: CLIENT1_ACCESS
      value: ${STORED_FORM_OWNER}
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: data
      mountPath: /pvc
    - name: inspect
      mountPath: /inspect
      readOnly: true
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: data
    persistentVolumeClaim:
      # Defaulted only so CI's kubeconform pass over ci/test, which knows the modules'
      # variables and not the fixtures', renders a string rather than a null.
      claimName: ${STORED_FORM_CLAIM:=claim-name-was-not-supplied}
  - name: inspect
    configMap:
      name: versitygw-stored-form
      defaultMode: 0555
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
