---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: bootstrap-prerequisites
spec:
  bindings:
  - name: namespace
    value: flux-system
  try:
  - description: Create kustomization/pre-requisites
    apply:
      resource:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: pre-requisites
          namespace: flux-system
        spec:
          interval: 1m0s
          path: ($prerequisites_path)
          prune: false
          sourceRef:
            kind: GitRepository
            name: test-source
  - description: Assert kustomization/pre-requisites
    assert:
      bindings:
      - name: name
        value: pre-requisites
      file: ../chainsaw/assertions/kustomization-ready.yaml
  - description: Reconcile kustomization/pre-requisites
    script:
      # 2m against a measured worst case of 16.2s across 75 runs (all 16 suites). The
      # previous 6m was never approached by a factor of 22, which made it useless as a
      # statement of what this step should cost: `pre-requisites` sets no `wait`, so this
      # only builds and applies the fixture objects and never waits for any of them to
      # become healthy. A budget nothing can reach cannot detect a regression.
      # yamllint disable-line rule:line-length
      content: ../chainsaw/scripts/flux-reconcile.sh --resource-type=kustomization --resource-name=pre-requisites --timeout=2m
      timeout: 2m
  catch:
  - describe:
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: pre-requisites
      namespace: flux-system
  - events:
      namespace: '*'
