---
# yamllint disable rule:line-length
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: report-readiness
spec:
  # Emits the suite's observed readiness ordering on runs that PASS. Nothing else does:
  # the shared `catch` block in .chainsaw.yaml only fires on failure, and a validate step
  # that returns in 0.1s tells you its component was ready by then, not when it became
  # ready. Roughly two thirds of this repo's validate assertions are censored that way, so
  # step order and timeout budgets could previously only be tuned from failed runs -- a
  # sample biased entirely toward slow ones.
  #
  # Purely diagnostic: it asserts nothing and cannot fail the suite. Belongs last in every
  # suite, so the times it reports are final.
  try:
  - description: Report pod readiness ordering
    script:
      timeout: 1m
      content: |
        echo '--- pod Ready transitions, ascending (offsets relative to first pod ready) ---'
        kubectl get pods -A -o go-template='{{range .items}}{{$p := printf "%s/%s" .metadata.namespace .metadata.name}}{{range .status.conditions}}{{if eq .type "Ready"}}{{printf "%s %s %s\n" .lastTransitionTime .status $p}}{{end}}{{end}}{{end}}' | sort | awk '{ cmd = "date -d " $1 " +%s"; cmd | getline t; close(cmd); if (base == "") base = t; printf "T0+%-6d %-8s %s\n", t - base, $2, $3 }'
