---
# yamllint disable rule:line-length
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: report-readiness
spec:
  # Emits the suite's observed readiness ordering, container restarts and image-pull durations
  # on runs that PASS. Nothing else does: the shared `catch` block in .chainsaw.yaml only fires
  # on failure, and a validate step that returns in 0.1s tells you its component was ready by
  # then, not when it became ready. Roughly two thirds of this repo's validate assertions are
  # censored that way, so step order and timeout budgets could previously only be tuned from
  # failed runs -- a sample biased entirely toward slow ones.
  #
  # The catch block runs the SAME script, so passing and failing runs emit one format. They did
  # not before, and the divergence was not cosmetic: the failing side carried no restart counts,
  # which is the evidence that separates a component that was late from one that was crashing.
  #
  # Purely diagnostic: it asserts nothing and cannot fail the suite. Belongs last in every
  # suite, so the times it reports are final.
  try:
  - description: Report readiness, restarts and image pulls
    script:
      # 5m: nine kubectl calls each capped at --request-timeout=30s inside the script, so the
      # construction's own ceiling is 270s. Free on a passing run -- the script returns when it
      # is done, not when the budget expires. Was 3m against five calls, raised with the four
      # that carry the MODE/ESOCERT/ESOLOG capture.
      timeout: 5m
      content: ../chainsaw/scripts/report-readiness.sh
  # Closes the pair opened in bootstrap-flux.yaml. Two readings, not one, because the quantity
  # wanted is whether the runner was contended *during* this suite; a single sample at t=0
  # cannot distinguish a run that started loaded from one that became loaded.
  - description: Report runner contention at suite end
    script:
      timeout: 90s
      content: ../chainsaw/scripts/report-contention.sh end
