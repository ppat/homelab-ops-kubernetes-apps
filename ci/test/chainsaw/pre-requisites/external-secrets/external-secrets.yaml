---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pre-requisites-external-secrets
  namespace: flux-system
spec:
  interval: 15m0s
  # The component directory, not ./infrastructure/subsystems/security-core -- which would also
  # bring cert-manager and kyverno.
  path: ./infrastructure/subsystems/security-core/external-secrets
  prune: false
  # Flux defaults retryInterval to `interval` when unset, so at 15m0s a single transient
  # failure parks this object for longer than any suite runs. See ../README.md and #3685.
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  # The consumer waits on helmrelease/external-secrets-release with its own measured budget --
  # see ../README.md, "Waiting".
  wait: false
  # ------------------------------------------------------------------------------------------
  # Everything below strips the Bitwarden provider out of this component. The four patches are
  # one change, not four: a suite backed by the `fake` ClusterSecretStore never talks to
  # Bitwarden, and every object removed here exists only to serve it. See README.md for what a
  # consumer that *did* need Bitwarden would lose.
  # ------------------------------------------------------------------------------------------
  patches:
  # The TLS chain for bitwarden-sdk-server: Issuer/bitwarden-ca-issuer,
  # Certificate/bitwarden-ca-cert, Issuer/bitwarden-cert-issuer and
  # Certificate/bitwarden-sdk-server-cert. Every one of them needs cert-manager to be running.
  # yamllint disable-line rule:indentation
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: irrelevant
      metadata:
        name: irrelevant
        namespace: external-secrets
    target:
      group: cert-manager.io
      kind: "(Certificate|Issuer)"
      name: "bitwarden-.*"
      namespace: external-secrets
  # The Bundle that copies the CA above into every namespace labelled
  # `bitwarden-secrets/enabled`. Cluster-scoped, and its CRD comes from trust-manager, which
  # the next patch removes.
  # yamllint disable-line rule:indentation
  - patch: |-
      $patch: delete
      apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      metadata:
        name: bitwarden-ca-cert
    target:
      group: trust.cert-manager.io
      kind: Bundle
      name: bitwarden-ca-cert
  # trust-manager itself. It exists in this component only to reconcile that Bundle, and it
  # carries its own `dependsOn: cert-manager-release`; it also sources its chart from
  # `cert-manager-repository`, which lives in the cert-manager component directory and is
  # therefore not part of this fixture at all -- so leaving it in would dangle on a missing
  # HelmRepository even if cert-manager were present.
  # yamllint disable-line rule:indentation
  - patch: |-
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: trust-manager-release
        namespace: external-secrets
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: trust-manager-release
      namespace: external-secrets
  # Both ops in one patch because they are the same decision, and both deliberately use
  # verbs that fail the build if their path moves (`remove`/`replace`, not `add`) -- a silent
  # no-op here would quietly reinstate the Bitwarden subchart or the cert-manager dependency.
  #
  # `remove /spec/dependsOn` drops `cert-manager-release`. That dependency is real in
  # production -- bitwarden-sdk-server needs a certificate -- and it is ONLY safe to remove
  # because the patches above have taken every object that needs one out of this fixture, and
  # the op below turns off the subchart that needed them. Do not lift this line on its own.
  # What it buys: the dependency serialises cert-manager and external-secrets even when
  # nothing in the test needs it, and a lost dependency race parks the release for a full
  # `interval` because HelmRelease has no `retryInterval` (#3685).
  # Checked, not assumed: the chart's own webhook certificates do not come from cert-manager.
  # `webhook.certManager.enabled` defaults to false in external-secrets 2.8.0 and this module
  # does not set it, so the built-in certController issues them.
  #
  # `replace /spec/values/bitwarden-sdk-server/enabled` turns off the subchart. Verified
  # against the chart rather than inferred: external-secrets 2.8.0's Chart.yaml declares the
  # dependency with `condition: bitwarden-sdk-server.enabled`, and `helm template` with this
  # value false renders exactly three fewer objects -- the bitwarden-sdk-server ServiceAccount,
  # Service and Deployment -- and nothing else changes.
  # yamllint disable-line rule:indentation
  - patch: |-
      - op: remove
        path: /spec/dependsOn
      - op: replace
        path: /spec/values/bitwarden-sdk-server/enabled
        value: false
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: external-secrets-release
      namespace: external-secrets
