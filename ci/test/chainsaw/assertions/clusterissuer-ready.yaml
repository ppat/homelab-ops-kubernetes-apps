---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ($name)
# See certificate-ready.yaml for why the guard goes on the condition, not at top level.
(status.conditions[?type == 'Ready' && status == 'True'].observedGeneration == [metadata.generation]): true
status:
  (conditions[?type == 'Ready']):
  - status: 'True'
