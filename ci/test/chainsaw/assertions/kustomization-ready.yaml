---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ($name)
  namespace: ($namespace)
# See helmrelease-ready.yaml for what Flux's status.observedGeneration guarantees.
(status.observedGeneration == metadata.generation): true
status:
  (conditions[?type == 'Ready']):
  - status: 'True'
