---
# A pre-generated Ed25519 keypair for Garage's node identity (metadata_dir/node_key +
# node_key.pub - Garage derives the node ID directly from the public key). Fixture-only
# key material, not a real secret. Pre-seeding it (rather than letting the server
# generate one on first boot, which is Garage's normal behavior) makes the node ID
# deterministic and known at manifest-authoring time, so job-bootstrap.yaml's
# --rpc-host=<node-id>@... can be a plain hardcoded argument instead of something a
# script has to discover at runtime - the garage image ships no shell, so there is
# nothing in it that could do that discovery anyway. This key's node ID (the public half,
# hex-encoded) is ff57575dc7af8bfc4d0837cc1ce2017b686a88145dc5579a958e3462fe9a908e -
# that value is what job-bootstrap.yaml's --rpc-host and layout/assign arguments target.
apiVersion: v1
kind: Secret
metadata:
  name: object-store-node-key
  namespace: object-store
type: Opaque
data:
  node_key: 3q2+796tvu/erb7v3q2+796tvu/erb7v3q2+796tvu//V1ddx6+L/E0IN8wc4gF7aGqIFF3FV5qVjjRi/pqQjg==
  node_key.pub: /1dXXcevi/xNCDfMHOIBe2hqiBRdxVealY40Yv6akI4=
