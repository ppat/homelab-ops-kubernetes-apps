---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Two shared fixtures in place of the whole security-core module.
#
# cert-manager is NOT droppable here, despite this suite reconciling only external-secrets
# today: maddy ships `Certificate/smtp-tls` against `${cert_issuer}` (substituted to
# `selfsigned-issuer`, which is what the cert-manager fixture provides), its Deployment
# mounts the `smtp-tls-cert` Secret that Certificate issues, and validate-maddy.yaml
# asserts the Certificate Ready. Without cert-manager the Certificate never issues, the
# Secret never exists and the smtp pod never starts.
#
# What does go is everything else security-core was installing to get those two: kyverno,
# policy-reporter, trust-manager, the Bitwarden certificate chain and the
# bitwarden-sdk-server subchart.
#
# See ../../chainsaw/pre-requisites/README.md.
- ../../chainsaw/pre-requisites/cert-manager/
- ../../chainsaw/pre-requisites/external-secrets/
- fake-secret-store.yaml

sortOptions:
  order: fifo
