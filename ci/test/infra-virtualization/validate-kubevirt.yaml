---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-kubevirt
spec:
  try:
  - description: Assert kubevirt/kubevirt reaches phase Deployed
    assert:
      resource:
        apiVersion: kubevirt.io/v1
        kind: KubeVirt
        metadata:
          name: kubevirt
          namespace: kubevirt
        status:
          phase: Deployed
      # virt-operator only creates virt-api/virt-controller/virt-handler once it has
      # reconciled the KubeVirt CR, which itself has to wait on its own CRD (shipped in
      # the same manifest) becoming Established -- longer than the default 1m.
      timeout: 5m
  # The three assertions below run on the shared 1m default rather than a budget of their
  # own. `phase: Deployed` above is virt-operator's own statement that it has finished
  # rolling these three out, so by the time chainsaw reaches them they necessarily exist and
  # are available -- measured at 0.1-0.2s on every green run, after the assert above has
  # already spent 104-128s. They each used to declare 3m, which is 1800x the worst thing
  # ever observed: a budget nothing can approach says nothing about what the step should
  # cost and cannot detect it regressing.
  #
  # They are still asserted, and deliberately so. Helm and operator "deployed" conditions
  # check `numberReady`, while the shared assertions here also require `numberAvailable`,
  # which the workload controllers set on a later resync.
  - description: Assert deployment/virt-api
    assert:
      bindings:
      - name: name
        value: virt-api
      - name: namespace
        value: kubevirt
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert deployment/virt-controller
    assert:
      bindings:
      - name: name
        value: virt-controller
      - name: namespace
        value: kubevirt
      file: ../chainsaw/assertions/deployment-ready.yaml
  - description: Assert daemonset/virt-handler
    assert:
      bindings:
      - name: name
        value: virt-handler
      - name: namespace
        value: kubevirt
      file: ../chainsaw/assertions/daemonset-ready.yaml
  catch:
  - describe:
      apiVersion: kubevirt.io/v1
      kind: KubeVirt
      name: kubevirt
      namespace: kubevirt
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: virt-operator
      namespace: kubevirt
  - podLogs:
      selector: kubevirt.io=virt-operator
      namespace: kubevirt
      tail: 200
  - events:
      namespace: kubevirt
