---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-garage-key
spec:
  try:
  - description: Apply test-key
    apply:
      file: ./test-key.yaml
  - description: Assert garagekey/chainsaw-test-key is Ready
    assert:
      resource:
        apiVersion: garage.rajsingh.info/v1beta1
        kind: GarageKey
        metadata:
          name: chainsaw-test-key
          namespace: garage
        status:
          (conditions[?type == 'Ready']):
          - status: 'True'
      timeout: 3m
  - description: Assert secret/chainsaw-test-key-secret was produced
    assert:
      resource:
        apiVersion: v1
        kind: Secret
        metadata:
          name: chainsaw-test-key-secret
          namespace: garage

  catch:
  - describe:
      apiVersion: garage.rajsingh.info/v1beta1
      kind: GarageKey
      name: chainsaw-test-key
      namespace: garage
  - describe:
      apiVersion: v1
      kind: Secret
      name: chainsaw-test-key-secret
      namespace: garage
  - events:
      namespace: garage
