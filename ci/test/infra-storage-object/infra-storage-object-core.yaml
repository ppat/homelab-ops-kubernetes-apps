---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage-object-core
  namespace: flux-system
spec:
  interval: 15m0s
  path: ./infrastructure/subsystems/storage-object-core
  postBuild:
    substitute:
      cert_issuer: selfsigned-issuer
      dns_zone: example.com
      domain_name: cluster.example.com
      garage_admin_token_key: garage_admin_token
      garage_data_size: 200Mi
      garage_metadata_size: 100Mi
      garage_replication_factor: "1"
      garage_rpc_secret_key: garage_rpc_secret
      garage_storage_class: standard
      garage_storage_replicas: "1"
      garage_web_root_domain: garage-web.cluster.example.com
      secret_store: fake
  prune: false
  sourceRef:
    kind: GitRepository
    name: test-source
    namespace: flux-system
  timeout: 2m0s
  wait: false
