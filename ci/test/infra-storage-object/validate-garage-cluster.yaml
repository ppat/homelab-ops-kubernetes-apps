---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-garage-cluster
spec:
  try:
  - description: Assert externalsecret/garage-credentials
    assert:
      bindings:
      - name: name
        value: garage-credentials
      - name: namespace
        value: garage
      file: ../chainsaw/assertions/externalsecret-ready.yaml
  - description: Assert certificate/garage-web-tls-cert
    assert:
      bindings:
      - name: name
        value: garage-web-tls-cert
      - name: namespace
        value: garage
      file: ../chainsaw/assertions/certificate-ready.yaml
  - description: Assert garagecluster/garage is Ready and running the pinned Garage version
    assert:
      resource:
        apiVersion: garage.rajsingh.info/v1beta2
        kind: GarageCluster
        metadata:
          name: garage
          namespace: garage
        status:
          (conditions[?type == 'Ready']):
          - status: 'True'
          buildInfo:
            version: v2.3.0
      timeout: 5m

  catch:
  - describe:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: garage-credentials
      namespace: garage
  - describe:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: garage-web-tls-cert
      namespace: garage
  - describe:
      apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      name: garage
      namespace: garage
  - podLogs:
      selector: app.kubernetes.io/instance=garage
      namespace: garage
  - events:
      namespace: garage
