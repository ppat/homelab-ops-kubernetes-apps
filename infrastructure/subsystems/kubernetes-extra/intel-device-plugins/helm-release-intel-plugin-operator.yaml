---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-plugin-operator-release
  namespace: intel-device-plugins
spec:
  chart:
    spec:
      chart: intel-device-plugins-operator
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: intel-repository
        namespace: flux-system
      version: 0.36.0
  dependsOn:
  - name: node-feature-discovery-release
    namespace: kube-system
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  # 1m, not 15m: `HelmRelease` has no `retryInterval`, so `interval` is also how long this
  # release waits before re-checking a dependency that was not ready when it first looked.
  # Only paid on a cold cluster, which is bootstrap and disaster recovery. See #3685 and the
  # fuller note in security-core/external-secrets/helm-release-external-secrets.yaml.
  interval: 1m0s
  releaseName: intel-plugin-operator
  targetNamespace: intel-device-plugins
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    nodeSelector:
      kubernetes.io/arch: amd64
      feature.node.kubernetes.io/cpu-model.vendor_id: Intel
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
        # yamllint disable-line rule:indentation
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: irrelevant
          spec:
            template:
              spec:
                tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
