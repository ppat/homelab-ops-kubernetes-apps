---
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
  namespace: garage
spec:
  # Pinned explicitly rather than left to the operator's own built-in default
  # (which currently also resolves to v2.3.0) -- this way a garage-operator
  # chart bump can never silently move the Garage data-plane version out from
  # under a running cluster. No "# renovate:" directive is needed here:
  # Renovate's built-in kubernetes manager already tracks any bare
  # `image: repo:tag` field like this one, unlike the operator's own image
  # field below, which is nested under a `tag:` key and needs an explicit
  # one.
  image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690

  replication:
    factor: ${garage_replication_factor}

  storage:
    replicas: ${garage_storage_replicas:=1}
    metadata:
      size: ${garage_metadata_size}
      storageClassName: ${garage_storage_class}
    data:
      size: ${garage_data_size}
      storageClassName: ${garage_storage_class}
    # Garage defaults metadata_fsync to off, and upstream's own docs report
    # LMDB corruption after an unclean shutdown with it off. Setting this
    # explicitly (rather than inheriting that default) records it as a
    # deliberate durability-vs-throughput choice, not an oversight -- a
    # falsification harness (H2) is currently measuring whether off is
    # actually safe for this estate's workloads, and this value may change
    # once that lands.
    metadataFsync: true

  admin:
    adminTokenSecretRef:
      name: garage-credentials
      key: admin-token

  network:
    rpcSecretRef:
      name: garage-credentials
      key: rpc-secret

  s3Api:
    region: garage

  webApi:
    # Bucket website hosting (the [s3_web] endpoint) -- serves bucket
    # contents unauthenticated on this root domain, e.g. for an
    # Authentik-readable media bucket. Garage has no S3 bucket-policy
    # support, so this vhost-style anonymous read is the only way to expose
    # a subset of buckets publicly.
    rootDomain: ${garage_web_root_domain}

  # Creates a ServiceMonitor targeting the admin API's /metrics endpoint --
  # supersedes hand-rolling one, and stays correct across operator versions
  # that change the metrics port/path.
  monitoring:
    enabled: true
