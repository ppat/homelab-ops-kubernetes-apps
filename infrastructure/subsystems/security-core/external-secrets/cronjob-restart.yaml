---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: external-secrets-restart
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets-restart
spec:
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  # Forbid, not Replace: a restart still rolling out from a missed/slow previous tick
  # should finish rather than be killed and re-patched mid-rollout.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets-restart
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: external-secrets-restart
        spec:
          serviceAccountName: external-secrets-restart
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          containers:
          - name: kubectl
            image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
            imagePullPolicy: IfNotPresent
            command:
            - kubectl
            # No resource name: restarts every Deployment currently in the namespace,
            # so this keeps covering all of them if the chart adds or removes one.
            args:
            - rollout
            - restart
            - deployment
            - --namespace=external-secrets
            env:
            - name: HOME
              value: /tmp
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
