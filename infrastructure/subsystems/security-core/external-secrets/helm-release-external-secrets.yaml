---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-release
  namespace: external-secrets
spec:
  chart:
    spec:
      chart: external-secrets
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-secrets-repository
        namespace: flux-system
      version: 2.8.0
  dependsOn:
  - name: cert-manager-release
    namespace: cert-manager
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  # 1m rather than the 15m carried by releases with no `dependsOn`, and the difference is
  # load-bearing. `HelmRelease` has no `retryInterval` (unlike `Kustomization`), so `interval`
  # is ALSO the cadence at which a release blocked on an unready dependency re-checks it --
  # helm-controller does not look sooner. Observed on a fresh cluster: this release sat at
  # `dependency 'cert-manager/cert-manager-release' is not ready` while cert-manager's pods
  # had been Running for 6m23s and its release read `Helm install succeeded`.
  #
  # Costs nothing in steady state (the dependency is already satisfied, so the check passes
  # first time) and no drift detection is enabled, so a reconcile is a cheap no-op. It is only
  # ever paid on a cold cluster -- which is exactly first-time bootstrap and disaster
  # recovery, where a lost race would otherwise idle for a quarter of an hour per hop. See
  # #3685.
  interval: 1m0s
  releaseName: external-secrets
  targetNamespace: external-secrets
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    installCRDs: true
    global:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists

    serviceMonitor:
      enabled: true

    resources: {}
    webhook:
      resources: {}
      serviceMonitor:
        enabled: true
    certController:
      resources: {}
      serviceMonitor:
        enabled: true

    bitwarden-sdk-server:
      enabled: true
      resources: {}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
