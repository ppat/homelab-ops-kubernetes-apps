---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager-release
  namespace: external-secrets
spec:
  chart:
    spec:
      chart: trust-manager
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cert-manager-repository
        namespace: flux-system
      version: v0.24.0
  dependsOn:
  - name: cert-manager-release
    namespace: cert-manager
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  # 1m, not 15m: `HelmRelease` has no `retryInterval`, so `interval` is also how long this
  # release waits before re-checking a dependency that was not ready when it first looked.
  # Only paid on a cold cluster, which is bootstrap and disaster recovery. See #3685 and the
  # fuller note in security-core/external-secrets/helm-release-external-secrets.yaml.
  interval: 1m0s
  releaseName: trust-manager
  targetNamespace: external-secrets
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback

  values:
    crds:
      enabled: true

    secretTargets:
      enabled: false

    app:
      trust:
        namespace: external-secrets
      metrics:
        service:
          enabled: true
          servicemonitor:
            enabled: true

    resources: {}
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
