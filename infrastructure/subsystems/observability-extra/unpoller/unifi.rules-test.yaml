---
# yamllint disable rule:line-length
# promtool unit tests for prometheusrule-unifi.yaml. Each alert except the always-firing heartbeats has
# a case that must fire and a case that must stay silent. The silent cases replay shapes recorded on a
# real upgrade session. A switch reboot dropped the backup WAN for about 2 minutes, a gateway reboot froze
# the controller's data for 6 minutes, and the CEF stream went quiet for 60 minutes.
rule_files:
- prometheusrule-unifi.yaml
evaluation_interval: 1m
tests:
# Every primary-WAN monitor fails from minute 10 onward.
- interval: 1m
  input_series:
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN", target="1.1.1.1", pod="unpoller-a"}'
    values: '100x10 0x50'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN", target="8.8.8.8", pod="unpoller-a"}'
    values: '100x10 0x50'
  alert_rule_test:
  - eval_time: 20m
    alertname: UnifiPrimaryWanDown
    exp_alerts: []
  - eval_time: 30m
    alertname: UnifiPrimaryWanDown
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN, capability: net.wan, tier: M1, severity: warning}
      exp_annotations:
        summary: The primary internet connection is down.
        description: >-
          Every connectivity monitor on the primary WAN has failed for 15 minutes. Traffic is on the
          backup WAN if one is up.
  - eval_time: 30m
    alertname: CapabilityHeartbeat
    exp_alerts:
    - exp_labels: {capability: net.wan, tier: M1, severity: none}
      exp_annotations:
        summary: The net.wan alert rules are being evaluated.
    - exp_labels: {capability: net.lan, tier: M1, severity: none}
      exp_annotations:
        summary: The net.lan alert rules are being evaluated.

# One monitor target is dead throughout, and every target fails together for 10 minutes. Silent.
- interval: 1m
  input_series:
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN", target="google.com", pod="unpoller-a"}'
    values: '0x60'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN", target="8.8.8.8", pod="unpoller-a"}'
    values: '100x20 0x10 100x30'
  alert_rule_test:
  - eval_time: 30m
    alertname: UnifiPrimaryWanDown
    exp_alerts: []
  - eval_time: 45m
    alertname: UnifiPrimaryWanDown
    exp_alerts: []

# The gateway reports a 25-minute outage at minute 10. It stays visible for 13 hours.
- interval: 1m
  input_series:
  - series: 'unifi_log:wan_outage_10m:count1m{wan="WAN"}'
    values: '_x10 1'
  alert_rule_test:
  - eval_time: 12h
    alertname: UnifiWanOutage
    exp_alerts:
    - exp_labels: {wan: WAN, capability: net.wan, tier: M1, severity: warning}
      exp_annotations:
        summary: Internet connection WAN was down for 10 minutes or more.
        description: >-
          The UniFi gateway reported an outage of 10 minutes or more on WAN within the last
          13 hours. The CEF events in Loki ({job="syslog-ng", app="CEF"}) give the exact times.
  - eval_time: 13h15m
    alertname: UnifiWanOutage
    exp_alerts: []

# The recorded maintenance day. The backup WAN had a 13 s blip, and 19 hours later a 62 s and a 77 s
# outage while switches were upgraded (events 104, 104, 100 with 101 and 107). That is three short
# disconnections in 24 hours, so neither WAN alert fires.
- interval: 1m
  input_series:
  - series: 'unifi_log:wan_event:count1m{wan="WAN3", event="104"}'
    values: '1 _x1139 1'
  - series: 'unifi_log:wan_event:count1m{wan="WAN3", event="100"}'
    values: '_x1154 1'
  - series: 'unifi_log:wan_event:count1m{wan="WAN3", event="101"}'
    values: '_x1154 1'
  - series: 'unifi_log:wan_event:count1m{wan="WAN3", event="107"}'
    values: '_x1154 1'
  alert_rule_test:
  - eval_time: 19h20m
    alertname: UnifiWanFlapping
    exp_alerts: []
  - eval_time: 19h20m
    alertname: UnifiWanOutage
    exp_alerts: []

# Six disconnections of the primary WAN within 5 hours.
- interval: 1m
  input_series:
  - series: 'unifi_log:wan_event:count1m{wan="WAN", event="104"}'
    values: '1 _x59 1 _x59 1 _x59 1 _x59 1 _x59 1'
  alert_rule_test:
  - eval_time: 4h
    alertname: UnifiWanFlapping
    exp_alerts: []
  - eval_time: 5h10m
    alertname: UnifiWanFlapping
    exp_alerts:
    - exp_labels: {wan: WAN, capability: net.wan, tier: M1, severity: warning}
      exp_annotations:
        summary: Internet connection WAN keeps dropping.
        description: >-
          6 disconnections of WAN in the last 24 hours.

# The backup modem reports no internet from minute 10 onward.
- interval: 1m
  input_series:
  - series: 'unpoller_device_mbb_internet{name="u5g", pod="unpoller-a"}'
    values: '1x10 0x80'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN3", target="1.1.1.1", pod="unpoller-a"}'
    values: '100x90'
  alert_rule_test:
  - eval_time: 60m
    alertname: UnifiBackupWanUnavailable
    exp_alerts: []
  - eval_time: 75m
    alertname: UnifiBackupWanUnavailable
    exp_alerts:
    - exp_labels: {capability: net.wan, tier: M1, severity: warning}
      exp_annotations:
        summary: The backup internet connection is not usable.
        description: >-
          The mobile-broadband backup has had no working internet for 1 hour. A primary WAN failure now
          would take the site offline.

# Every backup-WAN monitor fails from minute 10 onward while the modem still says it is online.
- interval: 1m
  input_series:
  - series: 'unpoller_device_mbb_internet{name="u5g", pod="unpoller-a"}'
    values: '1x90'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN3", target="1.1.1.1", pod="unpoller-a"}'
    values: '100x10 0x80'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN3", target="ping.ui.com", pod="unpoller-a"}'
    values: '100x10 0x80'
  alert_rule_test:
  - eval_time: 75m
    alertname: UnifiBackupWanUnavailable
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, capability: net.wan, tier: M1, severity: warning}
      exp_annotations:
        summary: The backup internet connection is not usable.
        description: >-
          The mobile-broadband backup has had no working internet for 1 hour. A primary WAN failure now
          would take the site offline.

# A core switch reboot takes the backup path down for 3 minutes. Silent.
- interval: 1m
  input_series:
  - series: 'unpoller_device_mbb_internet{name="u5g", pod="unpoller-a"}'
    values: '1x20 0x3 1x70'
  - series: 'unpoller_device_wan_monitor_availability_percent{wan_networkgroup="WAN3", target="1.1.1.1", pod="unpoller-a"}'
    values: '100x20 0x3 100x70'
  alert_rule_test:
  - eval_time: 30m
    alertname: UnifiBackupWanUnavailable
    exp_alerts: []
  - eval_time: 90m
    alertname: UnifiBackupWanUnavailable
    exp_alerts: []

# The primary is down for 3 minutes and the backup carries traffic. Shorter than the 5-minute delay. Silent.
- interval: 1m
  input_series:
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="ACTIVE", pod="unpoller-a"}'
    values: '1x9 stale _x2 1x30'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="DISCONNECTED", pod="unpoller-a"}'
    values: '_x10 0x2 stale'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="BACKUP", pod="unpoller-a"}'
    values: '0x9 stale _x2 0x30'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="ACTIVE", pod="unpoller-a"}'
    values: '_x10 1x2 stale'
  alert_rule_test:
  - eval_time: 13m
    alertname: UnifiWanOnBackup
    exp_alerts: []
  - eval_time: 15m
    alertname: UnifiWanOnBackup
    exp_alerts: []
  - eval_time: 20m
    alertname: UnifiWanOnBackup
    exp_alerts: []

# The backup carries traffic for 8 minutes (minutes 10 to 17). Fires at 15m, and the resolve waits
# until the primary has held for 5 minutes.
- interval: 1m
  input_series:
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="ACTIVE", pod="unpoller-a"}'
    values: '1x9 stale _x7 1x20'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="DISCONNECTED", pod="unpoller-a"}'
    values: '_x10 0x7 stale'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="BACKUP", pod="unpoller-a"}'
    values: '0x9 stale _x7 0x20'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="ACTIVE", pod="unpoller-a"}'
    values: '_x10 1x7 stale'
  alert_rule_test:
  - eval_time: 14m
    alertname: UnifiWanOnBackup
    exp_alerts: []
  - eval_time: 16m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 21m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 25m
    alertname: UnifiWanOnBackup
    exp_alerts: []

# Back on the primary for 3 minutes (18 to 20), then on the backup again. The alert never resolves in
# between, so the user gets no "back on primary" message for the flap.
- interval: 1m
  input_series:
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="ACTIVE", pod="unpoller-a"}'
    values: '1x9 stale _x7 1x2 stale _x9 1x20'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="DISCONNECTED", pod="unpoller-a"}'
    values: '_x10 0x7 stale _x2 0x9 stale'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="BACKUP", pod="unpoller-a"}'
    values: '0x9 stale _x7 0x2 stale _x9 0x20'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="ACTIVE", pod="unpoller-a"}'
    values: '_x10 1x7 stale _x2 1x9 stale'
  alert_rule_test:
  - eval_time: 16m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 19m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 22m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 33m
    alertname: UnifiWanOnBackup
    exp_alerts:
    - exp_labels: {wan_networkgroup: WAN3, wan_interface: Backup (5G), capability: net.wan, tier: M1, severity: warning, notify: immediate}
      exp_annotations:
        summary: Internet failed over to the backup WAN, Backup (5G).
        resolved_summary: Internet is back on the primary WAN.
        description: >-
          The UniFi gateway has been using Backup (5G) (WAN3)
          instead of the primary WAN for at least 5 minutes. The primary connection is down or failing its
          health checks.
  - eval_time: 38m
    alertname: UnifiWanOnBackup
    exp_alerts: []

# Steady state: primary active, backup standing by. Silent.
- interval: 1m
  input_series:
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN", wan_interface="Primary (Fiber)", state="ACTIVE", pod="unpoller-a"}'
    values: '1x60'
  - series: 'unpoller_wan_interface_state{wan_networkgroup="WAN3", wan_interface="Backup (5G)", state="BACKUP", pod="unpoller-a"}'
    values: '0x60'
  alert_rule_test:
  - eval_time: 30m
    alertname: UnifiWanOnBackup
    exp_alerts: []
  - eval_time: 60m
    alertname: UnifiWanOnBackup
    exp_alerts: []

# The controller reports an AP as disconnected.
- interval: 1m
  input_series:
  - series: 'unpoller_device_uptime_seconds{name="ap-attic", type="uap", pod="unpoller-a"}'
    values: '0x60'
  alert_rule_test:
  - eval_time: 25m
    alertname: UnifiDeviceOffline
    exp_alerts: []
  - eval_time: 35m
    alertname: UnifiDeviceOffline
    exp_alerts:
    - exp_labels: {name: ap-attic, type: uap, capability: net.lan, tier: M1, severity: warning}
      exp_annotations:
        summary: UniFi device ap-attic is offline.
        description: >-
          The UniFi controller has reported uap ap-attic as disconnected for 30
          minutes. Forget a retired device in the controller to clear this.

# A switch reboots. Its uptime freezes while it is unreachable, then restarts low. Another device is
# reported offline for 10 minutes and comes back. Neither fires.
- interval: 1m
  input_series:
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-a"}'
    values: '5000+60x10 5600x4 30+60x40'
  - series: 'unpoller_device_uptime_seconds{name="ap-attic", type="uap", pod="unpoller-a"}'
    values: '0x10 60+60x40'
  alert_rule_test:
  - eval_time: 20m
    alertname: UnifiDeviceOffline
    exp_alerts: []
  - eval_time: 50m
    alertname: UnifiDeviceOffline
    exp_alerts: []

# A switch reboots at 20h with no firmware change, across an unpoller rollout at 10h (new `pod`).
- interval: 2m
  input_series:
  - series: 'unpoller_device_info{name="usw-core", version="7.5.15", pod="unpoller-a"}'
    values: '1x299'
  - series: 'unpoller_device_info{name="usw-core", version="7.5.15", pod="unpoller-b"}'
    values: '_x300 1x400'
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-a"}'
    values: '360000+120x299'
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-b"}'
    values: '_x300 396000+120x299 300+120x100'
  alert_rule_test:
  - eval_time: 19h
    alertname: UnifiDeviceUnexpectedReboot
    exp_alerts: []
  - eval_time: 21h
    alertname: UnifiDeviceUnexpectedReboot
    exp_alerts:
    - exp_labels: {name: usw-core, type: usw, capability: net.lan, tier: M1, severity: warning}
      exp_annotations:
        summary: UniFi device usw-core rebooted without a firmware upgrade.
        description: >-
          usw usw-core has been up for 1h 5m 0s and its
          firmware version did not change. Check for a power loss or a crash.

# The same reboot as part of a firmware upgrade (7.5.10 to 7.5.15). Silent.
- interval: 2m
  input_series:
  - series: 'unpoller_device_info{name="usw-core", version="7.5.10", pod="unpoller-a"}'
    values: '1x599'
  - series: 'unpoller_device_info{name="usw-core", version="7.5.15", pod="unpoller-a"}'
    values: '_x600 1x100'
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-a"}'
    values: '360000+120x599 300+120x100'
  alert_rule_test:
  - eval_time: 21h
    alertname: UnifiDeviceUnexpectedReboot
    exp_alerts: []

# A device adopted at 15h with a fresh uptime. Silent.
- interval: 2m
  input_series:
  - series: 'unpoller_device_info{name="ap-new", version="8.7.11", pod="unpoller-a"}'
    values: '_x450 1x100'
  - series: 'unpoller_device_uptime_seconds{name="ap-new", type="uap", pod="unpoller-a"}'
    values: '_x450 300+120x100'
  alert_rule_test:
  - eval_time: 17h
    alertname: UnifiDeviceUnexpectedReboot
    exp_alerts: []

# Every device's uptime stops advancing at minute 20, as when the controller is unreachable.
- interval: 1m
  input_series:
  - series: 'unpoller_device_uptime_seconds{name="gateway", type="udm", pod="unpoller-a"}'
    values: '1000+60x20 2200x60'
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-a"}'
    values: '5000+60x20 6200x60'
  alert_rule_test:
  - eval_time: 60m
    alertname: UnifiControllerDataStale
    exp_alerts: []
  - eval_time: 70m
    alertname: UnifiControllerDataStale
    exp_alerts:
    - exp_labels: {capability: net.lan, tier: M1, severity: warning}
      exp_annotations:
        summary: No fresh data from the UniFi controller.
        description: >-
          No UniFi device uptime has advanced for 30 minutes, or unpoller exports nothing. The gateway
          running the controller may be down, or unpoller cannot reach it.

# A gateway firmware reboot freezes the controller's data for 6 minutes. Silent.
- interval: 1m
  input_series:
  - series: 'unpoller_device_uptime_seconds{name="gateway", type="udm", pod="unpoller-a"}'
    values: '1000+60x20 2200x6 120+60x60'
  - series: 'unpoller_device_uptime_seconds{name="usw-core", type="usw", pod="unpoller-a"}'
    values: '5000+60x20 6200x6 6600+60x60'
  alert_rule_test:
  - eval_time: 40m
    alertname: UnifiControllerDataStale
    exp_alerts: []
  - eval_time: 80m
    alertname: UnifiControllerDataStale
    exp_alerts: []

# unpoller exports nothing at all.
- interval: 1m
  input_series:
  - series: 'up{job="something-else"}'
    values: '1x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: UnifiControllerDataStale
    exp_alerts:
    - exp_labels: {capability: net.lan, tier: M1, severity: warning}
      exp_annotations:
        summary: No fresh data from the UniFi controller.
        description: >-
          No UniFi device uptime has advanced for 30 minutes, or unpoller exports nothing. The gateway
          running the controller may be down, or unpoller cannot reach it.

# CEF lines stop after 30 minutes.
- interval: 1m
  input_series:
  - series: 'unifi_log:cef_lines:count5m'
    values: '10x30'
  alert_rule_test:
  - eval_time: 2h20m
    alertname: UnifiSyslogSilent
    exp_alerts: []
  - eval_time: 2h40m
    alertname: UnifiSyslogSilent
    exp_alerts:
    - exp_labels: {capability: obs.logs, tier: M2, severity: warning}
      exp_annotations:
        summary: No UniFi CEF events are reaching Loki.
        description: >-
          No CEF lines from the UniFi gateway have reached Loki for 2 hours. UnifiWanOutage and
          UnifiWanFlapping cannot fire. Check the gateway's SIEM syslog setting, syslog-ng and the Loki
          ruler.

# CEF lines stop for 60 minutes during a gateway firmware upgrade, then resume. Silent.
- interval: 1m
  input_series:
  - series: 'unifi_log:cef_lines:count5m'
    values: '10x30 _x60 10x120'
  alert_rule_test:
  - eval_time: 90m
    alertname: UnifiSyslogSilent
    exp_alerts: []
  - eval_time: 3h
    alertname: UnifiSyslogSilent
    exp_alerts: []
