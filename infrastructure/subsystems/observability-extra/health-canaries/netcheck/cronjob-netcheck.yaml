---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netcheck
  namespace: health-canary
  labels:
    app.kubernetes.io/name: netcheck
spec:
  schedule: "*/10 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: netcheck
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: netcheck
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          containers:
          - name: netcheck
            image: docker.io/library/busybox:1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
            imagePullPolicy: IfNotPresent
            command: [/bin/sh, /scripts/netcheck.sh]
            env:
            - name: NETCHECK_SERVICE
              value: netcheck-echo
            - name: NETCHECK_PORT
              value: "8080"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: scripts
            configMap:
              name: health-canary-scripts
