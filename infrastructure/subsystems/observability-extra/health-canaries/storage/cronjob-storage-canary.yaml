---
# One storage canary instance. The consuming cluster creates one Flux Kustomization per
# StorageClass it wants checked, pointing at this directory with its own post-build variables
# (see the module README). Each run gets a fresh PVC from a generic ephemeral volume: Kubernetes
# creates the claim with the pod and garbage-collects it with the pod, so the canary needs no
# API access to provision or clean up, and nothing outlives the Job beyond its TTL.
#
# The StorageClass must have reclaimPolicy Delete. With Retain, every run leaves a Released PV
# and its backing volume behind; CanaryVolumeLeftBehind fires on exactly that.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${storage_canary_kind:=block}-canary-${storage_canary_name}
  namespace: health-canary
  labels:
    app.kubernetes.io/name: storage-canary
    app.kubernetes.io/instance: ${storage_canary_name}
spec:
  # Not a post-build variable: kustomize drops the quotes before Flux substitutes, and a cron
  # expression starting with `*` is then parsed as a YAML alias. A cluster changes it with a
  # patch; the alert rules derive the interval from the CronJob itself.
  schedule: "17 */6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: storage-canary
        app.kubernetes.io/instance: ${storage_canary_name}
    spec:
      backoffLimit: 0
      # Covers provisioning, attach and the IO. A provisioner that never binds the claim leaves
      # the pod Pending, and this deadline is what turns that into a failed run.
      activeDeadlineSeconds: 1200
      # Short because the run's volume lives until its pod is deleted, which happens here.
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: storage-canary
            app.kubernetes.io/instance: ${storage_canary_name}
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          containers:
          - name: storage-canary
            image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
            imagePullPolicy: IfNotPresent
            command: [/bin/sh, /scripts/storage-canary.sh]
            env:
            - name: STORAGE_CANARY_DIR
              value: /data
            - name: STORAGE_CANARY_MIB
              value: "64"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: scratch
              mountPath: /data
          securityContext:
            # Makes a freshly formatted volume's root writable by the non-root user, on drivers
            # that apply fsGroup.
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: scripts
            configMap:
              name: health-canary-scripts
          - name: tmp
            emptyDir:
              sizeLimit: 1Mi
          # Must stay the last entry: ../storage-claim replaces it by index.
          - name: scratch
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    app.kubernetes.io/name: storage-canary
                    app.kubernetes.io/instance: ${storage_canary_name}
                spec:
                  # ReadWriteMany for a class whose shared-volume path differs from its
                  # single-node one (Longhorn's RWX volumes go through a share manager).
                  accessModes:
                  - ${storage_canary_access_mode:=ReadWriteOnce}
                  storageClassName: ${storage_canary_class}
                  resources:
                    requests:
                      storage: ${storage_canary_size:=1Gi}
