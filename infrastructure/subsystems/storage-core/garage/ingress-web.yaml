---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-web
  namespace: garage
  annotations:
    external-dns.alpha.kubernetes.io/hostname: garage-web.${domain_name}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  # setting tls to [], so that default certificate will be assigned -- same as
  # MinIO's ingresses. This only covers this exact host, not a wildcard
  # subdomain, which is why conf.d/garage.toml's [s3_web] root_domain has no
  # leading dot: a bucket-name-per-subdomain vhost would need its own
  # Ingress+TLS, out of this module's scope (see README).
  tls: []
  rules:
  - host: garage-web.${domain_name}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: garage
            port:
              number: 3902
