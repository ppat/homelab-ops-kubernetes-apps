---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repository
        namespace: flux-system
      version: 1.12.1
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: longhorn
  targetNamespace: longhorn-system
  timeout: 15m0s
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    global:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists

    defaultSettings:
      # General (see: https://longhorn.io/docs/latest/references/settings/#general)
      allowCollectingLonghornUsageMetrics: false
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      concurrentVolumeBackupRestorePerNodeLimit: 2
      defaultDataLocality: best-effort
      defaultReplicaCount: 2
      fastReplicaRebuildEnabled: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      # Rebuilds degraded replicas of a DETACHED volume by attaching it to its Longhorn owner node;
      # when off, a detached volume stays degraded until something next attaches it.
      #
      # Hazard for dataLocality: strict-local (longhorn/longhorn#11322): the same controller
      # treats a brand-new volume's unscheduled replica as degraded and attaches the volume to
      # whichever longhorn-manager won its ownership race, so the single replica and the PV's
      # nodeAffinity land there instead of on the PVC's selected-node. A pod with required
      # anti-affinity against that node then never schedules. Strict-local volumes must opt out
      # per volume at creation (Volume spec.offlineRebuilding: disabled overrides this setting);
      # no StorageClass parameter can set that field.
      #
      # Declared explicitly because Longhorn leaves a setting at its last value once its key is
      # absent from the chart's default-setting ConfigMap.
      offlineReplicaRebuilding: true
      upgradeChecker: false
      # Snapshot (see: https://longhorn.io/docs/latest/references/settings/#snapshot)
      snapshotDataIntegrity: fast-check
      snapshotDataIntegrityCronjob: "0 6 * * *"
      snapshotDataIntegrityImmediateCheckAfterSnapshotCreation: false
      snapshotMaxCount: 24
      # Orphan (see: https://longhorn.io/docs/latest/references/settings/#orphan)
      orphanResourceAutoDeletion: replica-data;instance
      orphanResourceAutoDeletionGracePeriod: 259200 # 72 hours in seconds
      # Backups (see: https://longhorn.io/docs/latest/references/settings/#backups)
      allowRecurringJobWhileVolumeDetached: true
      recurringFailedJobsHistoryLimit: 7
      recurringSuccessfulJobsHistoryLimit: 7
      restoreVolumeRecurringJobs: true
      restoreConcurrentLimit: 4
      # Scheduling (see: https://longhorn.io/docs/latest/references/settings/#scheduling)
      replicaAutoBalance: least-effort
      storageMinimalAvailablePercentage: 15
      storageOverProvisioningPercentage: 100
      storageReservedPercentageForDefaultDisk: 10
      # Danger Zone (see: https://longhorn.io/docs/latest/references/settings/#danger-zone)
      autoCleanupSnapshotAfterOnDemandBackupCompleted: true
      removeSnapshotsDuringFilesystemTrim: true
      taintToleration: node-role.kubernetes.io/control-plane=true:NoSchedule

    metrics:
      serviceMonitor:
        enabled: true
