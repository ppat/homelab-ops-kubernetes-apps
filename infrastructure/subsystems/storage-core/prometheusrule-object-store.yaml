---
# Cross-engine, so it lives at this module's root rather than under minio/ or
# garage/: it has to keep working on both sides of the cutover - while MinIO is
# still the live store and after Garage becomes it - and isn't part of either
# engine's own lifecycle. Backs the disk-consumption KPI tracked by
# homelab-ops-kubernetes-apps#3611 (a 30-day MinIO->Garage object-store trial).
# No alert rules here by design - this estate leaves AlertManager unwired until
# there's an AI triage path for it; this exists to be graphed and queried, not
# to page anyone.
#
# This object and its rule group are still named "disk-amplification" after the
# KPI they carry was re-based onto raw bytes (see the rules below). That is
# deliberate, not a missed rename: Flux prune is disabled cluster-wide in this
# estate, so renaming a PrometheusRule does not rename it in-cluster - it
# creates a second object and abandons the first, which goes on evaluating the
# rules it was last applied with. An orphan still publishing the retired ratio
# - unmaintained, and asserting a MinIO-only comparison this KPI deliberately
# dropped - is a worse outcome than a stale name. A rename is fine, but only as
# a change that also deletes the old object by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: object-store-disk-amplification
  # Same prune reasoning as the name above, with a consequence attached: the
  # `minio` namespace does not outlive this project. #3644 deletes it at
  # decommission, and this object goes with it - including the engine="garage"
  # series, which is the half that still matters afterwards. Moving it now
  # would not relocate it either; it would strand the copy in `minio`. So it
  # stays here, and relocating it (to `garage`, or to a namespace that outlives
  # both engines) is a deliberate change that must delete this object by hand
  # in the same commit - worth doing before #3644 runs, not during it.
  namespace: minio
spec:
  groups:
  - name: object-store-disk-amplification
    rules:
    # Raw bytes on disk, one series per engine, no denominator. This replaces
    # object_store:disk_amplification_ratio (PVC used bytes divided by
    # minio_cluster_usage_total_bytes), which was removed rather than repaired
    # because it was only ever half a KPI. Garage's /metrics exposes no bucket
    # or object byte-total series at all - only garage_local_disk_*, which is
    # statvfs-level, the same fact kubelet already reports from the PVC side -
    # so a disk-over-live-bytes ratio is not computable for Garage from
    # anything that gets scraped, now or after cutover. A number that can only
    # be produced for one arm of a two-arm comparison cannot decide it, and
    # keeping a MinIO-only ratio would have invited exactly the cross-engine
    # reading it cannot support.
    #
    # It was not removed for being wrong; it measured what it claimed. A
    # complete read-only traversal of MinIO's largest bucket on the trial
    # cluster (2026-08-18) found 15.42 GB live across 209,406 objects against
    # 46.22 GB of PVC disk - ~3.0x - and that bucket's
    # minio_bucket_usage_total_bytes read 15.34 GB over the same population,
    # ~0.5% apart, with the buckets summing to minio_cluster_usage_total_bytes.
    # MinIO's crawler total does track live bytes, so the ~3.22x reading this
    # file used to cite, and the 3.2x in #3611, were both right. What their
    # agreement was not is a verification: both are computed the same way from
    # the same denominator, so agreeing was guaranteed rather than
    # corroborating. History, not evidence.
    #
    # Two things worth keeping apart - conflating them has already produced one
    # wrong conclusion about this KPI. Delete markers are zero-byte, so
    # whether a byte-total counts them changes nothing. What inflates *disk*
    # is the unreclaimed noncurrent versions those markers stand in front of -
    # a plain Expiration rule on a versioned bucket writes a marker instead of
    # removing an entry, and every superseded version stays on disk. That is a
    # disk fact, not a denominator fact, and it is the real accumulation the
    # migration exists to fix: ~46 GB of volume holding ~15.4 GB of live data.
    #
    # kubelet_volume_stats_used_bytes is symmetric where the ratio was not: the
    # kubelet's own statfs read of the PVC, already scraped identically for
    # both engines, needing no exporter and no cooperation from the engine
    # being measured. Being a filesystem-level fact is also what makes it safe
    # here, and this was asked because the answer isn't obvious: it reports
    # what the filesystem says is in use, so Longhorn's block-level behaviour
    # underneath - including its weekly fstrim, which currently fails - changes
    # how much of the backing volume gets reclaimed but does not enter this
    # number.
    #
    # Selected by namespace rather than by claim name. Both namespaces are this
    # module's own (namespace.yaml) and hold nothing but their engine's
    # volumes, whereas neither claim name is a module fact: MinIO's is supplied
    # by the consuming cluster's patch (persistence.existingClaim - the module
    # only sets persistence.enabled) and Garage's by ${garage_metadata_claim}/
    # ${garage_data_claim}, so pinning either here would bake one cluster's
    # naming into the module. Summing per namespace is also what makes the two
    # sides comparable: MinIO keeps data and metadata on a single volume while
    # Garage splits them across two, so counting only Garage's data volume
    # would flatter it by dropping its metadata.
    #
    # Read this as a trend across the whole trial, never as a single reading.
    # MinIO's figure is months of accumulated noncurrent versions; Garage's on
    # day one is a fresh copy of the retained window and is trivially smaller
    # for that reason alone, so any post-cutover snapshot flatters Garage for
    # free and settles nothing. The question the trial is actually asking is
    # whether Garage's curve stays flat while data is written and expired -
    # which MinIO's demonstrably did not.
    #
    # Deliberately not coalesced to zero when a series is absent. kubelet emits
    # volume stats only for a PVC a running pod has mounted, so the
    # engine="garage" series is genuinely missing whenever Garage isn't running
    # (confirmed live 2026-08-18: both garage PVCs Bound for days, no series,
    # Deployment 0/1 Available). An explicit 0 would assert that Garage is
    # storing nothing, a different and false claim - absent is the honest
    # state. Same reasoning as object_store:garage_up in
    # garage/prometheusrule-garage.yaml.
    - record: object_store:disk_used_bytes
      labels:
        engine: minio
      expr: sum(kubelet_volume_stats_used_bytes{namespace="minio"})
    - record: object_store:disk_used_bytes
      labels:
        engine: garage
      expr: sum(kubelet_volume_stats_used_bytes{namespace="garage"})
