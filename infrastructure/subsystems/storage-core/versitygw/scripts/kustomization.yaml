---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: versitygw

configMapGenerator:
- name: versitygw-scripts
  files:
  - verify-store-identity.py
  - verify-xattr.py
  - sweep.sh

generatorOptions:
  # The init container mounts this through a HelmRelease postRenderer patch, built
  # separately from this one, and kustomize's name-reference rewriting does not
  # cross that boundary -- a hashed name leaves the patch pointing at nothing.
  disableNameSuffixHash: true
  annotations:
    # Flux's postBuild substitution expands bare $NAME as well as ${NAME}, so without
    # this every shell variable in these scripts becomes an empty string.
    kustomize.toolkit.fluxcd.io/substitute: disabled
