---
apiVersion: external-secrets.io/v1
# The only credential this module owns. Consumer and WebUI-admin accounts are
# cluster facts and are provisioned cluster-side.
kind: ExternalSecret
metadata:
  name: versitygw-credentials
  namespace: versitygw
spec:
  data:
  - secretKey: rootAccessKeyId
    remoteRef:
      key: ${versitygw_root_accesskey_key}
  - secretKey: rootSecretAccessKey
    remoteRef:
      key: ${versitygw_root_secretkey_key}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
