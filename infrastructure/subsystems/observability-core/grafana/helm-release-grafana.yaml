---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-release
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-community-repository
        namespace: flux-system
      version: 12.10.4
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: grafana
  targetNamespace: monitoring
  upgrade:
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback

  valuesFrom:
  - kind: ConfigMap
    name: grafana-default-config
    valuesKey: datasources.yaml
    optional: false
  - kind: ConfigMap
    name: grafana-default-config
    valuesKey: grafana-ini.yaml
    optional: false
  - kind: ConfigMap
    name: grafana-extra-config
    valuesKey: grafana-dashboards.yaml
    optional: true

  values:
    admin:
      existingSecret: grafana-admin-credentials
      userKey: username
      passwordKey: password
    serviceMonitor:
      enabled: true
      relabelings:
      - sourceLabels:
        - __address__
        action: replace
        targetLabel: job
        replacement: grafana

    ingress:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: grafana.${domain_name}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
      - grafana.${domain_name}
      path: /
      pathType: Prefix
      tls: []

    resources: {}
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists

    # Grafana keeps the state it owns itself - service accounts and their tokens, users,
    # dashboard version history, annotations, alert state - in a sqlite db under
    # /var/lib/grafana, which is where the chart mounts this volume. Dashboards and
    # datasources provisioned from ConfigMaps by the sidecars are re-derived on every boot
    # and are not at risk; everything above is, and was lost on every restart before this.
    persistence:
      enabled: true
      # sqlite must not be opened by two pods at once, so this stays single-writer. Pinned
      # rather than left to the chart default because deploymentStrategy below depends on it.
      accessModes:
      - ReadWriteOnce
      size: ${grafana_storage_size:=2Gi}
      # Deliberately has no `:=` default: no StorageClass name is portable across clusters.
      # A consumer that sets nothing renders this empty, the chart then omits the field, and
      # the claim falls to the cluster's default StorageClass - which is not a safe landing
      # on a cluster that has no default (none of ours do), where the claim instead stays
      # Pending and the rollout stalls. Supply it alongside the tag bump, not after.
      storageClassName: ${grafana_storage_class}

    # Recreate is load-bearing, not stylistic. The chart defaults to RollingUpdate, which
    # deadlocks against the ReadWriteOnce claim above: the replacement pod cannot attach the
    # volume until the outgoing pod releases it, and the outgoing pod is not torn down until
    # the replacement is ready. Every upgrade would hang. Do not "restore" the chart default.
    deploymentStrategy:
      type: Recreate

    plugins:
    - grafana-clock-panel
    - grafana-lokiexplore-app
    - pr0ps-trackmap-panel
    - vonage-status-panel

    ## Sidecars that collect the configmaps with specified label and stores the included
    ## files them into the respective folders.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL
