---
# ------------------------------------------------------------------------------------
# A second, singleton Alloy instance whose only job is Kubernetes Event export.
#
# It is a separate Deployment rather than another component in the node DaemonSet's
# config because `loki.source.kubernetes_events` watches the cluster, not the node:
# running it in the DaemonSet would ship N copies of every event, one per node, and the
# component's `clustering` block cannot dedupe that (it is a no-op unless global
# clustering is enabled, which helm-release-alloy.yaml deliberately keeps off so
# `discovery.kubernetes` does not shard pod targets and lose pod-log coverage).
#
# The split also keeps the node collector's ServiceAccount exactly as narrow as it was:
# cluster-wide Event read lives here, on an identity that runs once, instead of on the
# identity that runs on every node. See events.d/events.alloy for the config itself.
# ------------------------------------------------------------------------------------
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events-release
  namespace: logging
spec:
  chart:
    spec:
      chart: alloy
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-repository
        namespace: flux-system
      version: 1.11.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: alloy-events
  targetNamespace: logging
  timeout: 10m0s
  upgrade:
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback

  values:
    # Same reasoning as the node collector: `PodLogs` is only consumed by
    # `loki.source.podlogs`, which neither instance uses, and a second release
    # installing it would put the same cluster-scoped CRD under a second Helm owner.
    crds:
      create: false

    # Without this both releases label their pods `app.kubernetes.io/name: alloy`
    # (the label is derived from the chart name, not the release name), and every
    # `-l app.kubernetes.io/name=alloy` selector in this repo - and in an operator's
    # muscle memory - would silently start matching this pod too. The release name
    # already contains it, so the chart's fullname stays `alloy-events`.
    nameOverride: alloy-events

    alloy:
      configMap:
        # Generated by kustomize, for the same reason as the node collector's: the
        # chart derives the ConfigMap data key and the `alloy run` path segment from
        # one helper, and kubernetes rejects "." as a data key.
        create: false
        # MUST NOT be `alloy-config`: that name belongs to the node collector, and
        # consuming clusters patch it by name to inject their own collection jobs.
        name: alloy-events-config
        # Directory mode - see helm-release-alloy.yaml for the full rationale. The
        # short version: this MUST be "." and never "..data", because alloy given a
        # symlinked root config path loads zero components, exits 0, and logs nothing.
        key: "."
      # A no-op for this instance's components, and stated anyway because it is the
      # single fact the whole design turns on: `loki.source.kubernetes_events` has a
      # `clustering` block that does nothing while this is false, so exactly-once
      # delivery here comes from there being exactly one replica, not from dedupe.
      clustering:
        enabled: false
      stabilityLevel: generally-available
      storagePath: /var/lib/alloy
      # Chart default is true, which adds outbound telemetry to Grafana Labs.
      enableReporting: false
      mounts:
        # This pod reads the Kubernetes API and nothing else. Both are already false
        # by default; they are pinned because the failure they prevent (a chart
        # default flipping and mounting host paths into a pod that has no business
        # touching the host) is silent, and `validate-alloy.yaml` asserts that the
        # rendered pod carries no hostPath volume at all.
        dockercontainers: false
        varlog: false
        extra:
        - name: storage
          mountPath: /var/lib/alloy
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        # Set at the container level as well as the pod level below. The pod-level
        # field alone did not satisfy Kyverno's `restrict-seccomp-strict` on the node
        # collector (apps#3605); a pod that needs no host access at all should not be
        # the one carrying that gap forward.
        seccompProfile:
          type: RuntimeDefault

      # Sized to measured steady-state usage rather than the node collector's figures.
      # Memory working-set peaked at ~77Mi and held there across informer cache
      # cycles - the cache holds Events bounded by the API server's ~1h Event TTL, so
      # usage plateaus within one TTL cycle instead of growing further, which is what
      # makes a measurement taken past that point trustworthy rather than an
      # early-run artifact. Goldilocks' independent VPA recommendation (~89Mi memory,
      # 11m CPU) corroborates both requests.
      #
      # Limit well above request, and no CPU limit, for the same reasons as the node
      # collector: `loki.write` has no write-ahead log, so an OOMKill discards the
      # in-memory queue outright, and CPU throttling makes a log shipper lag silently
      # rather than fail visibly.
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi

    # `checksum/config` is structurally unreachable while `configMap.create` is false,
    # so a ConfigMap change never rolls this Deployment either. The sidecar POSTs
    # /-/reload on change; an unparseable config is rejected with a 400 and the last
    # valid one keeps running.
    configReloader:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

    controller:
      type: deployment
      # Exactly one. This is not a capacity choice a cluster should tune - it is the
      # deduplication mechanism (see `alloy.clustering` above). A second replica ships
      # a second copy of every event.
      replicas: 1
      # Rendered into the Deployment's `spec.strategy`. Recreate, not the default
      # RollingUpdate, for the same reason `replicas` is 1: RollingUpdate's default
      # maxSurge of 25% rounds up to 1, so every rollout would briefly run two event
      # watchers and duplicate every event in that window. Recreate takes the old pod
      # down first, trading a short collection gap - which the emptyDir replay then
      # re-delivers - for never having two writers.
      updateStrategy:
        type: Recreate
      # Deliberately no control-plane tolerations, unlike the node collector. That
      # DaemonSet needs them because a node it cannot schedule onto is a node whose
      # logs are never read; this instance only needs to run somewhere.
      volumes:
        extra:
        # Backs `storagePath`, which the chart does not provide a volume for - with
        # `readOnlyRootFilesystem: true` the positions file would otherwise have
        # nowhere to go.
        #
        # emptyDir, deliberately, and the tradeoff is accepted rather than solved: the
        # positions file holds one timestamp watermark, and losing it on restart makes
        # the informer re-deliver whatever the API server still holds (bounded by the
        # ~1h Event TTL), i.e. a bounded burst of duplicates. The alternatives are
        # worse - a hostPath is meaningless for a pod that can move nodes and would
        # need a root init container to chown it (giving up the security posture
        # above), and a PVC would inject a cluster-specific storage class into a
        # module whose independence is the point.
        - name: storage
          emptyDir: {}

    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        # Applies to the emptyDir above so the non-root container can write its
        # positions file. Note kubelet does NOT apply fsGroup to hostPath volumes,
        # which is why the node collector needs a chown init container and this
        # instance does not.
        fsGroup: 473
        # No supplementalGroups: unlike the node collector this pod reads no host
        # files, so it needs neither GID 0 (/var/log/pods) nor the per-host
        # systemd-journal GID - and therefore does not consume ${systemd_journal_gid}.
        seccompProfile:
          type: RuntimeDefault

    # Exactly what `loki.source.kubernetes_events` needs and nothing else: core-group
    # `events` only. NOT `events.k8s.io` - the component registers `corev1.AddToScheme`
    # and watches `&corev1.Event{}`. It does not need `namespaces` either: with the
    # component's `namespaces` argument unset it uses a sentinel and never enumerates
    # the Namespaces API.
    #
    # Split across both lists for the same chart quirk the node collector documents:
    # `rules` and `clusterRules` are concatenated raw into one ClusterRole, and if
    # exactly one of them is empty the chart emits a bare "[]" followed by sequence
    # entries - invalid YAML. Keeping both non-empty also means CI can assert that both
    # halves resolved, so a chart change that stops concatenating fails loudly instead
    # of silently dropping `watch`.
    #
    # `namespaces` is left unset here too, which is what makes this a ClusterRole
    # rather than per-namespace Roles - required, because the component watches every
    # namespace.
    rbac:
      rules:
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["get", "list"]
      clusterRules:
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["watch"]

    # Chart default is false. On this instance it is what makes the event pipeline's
    # throughput queryable at all - there are deliberately no alert rules for it.
    serviceMonitor:
      enabled: true
