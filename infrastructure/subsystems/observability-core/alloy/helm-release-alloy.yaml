---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-release
  namespace: logging
spec:
  chart:
    spec:
      chart: alloy
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-repository
        namespace: flux-system
      version: 1.11.1
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: alloy
  targetNamespace: logging
  timeout: 10m0s
  upgrade:
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback

  values:
    # The `PodLogs` CRD is only consumed by `loki.source.podlogs`, which this module does
    # not use. Installing it would also put a cluster-scoped CRD under Helm ownership
    # while Flux owns every other CRD in this repo.
    crds:
      create: false

    alloy:
      configMap:
        # The chart derives both the ConfigMap data key and the `alloy run` path segment
        # from the same helper, and kubernetes rejects "." as a ConfigMap data key - so a
        # chart-created ConfigMap cannot be loaded in directory mode. The ConfigMap is
        # generated by kustomize instead (see kustomization.yaml).
        create: false
        name: alloy-config
        # Yields `alloy run /etc/alloy/.`, i.e. directory mode: every *.alloy file in
        # /etc/alloy is loaded into one component graph and cross-file references resolve
        # at runtime. Subdirectories are not recursed, so the ConfigMap's own `..data/`
        # copy does not produce duplicate declarations.
        #
        # This MUST be "." and never "..data": /etc/alloy/..data is a symlink, and alloy
        # given a symlink as its root config path loads zero components, exits 0 and logs
        # neither an error nor a warning - a permanently green collector shipping nothing.
        key: "."
      # Grafana's own docs call enabling clustering on a log-collecting DaemonSet a common
      # mistake: every pod would advertise the same targets and dedupe them away.
      clustering:
        enabled: false
      stabilityLevel: generally-available
      storagePath: /var/lib/alloy
      # Chart default is true, which adds outbound telemetry to Grafana Labs.
      enableReporting: false
      mounts:
        # Nothing in conf.d reads /var/lib/docker/containers. Pod logs are read from
        # /var/log/pods, where containerd writes the real files (only the dockershim
        # runtime made those symlinks into the docker directory).
        dockercontainers: false
        varlog: false
        extra:
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        # Required to read the systemd journal.
        - name: etc-machineid
          mountPath: /etc/machine-id
          readOnly: true
        - name: run-log-journal
          mountPath: /run/log/journal
          readOnly: true
        - name: var-log-journal
          mountPath: /var/log/journal
          readOnly: true
        - name: storage
          mountPath: /var/lib/alloy
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true

      # Memory is bounded, CPU deliberately is not.
      #
      # Sized on the promtail parallel run: steady state measured 107-118Mi per pod, and
      # the cold-start peak - a fresh state directory, so every discovered file is read
      # from offset 0 - measured 210Mi. Promtail doing the same work on the same nodes
      # ranged 75-412Mi, so any limit at or below that is one this workload has already
      # been observed to exceed. 512Mi is ~2.4x the measured peak and ~4.5x steady state.
      # The request is raised off the chart's 32Mi default for the same reason: at 32Mi
      # every pod runs permanently over its request and is a first-choice eviction
      # candidate on a node under memory pressure.
      #
      # Erring towards headroom rather than tightness is the deliberate part.
      # `loki.write` has no write-ahead log (see prometheusrule-alloy.yaml), so an
      # OOMKill discards the in-memory queue outright and the replacement pod re-reads
      # from its last persisted offset - a limit set too low therefore buys nothing and
      # costs log loss plus a re-read storm, on every node at once.
      #
      # No CPU limit: throttling does not kill a log shipper, it makes it lag silently.
      # Every alert in prometheusrule-alloy.yaml keys off entries STOPPING, not slowing,
      # so a CPU limit would trade a bounded blast radius for the one failure mode this
      # module has no way to detect.
      resources:
        requests:
          cpu: 32m
          memory: 128Mi
        limits:
          memory: 512Mi

    # `checksum/config` is structurally unreachable while `configMap.create` is false, so
    # a ConfigMap change never rolls the DaemonSet. This sidecar is the only propagation
    # path: it POSTs /-/reload on a change, which reloads in place, and a config that
    # fails to parse is rejected with a 400 while the last valid one keeps running.
    configReloader:
      enabled: true
      # Measured at 6-7Mi across all four pods; it wakes only when the ConfigMap changes.
      # The chart's 50Mi request is ~7x that, and it has no limit at all.
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi

    controller:
      type: daemonset
      # The chart's tolerations default to []. Without these a tainted control-plane node
      # gets no alloy pod at all and its logs are simply never collected - and because a
      # DaemonSet reports Ready over the pods it SCHEDULED, the DaemonSet stays fully
      # Ready while a whole node is missing from it.
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      # kubelet creates hostPath directories as root:root 0755 and does not apply fsGroup
      # to them, so the non-root alloy container cannot write its positions files there
      # (proven on a real node: fsGroup made no difference, the write still failed).
      # chown only - chmod would need CAP_FOWNER on every restart after the first, once
      # the directory is no longer root-owned.
      - name: init-storage
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
        - /bin/sh
        - -c
        - chown -R 473:473 /var/lib/alloy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: storage
          mountPath: /var/lib/alloy
      volumes:
        extra:
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: etc-machineid
          hostPath:
            path: /etc/machine-id
        - name: run-log-journal
          hostPath:
            path: /run/log/journal
        - name: var-log-journal
          hostPath:
            path: /var/log/journal
        # Without a volume behind storagePath, every pod restart replays the journal from
        # `max_age` and re-reads every pod log from offset 0 (measured: ~3700 duplicate
        # journal entries per restart on a near-idle node).
        - name: storage
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate

    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        supplementalGroups:
        # /var/lib/kubelet/pods and /var/log/pods/**/N.log are root:root, 0750 and 0640
        # respectively, so GID 0 is what grants read access - UID 0 is not required.
        - 0
        # Journal files are root:systemd-journal 0640. Without this GID the journal
        # tailer reports `state: healthy, message: "journal tailer is running"` and
        # collects zero entries. The GID is allocated per host, so it cannot be baked
        # into the module - it has no default on purpose: an unset variable renders a
        # null list entry that the API server rejects, which fails loudly, whereas a
        # wrong default would fail silently.
        - ${systemd_journal_gid}
        seccompProfile:
          type: RuntimeDefault

    # The chart default additionally grants cluster-wide get/list/watch on secrets and
    # configmaps (for `remote.kubernetes.*`), plus events, pods/log, namespaces, nodes,
    # nodes/metrics and the prometheus-operator CRDs. This module only runs
    # `discovery.kubernetes` with role=pod.
    #
    # The chart concatenates `rules` and `clusterRules` into one ClusterRole and emits
    # invalid YAML if either is `[]` (it renders a bare "[]" as a sequence entry), so the
    # one permission this module needs is split across both lists rather than emptying
    # one out. The union is exactly get/list/watch on pods; `validate-alloy.yaml` asserts
    # both halves resolved, so a chart change that stops concatenating fails CI instead
    # of silently dropping `watch`.
    rbac:
      rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
      clusterRules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["watch"]

    # Chart default is false, which would leave prometheusrule-alloy.yaml with no metrics
    # to evaluate.
    serviceMonitor:
      enabled: true
