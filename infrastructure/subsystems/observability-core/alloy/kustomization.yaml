---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- helm-release-alloy.yaml
- helm-release-alloy-events.yaml
- prometheusrule-alloy.yaml

configMapGenerator:
# The node collector's config directory. Every key here is loaded by every alloy pod on
# every node - which is precisely why events.d/ below is a separate ConfigMap and not
# another key in this one.
- name: alloy-config
  namespace: logging
  files:
  - conf.d/journal.alloy
  - conf.d/logs.alloy
  - conf.d/write.alloy
  options:
    # Relabel `replacement` values contain `$1`, which post-build substitution would
    # expand to the empty string.
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
    # A stable name is what lets a cluster add its own *.alloy keys to this ConfigMap
    # (see README, "Extending the collector"); a hash suffix would move the target on
    # every edit. Nothing is lost by disabling it: the usual benefit of the hash is
    # rolling the workload on a config change, and the chart cannot do that here anyway
    # (`checksum/config` is only emitted when the chart creates the ConfigMap itself) -
    # the config-reloader sidecar handles propagation instead.
    disableNameSuffixHash: true

# The event singleton's config directory - see the note on alloy-config above for why
# it is a ConfigMap of its own.
- name: alloy-events-config
  namespace: logging
  files:
  - events.d/events.alloy
  options:
    # No `$` appears in events.alloy today, but a Go template or a relabel replacement
    # gaining one later would be expanded to the empty string by Flux's post-build
    # substitution with nothing to say so - the same trap conf.d/ is protected from.
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
    # Required, not cosmetic: `alloy.configMap.name` in helm-release-alloy-events.yaml
    # is a literal string inside HelmRelease values, which kustomize's name references
    # cannot rewrite - a hash suffix would leave the Deployment mounting a ConfigMap
    # that does not exist.
    disableNameSuffixHash: true
