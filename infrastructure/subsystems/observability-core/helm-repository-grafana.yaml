---
# Alloy is the only chart in this module sourced from grafana.github.io; loki and grafana
# come from grafana-community-repository instead. That split is why two Grafana-run chart
# repositories sit side by side here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-repository
  namespace: flux-system
spec:
  interval: 15m0s
  url: https://grafana.github.io/helm-charts
