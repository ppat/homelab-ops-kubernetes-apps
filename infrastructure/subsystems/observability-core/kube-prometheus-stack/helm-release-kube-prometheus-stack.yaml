---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack-release
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repository
        namespace: flux-system
      version: 88.6.0
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  timeout: 15m0s
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    crds:
      enabled: true

    cleanPrometheusOperatorObjectNames: true

    # ------------------------------------------- prometheusOperator -----------------------------------------------
    prometheusOperator:
      # Relabeling job name for operator metrics
      serviceMonitor:
        relabelings:
        # Replace job value
        - sourceLabels:
          - __address__
          action: replace
          targetLabel: job
          replacement: prometheus-operator
      # Disable creation of kubelet service
      kubeletService:
        enabled: false

      resources: {}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists

      admissionWebhooks:
        patch:
          resources: {}
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists

    # -------------------------------------------------------------------------------------------------------------

    # --------------------------------------------- alertmanager --------------------------------------------------
    alertmanager:
      alertmanagerSpec:
        routePrefix: /
        storage:
          volumeClaimTemplate:
            metadata:
              annotations:
                kustomize.toolkit.fluxcd.io/prune: disabled
            spec:
              storageClassName: ${alertmanager_storage_class}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: ${alertmanager_storage_size}
        retention: ${alertmanager_retention_period}

        resources: {}
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: alertmanager.${domain_name}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
        - alertmanager.${domain_name}
        paths:
        - /
        pathType: Prefix
        tls: []

      # ServiceMonitor job relabel
      serviceMonitor:
        relabelings:
        # Replace job value
        - sourceLabels:
          - __address__
          action: replace
          targetLabel: job
          replacement: alertmanager
    # -------------------------------------------------------------------------------------------------------------

    # ---------------------------------------------- prometheus ---------------------------------------------------
    prometheus:
      prometheusSpec:
        enableAdminAPI: true
        enableFeatures:
        - memory-snapshot-on-shutdown
        # Currently used by Loki's ruler (rulerConfig.remote_write in
        # observability-core/loki) but enabled here as a general platform capability,
        # not scaffolding for that one use - so it's set directly rather than gated
        # behind a postBuild variable a cluster would have to remember to supply.
        #
        # Security: /api/v1/write takes no authentication of its own - anything in the
        # cluster that can reach this Service can write arbitrary series. That's a
        # deliberate, deferred decision, not an oversight: access control (NetworkPolicy,
        # a write-token proxy, mTLS) is out of scope for this change and left for later.
        enableRemoteWriteReceiver: true
        retention: ${prometheus_retention_period}
        retentionSize: ${prometheus_retention_size}
        routePrefix: /
        storageSpec:
          volumeClaimTemplate:
            metadata:
              annotations:
                kustomize.toolkit.fluxcd.io/prune: disabled
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: ${prometheus_storage_size}
              storageClassName: ${prometheus_storage_class}
              volumeName: ${prometheus_volume_name}
        walCompression: true

        # Removing default filter Prometheus selectors (i.e. label release=kube-prometheus-stack)
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        resources:
          requests:
            cpu: 100m
            memory: ${prometheus_memory_request:=1Gi}
          limits:
            memory: ${prometheus_memory_limit:=2Gi}
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

      # ServiceMonitor job relabel
      serviceMonitor:
        relabelings:
        # Replace job value
        - sourceLabels:
          - __address__
          action: replace
          targetLabel: job
          replacement: prometheus

      # Middleware here covers every path on this host, ingest included; that is what
      # ingress-prometheus-remote-write.yaml exists to work around.
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: prometheus.${domain_name}
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
        - prometheus.${domain_name}
        paths:
        - /
        pathType: Prefix
        tls: []
    # -------------------------------------------------------------------------------------------------------------

    # ----------------------------------------------- grafana -----------------------------------------------------
    grafana:
      enabled: false
      forceDeployDatasources: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          label: grafana_dashboard
          annotations:
            grafana_folder: Kube-Prometheus-Stack
    # -------------------------------------------------------------------------------------------------------------

    # ---------------------------------------- disable k8s monitoring ---------------------------------------------
    # Disabling monitoring of K8s services.
    # Monitoring of K3S components will be configured out of kube-prometheus-stack
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    # Disable K8S Prometheus Rules
    # Rules for K3S components will be configured out of kube-prometheus-stack
    defaultRules:
      create: true
      rules:
        etcd: false
        k8s: false
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
        kubelet: false
        kubeProxy: false
        kubernetesApps: false
        kubernetesResources: false
        kubernetesStorage: false
        kubernetesSystem: false
        kubeScheduler: false
    # -------------------------------------------------------------------------------------------------------------

    # -------------------------------------- kube-state-metrics subchart ------------------------------------------
    kube-state-metrics:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists

      resources: {}
    # -------------------------------------------------------------------------------------------------------------

  # Widens node-exporter's --collector.vmstat.fields regex via a postRenderer append patch
  # rather than the prometheus-node-exporter.extraArgs values key. Helm REPLACES list values,
  # it does not merge them: kube-prometheus-stack's own default values.yaml already sets
  # prometheus-node-exporter.extraArgs to the two --collector.filesystem.*-exclude flags that
  # keep container-overlay/kubelet/pseudo-filesystem mounts out of node_filesystem_* - so
  # setting extraArgs here at all, even to a list that also carries those two flags restated
  # verbatim, would pin us to today's copy and silently diverge from (or drop) whatever the
  # chart ships them as on the next version bump. A JSON6902 `add` at the args array's append
  # position instead operates on the chart's own rendered output, so those defaults keep
  # flowing through untouched by any future chart change; only the field list we're adding is
  # ours to own. node-exporter's stock --collector.vmstat.fields regex
  # (^(oom_kill|pgpg|pswp|pg.*fault).*) is unaffected - neither chart sets it via extraArgs
  # by default, so this append is the only place that flag is set, widened to also collect
  # pgscan_*/pgsteal_* (the counters that distinguish background reclaim (kswapd) from
  # synchronous direct reclaim - a real, continuous latency cost invisible from
  # node_memory_* alone).
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: DaemonSet
          name: kube-prometheus-stack-prometheus-node-exporter
        # yamllint disable-line rule:indentation
        patch: |-
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --collector.vmstat.fields=^(oom_kill|pgpg|pswp|pg.*fault|pgscan|pgsteal).*
