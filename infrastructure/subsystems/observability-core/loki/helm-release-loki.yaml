---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-release
  namespace: logging
spec:
  chart:
    spec:
      chart: loki
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-community-repository
        namespace: flux-system
      version: 18.11.7
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: loki
  targetNamespace: logging
  timeout: 15m0s
  upgrade:
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback

  valuesFrom:
  - kind: Secret
    name: loki-s3-credentials
    valuesKey: loki_s3_endpoint
    targetPath: loki.storage.s3.endpoint
  - kind: ConfigMap
    name: loki-extra-config
    valuesKey: loki-retention.yaml
    optional: true

  values:
    ######################################################################################################################
    # Loki Configuration
    ######################################################################################################################
    loki:
      analytics:
        reporting_enabled: false
      # Disable multi-tenant support
      auth_enabled: false
      compactor:
        compaction_interval: 10m
        delete_request_store: s3
        retention_enabled: true
        working_directory: /var/loki/compactor/retention
      ingester:
        chunk_encoding: snappy
      limits_config:
        retention_period: ${loki_retention_size:=7d}
      rulerConfig:
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local.:9093/
        enable_api: true
        enable_alertmanager_v2: true
        # Distributes rule evaluation across the ring instead of every one of the 3
        # singleBinary replicas independently evaluating (and remote-writing) every
        # rule group - the same one-active-owner shape the compactor already gets from
        # its own ring above, and for the same reason: without it, remote_write below
        # would ship 3x the samples for identical series. The ring backend needs no
        # explicit config here: Loki defaults every unconfigured ring (ruler included)
        # to the memberlist config already active in this file the moment
        # memberlist.join_members is set, which the chart does unconditionally.
        enable_sharding: true
        # Ships results to Prometheus's remote-write receiver - same in-cluster FQDN +
        # trailing-dot convention as alertmanager_url above. See
        # kube-prometheus-stack/helm-release-kube-prometheus-stack.yaml's
        # enableRemoteWriteReceiver for why that receiver is on and its security
        # tradeoff (no authentication on /api/v1/write).
        remote_write:
          enabled: true
          clients:
            prometheus:
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local.:9090/api/v1/write
        # Matches where the sidecar delivers rule files (/rules/fake, see `sidecar:`
        # below), not S3: the chart's ruler storage client reads from exactly one
        # backend, so bucketNames.ruler (below) goes unused now that this is set. It
        # stays defined regardless - the chart's template hard-requires it whenever
        # `storage.type` is unset, so removing it would break any downstream patch
        # that reverts this back to S3.
        storage:
          type: local
          local:
            directory: /rules
      # see:
      # - https://grafana.com/docs/loki/latest/operations/storage/schema/
      # - https://grafana.com/docs/loki/latest/operations/storage/tsdb/
      schemaConfig:
        configs:
        - from: "2024-04-01"
          object_store: s3
          store: tsdb
          schema: v13
          index:
            prefix: index_
            period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: homelab-loki-chunks
          ruler: homelab-loki-ruler
        s3:
          # see: https://grafana.com/docs/loki/latest/configure/#s3_storage_config
          # endpoint injected by helmrelease's spec.valuesFrom
          #
          # The doubled `$$` is load-bearing: Flux's post-build substitution runs over this
          # manifest before Helm does, and on a single `$` would consume these references and
          # substitute the empty string, leaving Loki with no credentials. Escaped, the chart
          # receives `${...}` for Loki to expand from the pod env.
          accessKeyId: "$${LOKI_S3_ACCESS_KEY_ID}"
          secretAccessKey: "$${LOKI_S3_SECRET_ACCESS_KEY}"
          #
          # Left unset, Loki's S3 client (pkg/storage/chunk/client/aws) signs every request
          # with the literal placeholder region "dummy" instead of leaving it blank or
          # auto-detecting the bucket's real region (see
          # https://github.com/grafana/loki/issues/11453) - a long-standing upstream quirk
          # that's invisible against MinIO (which ignores the signed region entirely) but
          # fails every request with AuthorizationHeaderMalformed against Garage, which
          # enforces an exact match to its configured s3_region. Defaults to empty so
          # clusters still on MinIO see no behavior change; a cluster whose object store
          # enforces region matching (e.g. Garage) must set this to that store's configured
          # region via postBuild.substitute.
          region: ${loki_s3_region:=}
          s3ForcePathStyle: true
          insecure: false
          http_config:
            idle_conn_timeout: 90s
            response_header_timeout: 0s
            insecure_skip_verify: true
      structuredConfig:
        # providing fqdn addresses from memcached_client under loki.structuredConfig as directly specifying them under
        # resultsCache/chunksCache don't appear to get templated in properly.
        chunk_store_config:
          chunk_cache_config:
            memcached_client:
              addresses: dnssrvnoa+_memcached-client._tcp.loki-chunks-cache.logging.svc.cluster.local
        query_range:
          results_cache:
            cache:
              memcached_client:
                addresses: dnssrvnoa+_memcached-client._tcp.loki-results-cache.logging.svc.cluster.local

    ######################################################################################################################
    # Credential injection
    #
    # Because these arrive as env vars rather than Helm values, a rotated Secret does not
    # re-render the config, so the chart's own config-checksum annotation never rolls the
    # pods for a credential change. Reloader is what applies it.
    ######################################################################################################################
    defaults:
      extraEnv:
      - name: LOKI_S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-s3-credentials
            key: loki_s3_accesskeyid
      - name: LOKI_S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-s3-credentials
            key: loki_s3_secretaccesskey
      annotations:
        secret.reloader.stakater.com/reload: loki-s3-credentials

    ######################################################################################################################
    # Deployment mode: Monolithic (HA, 3 replicas)
    #
    # This is the "HA monolithic" pattern from grafana.com's deployment-modes docs, but without
    # the horizontal_scaling_mode/thanos-objstore config those docs describe for large-scale HA -
    # that machinery is only for an optional feature (distributing deletion-filter chunk
    # processing to dedicated workers), not a requirement for basic multi-replica correctness.
    # The compactor already self-elects a single active leader via its own ring (backed by
    # memberlist, wired in by the chart unconditionally) - the same mechanism that already
    # coordinated our prior 3-replica SimpleScalable `backend` target safely.
    ######################################################################################################################
    deploymentMode: Monolithic
    singleBinary:
      replicas: 3
      persistence:
        size: ${loki_singlebinary_storage_size}
        storageClass: ${loki_storage_class}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    ######################################################################################################################
    # Canary
    ######################################################################################################################
    lokiCanary:
      enabled: false
    # helm test requires canary
    test:
      enabled: false

    ######################################################################################################################
    # Gateway + Ingress
    ######################################################################################################################
    gateway:
      enabled: false
      ingress:
        enabled: false
    ingress:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/hostname: loki.${domain_name}
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
      - loki.${domain_name}
      tls: []
    ######################################################################################################################
    # Caches
    ######################################################################################################################
    resultsCache:
      enabled: true
      allocatedMemory: ${loki_results_cache_memory}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
    chunksCache:
      enabled: true
      allocatedMemory: ${loki_chunks_cache_memory}
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists

    ######################################################################################################################
    # Subchart configurations
    ######################################################################################################################
    #  https://github.com/grafana/helm-charts/tree/main/charts/rollout-operator
    rollout_operator:
      enabled: false
    minio:
      enabled: false

    ######################################################################################################################
    # Monitoring
    ######################################################################################################################
    monitoring:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Loki
        labels:
          grafana_dashboard: "1"
      rules:
        enabled: true
      alerts:
        enabled: true
      serviceMonitor:
        enabled: true
    ######################################################################################################################
    # Ruler recording rules: sidecar-based rule delivery
    #
    # The chart's other rule-loading mechanism, values-baked `ruler.directories`
    # (templates/ruler/configmap.yaml), only renders when `loki.deployment.isDistributed`
    # is true - false here under `deploymentMode: Monolithic` - so it would leave every
    # singleBinary replica stuck in ContainerCreating, mounting a ConfigMap the chart
    # never creates. The sidecar below (kiwigrid/k8s-sidecar, the same component Grafana
    # uses for dashboard discovery) is unconditionally wired into singleBinary pods, and
    # is what lets any module self-serve LogQL rules via a ConfigMap labelled
    # `loki_rule: "1"` in its own namespace - see the module README for the contract.
    #
    # `searchNamespace: ALL` needs the ServiceAccount to read ConfigMaps cluster-wide.
    # The chart already creates a ClusterRole for this whenever `rbac.namespaced` stays
    # at its default (false) - true before this change too, just previously unexercised
    # since the default searchNamespace only watches Loki's own namespace.
    # `rbac.namespaced: true` isn't an alternative: it scopes the grant to a Role in
    # `logging` only, which would make `searchNamespace: ALL` silently see nothing
    # outside `logging`.
    #
    # That ClusterRole also hardcodes `resources: ["configmaps", "secrets"]`,
    # unconditional on any chart value. Cluster-wide Secret read is not something this
    # module accepts, so the `postRenderers` patch below rewrites the chart's *rendered*
    # ClusterRole to `["configmaps"]` only. `resource: configmap` here is kept alongside
    # it deliberately: the patch removes the ServiceAccount's authority to read Secrets,
    # this setting stops the sidecar process from ever asking to - either alone leaves a
    # gap (an unused credential, or a process one chart bump away from an over-broad one
    # it never needed). Verified in CI via the ServiceAccount's actual effective
    # permissions, not the ClusterRole's YAML
    # (ci/test/infra-observability/scripts/check-loki-rbac.sh).
    sidecar:
      resources: {}
      # Without this, two modules that both name their rule file `rules.yaml` would
      # silently overwrite each other on disk - the loser's rules just never load,
      # with nothing in any status field to say so. Applies only to this sidecar
      # (dashboards use monitoring.dashboards above, a different code path).
      enableUniqueFilenames: true
      rules:
        enabled: true
        label: loki_rule
        labelValue: "1"
        # Any namespace in the cluster, not just `logging` - the whole point of the
        # self-service pattern above.
        searchNamespace: "ALL"
        # Only ever asks for ConfigMaps, never Secrets, at the sidecar process level -
        # belt-and-braces alongside the postRenderers RBAC patch below.
        resource: configmap
        # "fake" is not a placeholder - it's Loki's actual internal tenant ID
        # (`no_auth_tenant`, https://grafana.com/docs/loki/latest/configure/) used for
        # every request under `auth_enabled: false` above, and the only directory name
        # the ruler evaluates rule files from. Simpler than the chart's alternative
        # (default /rules + per-ConfigMap folderAnnotation into a tenant subfolder)
        # since every rule here belongs to the same one tenant anyway.
        folder: /rules/fake

  # Patches the chart's rendered ClusterRole (see the comment above `sidecar:`) - same
  # postRenderers shape as security-extra/authentik's own use of this mechanism.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ClusterRole
          name: loki-clusterrole
        # Whole-array replace, not an index-based removal of "secrets": a JSON6902
        # `remove` on /rules/0/resources/1 would silently take out the wrong element
        # (or fail) if the chart ever reorders that array; a whole-array replace either
        # fully matches the intent or the HelmRelease fails loudly instead.
        # yamllint disable-line rule:indentation
        patch: |-
          - op: replace
            path: /rules/0/resources
            value:
            - configmaps
