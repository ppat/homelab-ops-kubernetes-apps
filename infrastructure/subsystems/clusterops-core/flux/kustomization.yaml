---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- gotk-components.yaml
- podmonitor-flux.yaml

commonAnnotations:
  # as this is a critical infrastructure component, prevent pruning unintentionally
  kustomize.toolkit.fluxcd.io/prune: disabled

patches:
- path: patches/deployment-tolerations.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    labelSelector: "app.kubernetes.io/part-of=flux"
# Flux's reconcilers are latency-sensitive with bursty CPU profiles: a reconcile spike is short and
# idle time is long. A CPU limit converts that burst into CFS throttling -- the controller is
# descheduled mid-reconcile even when the node has idle CPU -- which shows up as slow reconciliation
# and timeouts, not as a resource-exhaustion event. CPU is compressible, so the request (left as
# shipped) is what protects neighbours under contention; the limit only buys throttling. Memory
# limits are unaffected (memory is incompressible) and stay as shipped.
#
# `cpu: null` rather than a JSON6902 `op: remove`: this re-renders against every future Flux release
# this module vendors, and a strategic-merge null is a no-op if a later release ever stops shipping
# a default `limits.cpu`, where a JSON6902 remove would hard-fail the kustomize build.
- path: patches/remove-cpu-limits.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    labelSelector: "app.kubernetes.io/part-of=flux"
- path: patches/namespace-metadata.yaml
  target:
    kind: Namespace
# yamllint disable-line rule:indentation
- patch: |
    # fail post-build substitutions if a variable without a default value is missing from the input
    # vars. Default-true since kustomize-controller v1.9.0, so this is a no-op now; kept as an
    # explicit pin rather than removed.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=StrictPostBuildSubstitutions=true
    # cancel an in-progress Kustomization health check when a newer source revision arrives, instead
    # of waiting out the current check first. Opt-in/false by default at our pinned version, so it
    # must be set explicitly. Safe to append as a separate arg: repeated --feature-gates= flags merge
    # into one map rather than overwriting each other.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=CancelHealthCheckOnNewRevision=true
  target:
    kind: Deployment
    name: kustomize-controller
# see: https://fluxcd.io/flux/installation/configuration/helm-oom-detection/
# yamllint disable-line rule:indentation
- patch: |
    # Enable OOM watch feature
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --feature-gates=OOMWatch=true
    # Threshold at which to trigger a graceful shutdown (optional, default 95%)
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --oom-watch-memory-threshold=95
    # Interval at which to check memory usage (optional, default 500ms)
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --oom-watch-interval=500ms
  target:
    kind: Deployment
    name: helm-controller
