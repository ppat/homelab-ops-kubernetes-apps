---
# Don't swap this for an assertion against a live Deployment: this repo's kind clusters bootstrap
# Flux with the `flux` CLI, and SSA keeps that field-manager's claim on limits.cpu forever -- so a
# live check goes red whether or not this patch is correct.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: flux-system
  name: irrelevant
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: null
