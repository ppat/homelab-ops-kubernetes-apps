---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# renovate-gh-release-asset: datasource=github-releases depName=kubevirt/kubevirt
- https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
- kubevirt-cr.yaml

patches:
# yamllint disable-line rule:indentation
- patch: |-
    - op: add
      path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1ssa
      value: merge
    - op: add
      path: /metadata/labels/goldilocks.fairwinds.com~1enabled
      value: "true"
  target:
    kind: Namespace
    name: kubevirt
# infrastructure/bootstrap/crds/kubevirt ships this same CRD (extracted from the
# identical upstream asset) for first-time bootstrap/DR, applied as its own Flux
# Kustomization before this module ever reconciles. Without ssa:merge, this
# Kustomization's server-side apply conflicts over field ownership with whichever
# Kustomization applied the CRD first.
# yamllint disable-line rule:indentation
- patch: |-
    - op: add
      path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1ssa
      value: merge
  target:
    kind: CustomResourceDefinition
    name: kubevirts.kubevirt.io
