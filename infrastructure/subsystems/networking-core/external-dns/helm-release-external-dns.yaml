---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-release
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-dns-repository
        namespace: flux-system
      version: 1.23.0
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: external-dns
  targetNamespace: external-dns
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: external-dns-provider-config
    valuesKey: provider.yaml
    optional: false
  values:
    domainFilters:
    - ${domain_name}
    extraArgs:
    # Since v0.22.0 only the GA prefix external-dns.kubernetes.io/ is read, with no fallback. Every
    # hostname annotation in these modules uses the alpha prefix, and with policy sync the records of
    # annotations it stops reading get deleted. Migrate the annotations before removing this.
    - --annotation-prefix=external-dns.alpha.kubernetes.io/
    - --ignore-ingress-tls-spec
    logLevel: ${externaldns_loglevel:=debug}
    sources:
    - ingress
    - service
    serviceMonitor:
      enabled: true
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
