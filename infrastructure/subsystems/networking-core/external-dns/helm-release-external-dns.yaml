---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-release
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-dns-repository
        namespace: flux-system
      version: 1.23.0
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: external-dns
  targetNamespace: external-dns
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    domainFilters:
    - ${domain_name}
    extraArgs:
    - --ignore-ingress-tls-spec
    logLevel: ${externaldns_loglevel:=debug}
    sources:
    - ingress
    - service
    serviceMonitor:
      enabled: true
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    fullnameOverride: external-dns-unifi
    env: []
    policy: sync
    registry: txt
    txtOwnerId: ${externaldns_txtowner_id:=k8s}
    txtPrefix: ${externaldns_txtowner_prefix:=k8s}
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          # renovate: datasource=github-releases depName=home-operations/external-dns-unifi-webhook
          tag: "0.11.0"
        env:
        - name: UNIFI_HOST
          value: https://unifi.nodes.${dns_zone}
        - name: UNIFI_API_KEY
          valueFrom:
            secretKeyRef:
              name: external-dns-secrets
              key: unifi_apikey
        - name: LOG_LEVEL
          value: ${externaldns_loglevel:=debug}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
