---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# renovate-gh-release-asset: datasource=github-releases depName=rajsinghtech/garage-operator
- https://github.com/rajsinghtech/garage-operator/releases/download/v0.7.3/install.yaml

###########################################################
# allow these CRDs to be adopted by Flux HelmRelease
###########################################################
patches:
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        meta.helm.sh/release-name: garage-operator
        meta.helm.sh/release-namespace: garage-operator-system
      labels:
        app.kubernetes.io/managed-by: Helm
        helm.toolkit.fluxcd.io/name: garage-operator-release
        helm.toolkit.fluxcd.io/namespace: flux-system
      name: irrelevant
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: .*\.garage\.rajsingh\.info
