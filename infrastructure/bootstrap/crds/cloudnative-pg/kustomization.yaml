---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# renovate-gh-release-asset: datasource=github-releases depName=cloudnative-pg/cloudnative-pg
- https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.0/cnpg-1.30.0.yaml
# renovate-gh-release-asset: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
- https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.13.0/manifest.yaml

patches:
###########################################################
# allow the cloudnative-pg CRDs to be adopted by its Flux HelmRelease
###########################################################
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        meta.helm.sh/release-name: cloudnative-pg
        meta.helm.sh/release-namespace: cnpg-system
      labels:
        app.kubernetes.io/managed-by: Helm
        helm.toolkit.fluxcd.io/name: cloudnative-pg-release
        helm.toolkit.fluxcd.io/namespace: flux-system
      name: irrelevant
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: .*\.postgresql\.cnpg\.io
###########################################################
# allow the barman-cloud plugin CRDs to be adopted by its Flux HelmRelease
###########################################################
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        meta.helm.sh/release-name: plugin-barman-cloud
        meta.helm.sh/release-namespace: cnpg-system
      labels:
        app.kubernetes.io/managed-by: Helm
        helm.toolkit.fluxcd.io/name: plugin-barman-cloud-release
        helm.toolkit.fluxcd.io/namespace: flux-system
      name: irrelevant
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: .*\.barmancloud\.cnpg\.io
###########################################################
# Some cnpg/barman-cloud CRD schema `description:` fields contain literal
# `${...}`-shaped text (e.g. the `image_root` placeholder docs and their
# own escaping instructions), which `flux envsubst` mis-parses as a real
# postBuild substitution variable and fails on. These CRDs are applied
# verbatim by Flux (never through postBuild substitution), so skip
# substitution for them in tooling that renders+envsubsts build output
# (see homelab-ops-kubernetes-apps#3416). Broad regex rather than the 3
# presently-known offending CRD names so this survives a future version
# bump moving the landmine to a different CRD.
###########################################################
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
      name: irrelevant
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: .*\.(postgresql|barmancloud)\.cnpg\.io
