---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- cert-manager/
- cloudnative-pg/
- dragonfly/
- external-secrets/
- kubevirt/
- longhorn/
- metallb/
- prometheus-operator/
- traefik/
- trust-manager/

patches:
###########################################################
# Drop everything but CRDs: modules own their namespaces and
# runtime objects, and any namespaced leftover breaks bootstrap
# by targeting a namespace that does not exist yet. Kustomize
# targets match with Go's RE2 regexp, which cannot express "any
# kind except CustomResourceDefinition", so this must be a
# denylist; a kind an upstream release ships past it is caught
# by ci/scripts/verify-bootstrap-crds.sh in the lint workflow
# (#3803 shipped six NetworkPolicies through it).
###########################################################
# yamllint disable-line rule:indentation
- patch: |-
    $patch: delete
    kind: irrelevant
    metadata:
      name: irrelevant
  target:
    kind: "(Certificate|ConfigMap|ClusterRole|ClusterRoleBinding|DaemonSet|Deployment|Issuer|MutatingWebhookConfiguration|Namespace|NetworkPolicy|PriorityClass|Role|RoleBinding|Secret|Service|ServiceAccount|ValidatingWebhookConfiguration)"
