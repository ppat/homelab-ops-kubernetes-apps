---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-release
  namespace: bitwarden
spec:
  chart:
    spec:
      chart: self-host
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: bitwarden-repository
        namespace: flux-system
      version: 2.4.0
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: bitwarden
  targetNamespace: bitwarden
  timeout: 15m0s
  upgrade:
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    general:
      domain: "bitwarden.${domain_name}"
      ingress:
        enabled: false
      enableCloudCommunication: false
      cloudRegion: US

    secrets:
      secretName: bitwarden

    jobs:
      db:
        # The chart ships both migrator Jobs at requests 32Mi / limits 64Mi, and
        # ghcr.io/bitwarden/mssqlmigratorutility self-extracts ~143 MiB into its volume before it
        # opens a connection -- so the limit is below the floor the image needs just to start.
        #
        # Measured: at a 256Mi limit the container's peak cgroup charge is 195.6 MiB. At 64Mi
        # `memory.peak` equals `memory.max` exactly -- it does not fail outright, it runs pinned at
        # the ceiling and survives only while the kernel can evict page cache fast enough. Losing
        # that race is an OOM kill, which takes the Job into backoff and leaves helm waiting on its
        # own pre-install hook; the release then reports Ready: Unknown, which reads like a slow
        # install rather than a killed one.
        #
        # 195.6 MiB is a LOWER bound: it was measured without a live database performing real
        # migrations, so the true requirement is higher by whatever the migration itself costs. That
        # is why 384Mi is headroom over a floor rather than a sized limit -- enough to establish
        # 64Mi is wrong, not enough to pick a number precisely. The asymmetry favours headroom: a
        # generous limit on a short-lived hook Job costs nothing, a tight one kills a schema
        # migration part-way through.
        #
        # Verify by reading the container's own cgroup, not by a green test run. `memory.peak`
        # strictly below `memory.max` establishes headroom; a passing run cannot distinguish a
        # corrected limit from a reclaim race that happened to be won.
        preInstallMigrator:
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 384Mi
        postInstallMigrator:
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 384Mi

    volume:
      dataprotection:
        existingClaim: bitwarden-dataprotection
      attachments:
        existingClaim: bitwarden-attachments
      licenses:
        existingClaim: bitwarden-licenses
      logs:
        enabled: true
        existingClaim: bitwarden-logs

    database:
      enabled: true
      image:
        repository: mcr.microsoft.com/mssql/server
        # renovate: datasource=docker depName=mcr.microsoft.com/mssql/server
        tag: "2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af"
      volume:
        backups:
          existingClaim: bitwarden-db-backups
        data:
          existingClaim: bitwarden-db-data
        log:
          existingClaim: bitwarden-db-logs
      updateStrategy: RollingUpdate
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: StatefulSet
        # yamllint disable-line rule:indentation
        patch: |-
          - op: add
            path: /spec/template/spec/nodeSelector
            value: {kubernetes.io/arch: amd64}
          - op: remove
            path: /spec/template/spec/containers/0/startupProbe
