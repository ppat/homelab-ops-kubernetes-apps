---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-secrets
  namespace: obsidian-vault
spec:
  data:
  # The Local REST API bearer token. Held here and in the two MCP servers' secrets and
  # nowhere else -- a caller holding this token can write anywhere in the vault, since the
  # REST layer has no path-scoped permissions of its own.
  - secretKey: OBSIDIAN_API_KEY
    remoteRef:
      key: obsidian_rest_api_key
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
