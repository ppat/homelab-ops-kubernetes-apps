---
# Targets the prometheus-nats-exporter sidecar through the -metrics Service, not the broker
# itself -- see deployment.yaml for why the sidecar exists.
#
# No `release:` label is needed to be picked up - kube-prometheus-stack's
# serviceMonitorSelectorNilUsesHelmValues is false (see
# infrastructure/subsystems/observability-core/kube-prometheus-stack), so Prometheus selects
# every ServiceMonitor in the cluster regardless of label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obsidian-vault-nats
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: obsidian-vault-nats
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-vault-nats
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
