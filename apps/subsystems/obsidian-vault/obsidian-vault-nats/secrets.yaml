---
# Bcrypt hashes only, never a password: the broker verifies against a hash and stores nothing
# else, so this Secret leaking is not a credential leak and the config that references it can
# stay a reviewable ConfigMap. The plaintext each hash was derived from is a separate
# secret-store key, delivered to the one producer that holds it.
#
# All three producer credentials exist from the start even though only the batch producer
# connects today: the authority injection that matters is a legitimately held credential refused
# at a subject outside its grant, and without a second real credential there is nothing to refuse.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-vault-nats-server-credentials
  namespace: obsidian-vault
spec:
  data:
  - secretKey: sysadmin_password_hash
    remoteRef:
      key: obsidian_vault_nats_sysadmin_password_hash
  - secretKey: queue_admin_password_hash
    remoteRef:
      key: obsidian_vault_nats_queue_admin_password_hash
  - secretKey: batch_processor_password_hash
    remoteRef:
      key: obsidian_vault_nats_batch_processor_password_hash
  - secretKey: batch_producer_password_hash
    remoteRef:
      key: obsidian_vault_nats_batch_producer_password_hash
  - secretKey: promotion_producer_password_hash
    remoteRef:
      key: obsidian_vault_nats_promotion_producer_password_hash
  - secretKey: drift_producer_password_hash
    remoteRef:
      key: obsidian_vault_nats_drift_producer_password_hash
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
