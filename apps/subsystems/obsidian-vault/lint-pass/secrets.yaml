---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lint-pass-secrets
  namespace: obsidian-vault
spec:
  data:
  # A LiteLLM virtual key that may reach `obsidian_ingestor_mcp` and, on it, only the three tools
  # the lint pass calls: read, whole-note write, append. NOT delete -- the lint pass never deletes,
  # renames or moves a note, and ppat/obsidian-tools ADR-0004 places delete per handle. That
  # allowlist is the difference from batch-processor's key, which needs delete and carries none;
  # it lives in the gateway's own store, so reviewing this file cannot catch its loss.
  #
  # The name is GENERATED, not chosen, exactly as batch-processor's is
  # (../batch-processor/secrets.yaml): ppat/homelab-ops-terraform workspace `litellm`, consumer
  # `obsidian-vault-lint-pass`, every non-alphanumeric stripped. It must match that string
  # character for character or this ExternalSecret never resolves.
  - secretKey: LINT_MCP_API_KEY
    remoteRef:
      key: apikey_litellm_obsidianvaultlintpass
  # The bearer token OpenClaw's inbound `/hooks/agent` endpoint checks (`hooks.token` in the
  # cluster-owned openclaw.json), used here to push the review digest to the operator's phone.
  # The same store key n8n's notify subworkflow and the Alertmanager relay present; it is not
  # minted for this workload. OpenClaw has one hooks token, so no narrower credential exists.
  - secretKey: LINT_DIGEST_HOOK_TOKEN
    remoteRef:
      key: openclaw_hooks_token
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
# No NATS credential: the lint pass reads the vault from the mount and writes through the gateway,
# and nothing it does touches the work queue.
