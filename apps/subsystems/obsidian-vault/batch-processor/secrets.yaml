---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-processor-secrets
  namespace: obsidian-vault
spec:
  data:
  # The plaintext the broker's `batch_processor_password_hash` was derived from
  # (../obsidian-vault-nats/secrets.yaml). The one credential permitted to consume: it sits in the
  # account that holds the streams, which no producer is a member of (ppat/obsidian-tools ADR-0047).
  - secretKey: BATCH_PROCESSOR_NATS_PASSWORD
    remoteRef:
      key: obsidian_vault_nats_batch_processor_password
  # A LiteLLM virtual key that may reach `obsidian_ingestor_mcp` and nothing else. Which servers a
  # key may call is configured in the gateway's own store, not here (this module's README, "MCP tool
  # access control and boundary") -- an over-scoped key is not something reviewing this file catches.
  - secretKey: BATCH_MCP_API_KEY
    remoteRef:
      key: apikey_litellm_batch_processor
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
# The batch-mode watchdog has no ExternalSecret and no Secret at all: stopping the agent MCP
# instance is a scale patch under a Role bound to its own ServiceAccount (./rbac.yaml), so nothing
# it does needs a credential from the store. Two workloads stopped holding a shared front's
# administrative key when ppat/obsidian-tools ADR-0052 landed, which is the largest single narrowing
# in this module's history -- do not reintroduce one here without re-reading that record.
