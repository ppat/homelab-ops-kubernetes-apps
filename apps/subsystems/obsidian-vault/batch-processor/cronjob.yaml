---
# One invocation is one batch run: the agent MCP instance is scaled to zero, the batch stream drains
# in strict FIFO through the gated MCP path, the instance is scaled back up (ppat/obsidian-tools
# ADR-0052, ADR-0022). A CronJob and not a Deployment, on two grounds that both come from the run
# shape rather than from convention. `process-batch` stops the agent instance before it looks at the
# stream and exits when the stream is empty, so under a controller that restarts it the instance
# would be stopped essentially always -- the outage the watchdog beside this file exists to end,
# self-inflicted on a loop. And ADR-0022's triggering policy is "once a day when non-empty, inside a
# permitted window", which is a schedule; the tool carries no code for it because this field is
# where it lives.
#
# It runs alone because a patch on this stream confers this component's own write scope on
# whoever enqueued it (ADR-0023), not because of traffic volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-processor
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: batch-processor
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  # Two runs at once would both stop the instance and race each other's lease. It does not prevent
  # a hand-run Job; the lease's holderIdentity is what makes that overlap visible after the fact.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: batch-processor
    spec:
      # No retry, and no activeDeadlineSeconds. A run drains the stream to the end and exits
      # non-zero if any chunk was dead-lettered or left pending -- a reported outcome, not a crash.
      # Retrying it here would change nothing: whatever refused the chunk still refuses it, and the
      # handle goes down again for the same result. Recovery is the producer regenerating and a
      # later run, which converges because already-applied chunks settle rather than reject.
      # A maximum run duration is a separate designed mechanism that does not exist yet
      # (ppat/obsidian-tools#89); a deadline here would be that mechanism, undocumented, and a run
      # killed by it leaves the instance to the watchdog anyway.
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: batch-processor
        spec:
          # A run stops and starts the agent MCP instance through the cluster's own API, so it needs
          # an identity. The token is projected explicitly rather than automounted: automounting
          # yields the legacy, never-expiring Secret-backed token, while this one is bound to this
          # pod and expires, which is a materially smaller thing to leak. See the volume below for
          # the audience gotcha.
          serviceAccountName: batch-processor
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The image declares its user by name; the kubelet cannot verify a non-numeric user
            # against runAsNonRoot.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: batch-processor
            # Docker Hub for the CI-reachability reason recorded in
            # ../git-committer/cronjob.yaml.
            image: docker.io/ppatlabs/obsidian-tools:0.6.0@sha256:c16785aa2e81599182534d7b4ee11fcd26d20898ae15976a64b261012a356d68
            imagePullPolicy: IfNotPresent
            # args, not command: the image's ENTRYPOINT is tini, and replacing it would make
            # CPython PID 1, where SIGTERM sits at its default disposition and is never delivered.
            args:
            - process-batch
            env:
            # These four strings are the tool's own defaults, restated because they are not free
            # to move: the same literals appear in the stream definitions
            # (streams/batch.json, streams/batch-dead-letter.json) and, for the stream and durable
            # names, inside the subject grant in ../obsidian-vault-nats/conf.d/nats-server.conf.
            # Changing one here without the others produces a client timeout that reads as an
            # unreachable broker.
            - name: BATCH_PROCESSOR_NATS_USER
              value: batch-processor
            - name: BATCH_STREAM
              value: batch
            - name: BATCH_CONSUMER_DURABLE
              value: batch-processor
            - name: BATCH_SUBJECT_PREFIX
              value: batch
            # A separate top-level token, and therefore a separate stream. Inside the batch
            # stream's own subject list a dead-lettered chunk would be re-consumed by the consumer
            # that just gave up on it with its delivery count reset -- an infinite, silent loop.
            # `process-batch` refuses to start if the two prefixes overlap.
            - name: BATCH_DEAD_LETTER_SUBJECT_PREFIX
              value: batch-dead-letter
            # The hostname the broker's certificate is issued for; in-cluster clients use it too,
            # because a public issuer cannot sign for .cluster.local
            # (../obsidian-vault-nats/certificate.yaml).
            - name: BATCH_NATS_URL
              value: tls://obsidian-vault-nats.${domain_name}:4222
            - name: BATCH_PROCESSOR_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-processor-secrets
                  key: BATCH_PROCESSOR_NATS_PASSWORD
            # Every vault read and write crosses the gateway, never the MCP server directly: only
            # the LiteLLM pod may reach mcp-obsidian-ingestor (../network-policy.yaml,
            # `vault-writers-ingress`),
            # and which server a key may call is gateway-side scoping (this module's README).
            #
            # The gateway's PER-SERVER route, not its multiplexed root at `/mcp`. The root fronts
            # every server registered on the gateway at once -- GitHub, Grafana, Home Assistant and
            # the rest -- which is a wider surface than a workload scoped to one server has any
            # reason to address. `/<server>/mcp` names the one server this CronJob is entitled to,
            # and `<server>` is the key under `mcp_servers` in ../../ai/litellm/helm-release-litellm.yaml.
            #
            # THE TRAILING SLASH IS LOAD-BEARING, AND THE TWO ROUTE FORMS WANT OPPOSITE THINGS.
            # Measured against the deployed gateway (unauthenticated; 401 = the route exists and
            # wants a key, 404 = no such route):
            #
            #   POST /mcp                  -> 307 to /mcp/            the root REQUIRES the slash
            #   POST /mcp/                 -> 401
            #   POST /<server>/mcp         -> 401                     a per-server route REJECTS it
            #   POST /<server>/mcp/        -> 307 back to /<server>/mcp
            #   POST /nonexistent_mcp/mcp  -> 404
            #
            # Adding a slash here therefore BREAKS this workload, and so did the `/mcp` this
            # replaced: `obsidian_tools.batch_processor.transport` refuses to follow redirects, on
            # purpose, because the key is a bearer token sent on every request and a redirect can
            # retarget it at a host nothing here named -- on the external route the gateway's own
            # redirect also downgrades https to http. A 307 is consequently a hard failure at the
            # first write of the first chunk, not a startup error. Fix the URL; never the refusal.
            - name: BATCH_MCP_URL
              value: http://litellm.ai.svc.cluster.local:4000/obsidian_ingestor_mcp/mcp
            - name: BATCH_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: batch-processor-secrets
                  key: BATCH_MCP_API_KEY
            # Read from `tools/list` on the deployed gateway with this key, and still required
            # with no defaults so this file has to state a value rather than inherit a guess.
            #
            # A PREFIX STAYS, EVEN THOUGH THE URL ABOVE ADDRESSES ONE SERVER. That reads backwards
            # -- a prefix disambiguates between servers, and there is only one on this route -- so
            # it is the thing most likely to be "corrected" into breakage. In LiteLLM the
            # per-server path is a SCOPE FILTER and not a naming mode: every route mounts the same
            # handler, the path segment only narrows which servers are queried, and the listing
            # path adds the prefix unconditionally (`add_prefix=True  # Always add server prefix`,
            # litellm/proxy/_experimental/mcp_server/server.py).
            #
            # THE PREFIX IS THE ALIAS, NOT THE SERVER NAME, AND THIS FILE NEEDS BOTH FORMS. The
            # names below carry `obsidian_ingestor-`, from `mcp_aliases` in
            # ../../ai/litellm/helm-release-litellm.yaml; the URL above carries
            # `obsidian_ingestor_mcp`, the `mcp_servers` key the alias maps to. Making the two
            # agree breaks one of them. Aliasing the server differently renames every tool here
            # without changing anything about what any of them does.
            #
            # What a tool ACCEPTS is not configuration and has no variables here: the argument
            # shapes are fixed by the tools' own schemas (a note is addressed by a structured
            # target object, a read names its projection, a whole-file write declares whether it
            # may overwrite) and live in obsidian-tools'
            # `obsidian_tools/batch_processor/mcp_client.py`.
            - name: BATCH_MCP_TOOL_READ
              value: obsidian_ingestor-obsidian_get_note
            - name: BATCH_MCP_TOOL_WRITE
              value: obsidian_ingestor-obsidian_write_note
            - name: BATCH_MCP_TOOL_DELETE
              value: obsidian_ingestor-obsidian_delete_note
            # Which objects a run stops and which lease says so. All three are required with no
            # defaults in the tool, because each must equal the matching `resourceNames` entry in
            # ./rbac.yaml character for character -- a mismatch presents as a 403 at the first call
            # of every run rather than as a missing setting. Changing a name here without changing
            # it there is the failure this pairing exists to make loud.
            - name: BATCH_AGENT_INSTANCE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BATCH_AGENT_INSTANCE_DEPLOYMENT
              value: mcp-obsidian-agent
            - name: BATCH_AGENT_INSTANCE_LEASE
              value: batch-mode
            # What the lease records as its holder, so an overlapping run is identifiable after the
            # fact. Absent, the tool falls back to the container's hostname, which is the same
            # string -- set explicitly because the fallback is not obvious from a manifest.
            - name: BATCH_RUN_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # BATCH_PROMOTION_STREAM and BATCH_PROMOTION_CONSUMER are deliberately unset until
            # promotion-processor exists (unit A3, #3876). Absent, the run says once that it is
            # not yielding to interactive work; set, an unreadable stream stops the run rather
            # than letting bulk proceed blind.
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          volumes:
          # The token and the cluster CA, at the paths the tool defaults to. Deliberately explicit
          # rather than `automountServiceAccountToken: true`, so the bounded expiry is visible in
          # the manifest -- the kubelet rotates this file in place and the tool re-reads it on every
          # request, because a run measured in hours that cached it at startup would start answering
          # 401 with the agent instance already stopped.
          #
          # NO `audience`. Omitted means the API server's own audience; naming one would mint a
          # token the API server refuses, and the refusal would look like a broken RBAC grant.
          - name: kube-api-access
            projected:
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              # Published into every namespace by kube-controller-manager, and the only way to
              # verify the API server's certificate: it is signed by a CA no public trust store
              # knows.
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
          - name: tmp
            emptyDir: {}
