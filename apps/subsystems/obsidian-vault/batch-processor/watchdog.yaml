---
# Starts the agent MCP instance again when the batch run holding it stopped has stopped renewing its
# lease. Without it, a `batch-processor` that dies mid-run leaves every interactive vault write
# blocked silently and indefinitely -- worse than a slow batch, and the reason this ships with the
# stream rather than with later hardening (ppat/obsidian-tools ADR-0052, ADR-0022, unit D4).
#
# Its own pod, deliberately: what it watches is precisely the thing that may be broken, so it must
# not need the broker, the queue credential or the vault write key to start. It now holds NO
# credential from the secret store at all -- its whole environment is three object names and an
# identity the cluster mints for it. An instance stopped with no lease is an operator's own hold and
# is left exactly as found; ADR-0052's write ordering is what guarantees no partial run can produce
# that state.
#
# Worst-case recovery is the lease duration plus this period, both of which an operator trades
# against how long an ordinary pause between chunks may look like a death. The door reopens when the
# restarted pod is Ready, which is later than the scale patch by however long the image takes to
# start and pass its probe.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-mode-watchdog
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: batch-mode-watchdog
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: batch-mode-watchdog
    spec:
      # A pass that could not read the instance exits non-zero and has learned nothing; the next
      # tick is the retry, and starting it on no evidence would open interactive writes mid-run.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: batch-mode-watchdog
        spec:
          # Identical authority to `batch-processor`, through a second ServiceAccount bound to the
          # same Role: separate identities so a compromise of one is not the other, one Role so the
          # two cannot drift (./rbac.yaml).
          serviceAccountName: batch-mode-watchdog
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: batch-mode-watchdog
            image: docker.io/ppatlabs/obsidian-tools:0.6.0@sha256:c16785aa2e81599182534d7b4ee11fcd26d20898ae15976a64b261012a356d68
            imagePullPolicy: IfNotPresent
            args:
            - watch-agent-instance
            env:
            # The same three names ../batch-processor's CronJob sets, and for the same reason: each
            # must equal the matching `resourceNames` entry in ./rbac.yaml character for character.
            # The two workloads must also agree with each other, to the character -- one watching an
            # instance the other is not stopping is exactly the silent, indefinite outage this
            # component exists to close.
            - name: BATCH_AGENT_INSTANCE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BATCH_AGENT_INSTANCE_DEPLOYMENT
              value: mcp-obsidian-agent
            - name: BATCH_AGENT_INSTANCE_LEASE
              value: batch-mode
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
          volumes:
          # See ./cronjob.yaml's copy for why the token is projected explicitly and why `audience`
          # must stay absent.
          - name: kube-api-access
            projected:
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
          - name: tmp
            emptyDir: {}
