---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-loaded-exporter-secrets
  namespace: obsidian-vault
spec:
  data:
  # The same Local REST API bearer token the two MCP servers hold, from the same secret-store
  # key -- not a narrower one, because none exists: that listener has exactly one token and no
  # path-scoped permissions of its own, so an observer that only reads still holds a
  # write-anywhere credential. Its own ExternalSecret rather than a reference to a sibling
  # component's Secret, so no component directory here depends on another's lifecycle.
  - secretKey: OBSIDIAN_API_KEY
    remoteRef:
      key: obsidian_rest_api_key
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
