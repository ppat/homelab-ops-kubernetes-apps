---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-committer-secrets
  namespace: obsidian-vault
spec:
  data:
  # The only secret this workload needs. Registered as a deploy key with write access on
  # the GitHub repository it pushes to (ppat/obsidian-tools#3). A deploy key is scoped to
  # exactly one repository by construction, so a leak grants access to that repository and
  # nothing else -- and it cannot be widened later the way a token's scope can.
  - secretKey: ssh-privatekey
    remoteRef:
      key: obsidian_git_committer_ssh_private_key
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
