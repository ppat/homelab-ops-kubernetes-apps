---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-obsidian-ingestor-secrets
  namespace: obsidian-vault
spec:
  data:
  - secretKey: OBSIDIAN_API_KEY
    remoteRef:
      key: obsidian_rest_api_key
  # Distinct from the agent instance's signing secret -- see that file for why.
  - secretKey: MCP_AUTH_SECRET_KEY
    remoteRef:
      key: obsidian_ingestor_mcp_auth_secret
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
