---
# Each runtime role's password, as one basic-auth Secret per role. CloudNativePG reads `username`
# and `password` to set the managed role's password, and requires `username` to equal the role.
# The chart reads only `password`. The cnpg.io/reload label has CloudNativePG apply a changed
# password at once. Every remote key is a post-build variable, so the consuming cluster decides
# where each value lives in its secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediated-mailbox-api-db
  namespace: mediated-mailbox
spec:
  data:
  - secretKey: password
    remoteRef:
      key: ${api_db_password_remote_key}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mediated_mailbox_api
        password: "{{ .password }}"
