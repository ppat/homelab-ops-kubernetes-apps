---
# The key pair and the bearer token, under the chart's default key names. Both must outlive the
# cluster: every stored provider credential is sealed to the private key, and agents are configured
# with the token. The `keygen` subcommand of mediated-mailbox-cli writes each key as raw bytes, which
# a text-valued secret store cannot hold, so the store holds them base64-encoded and they are decoded
# here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediated-mailbox-secrets
  namespace: mediated-mailbox
spec:
  data:
  - secretKey: credential.pub
    remoteRef:
      key: ${mediated_mailbox_sealing_publickey_key}
      decodingStrategy: Base64
  - secretKey: credential.key
    remoteRef:
      key: ${mediated_mailbox_sealing_privatekey_key}
      decodingStrategy: Base64
  - secretKey: api-bearer-token
    remoteRef:
      key: ${mediated_mailbox_api_bearer_token_key}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
---
# The application user's password, read by the chart and by CloudNativePG, which sets the managed
# role's password from it and needs the basic-auth shape with the role as `username`. It holds
# nothing else: CloudNativePG grants the database pods' ServiceAccount read access to every managed
# role's password Secret, so the key pair and the token stay out of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediated-mailbox-app-db
  namespace: mediated-mailbox
spec:
  data:
  - secretKey: password
    remoteRef:
      key: ${mediated_mailbox_db_password_key}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mediated_mailbox_app
        password: "{{ .password }}"
---
# The application user's password is generated in the cluster only to seed the store the first
# time. The PushSecret writes it only where the store holds none (IfNotExists), so the stored copy
# always wins and a rebuilt cluster restores the password the database's role already has.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mediated-mailbox-db-password
  namespace: mediated-mailbox
spec:
  allowRepeat: false
  length: 32
  noUpper: false
  symbols: 0
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mediated-mailbox-db-password
  namespace: mediated-mailbox
spec:
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: ${mediated_mailbox_db_password_key}
    metadata:
      note: mediated_mailbox_app database user password
  deletionPolicy: None
  refreshInterval: 600s
  secretStoreRefs:
  - name: ${secret_store}
    kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: mediated-mailbox-db-password
  updatePolicy: IfNotExists
