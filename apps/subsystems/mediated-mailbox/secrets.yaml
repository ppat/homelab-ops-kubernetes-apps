---
# The key pair stored credentials are sealed to. mediated-mailbox-keygen writes both keys as raw
# bytes, which a text-valued secret store cannot hold, so the store holds each base64-encoded and
# it is decoded here. Losing the private key loses every stored credential: the secret store's copy
# is the one to back up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediated-mailbox-sealing-keys
  namespace: mediated-mailbox
spec:
  data:
  - secretKey: credential.pub
    remoteRef:
      key: ${sealing_public_key_remote_key}
      decodingStrategy: Base64
  - secretKey: credential.key
    remoteRef:
      key: ${sealing_private_key_remote_key}
      decodingStrategy: Base64
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
---
# The bearer token agents present to the API server. Supplied rather than chart-generated so that
# the token agents are configured with lives in the secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediated-mailbox-api-bearer-token
  namespace: mediated-mailbox
spec:
  data:
  - secretKey: api-bearer-token
    remoteRef:
      key: ${api_bearer_token_remote_key}
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
