---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: ai
  labels:
    app.kubernetes.io/name: mcp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-grafana
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      # Required for the secrets volume's defaultMode: 0400 (below) to actually be
      # readable: without fsGroup the file stays root-owned and this non-root container
      # (runAsUser 1000) gets denied outright, since Kubernetes only shifts owner
      # permission bits into the group bits when fsGroup is set.
      securityContext:
        fsGroup: 1000
      containers:
      - name: mcp-grafana
        image: docker.io/grafana/mcp-grafana:1.2.0@sha256:cfae68f893dbe40cb6df69579f78beb226f973ded4436d47c844f91d2f00dc53
        imagePullPolicy: IfNotPresent
        args:
        - -t
        - streamable-http
        - --address
        - ":8000"
        - --endpoint-path
        - /mcp
        - --allowed-hosts
        - mcp-grafana.ai.svc.cluster.local:8000
        # This stack is Prometheus + Alertmanager + Loki: datasource-specific toolsets
        # for elasticsearch/quickwit/influxdb/cloudwatch/clickhouse/snowflake/graphite/
        # athena, the Grafana-Cloud-only toolsets (incident/oncall/asserts/sift),
        # pyroscope, rendering (needs the Image Renderer plugin, not installed), and
        # provisioning/snapshot are all omitted as inapplicable. admin stays excluded.
        - --enabled-tools
        - search,datasource,dashboard,prometheus,loki,alerting,navigation,runpanelquery,write
        env:
        # In-cluster Grafana Service (default chart Service port; no service.port override
        # in the HelmRelease).
        - name: GRAFANA_URL
          value: http://grafana.monitoring.svc.cluster.local
        # Single-org install (no multi-org config here or in observability-core), so 1 is
        # the only org the generator's token can belong to.
        - name: GRAFANA_ORG_ID
          value: "1"
        # _FILE (not the inline var) because the ESO Grafana generator (secrets.yaml)
        # mints a new SA token on every refresh; upstream mcp-grafana re-reads this file
        # per request (v0.16.0+), so rotation needs no pod restart. It also TrimSpace's
        # the file content, which the inline env var does not.
        - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
          value: /etc/mcp-grafana/token
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: secrets
          mountPath: /etc/mcp-grafana
          readOnly: true
        # httpGet probes trip the server's own --allowed-hosts guard (returns 400
        # for any Host header it doesn't recognize, including the kubelet's probe
        # request); a TCP check avoids that entirely.
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: secrets
        secret:
          secretName: mcp-grafana-secrets
          defaultMode: 0400
