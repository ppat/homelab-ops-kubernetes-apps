---
# Namespace-local copy of grafana-admin-credentials (observability-core/grafana/secrets.yaml,
# ns monitoring): the Grafana generator below must live in the same namespace as the
# ExternalSecret it reads its auth from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-admin-credentials
  namespace: ai
spec:
  data:
  - secretKey: password
    remoteRef:
      key: cluster_homelab_grafana_admin_password
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Grafana
metadata:
  name: mcp-grafana-token
  namespace: ai
spec:
  url: http://grafana.monitoring.svc.cluster.local
  # auth.basic, not auth.token: a Grafana SA token lives in the same SQLite DB as
  # everything else (persistence.enabled: false in helm-release-grafana.yaml) and dies
  # with it on a pod restart, so bootstrapping this generator off a token would be a
  # broken loop -- no token survives to mint the next one. The admin user instead gets
  # re-provisioned from GF_SECURITY_ADMIN_USER/PASSWORD (admin.existingSecret) on every
  # boot, so it survives a DB wipe and basic auth always works.
  auth:
    basic:
      # GrafanaBasicAuth.Username is a plain string, not a SecretKeySelector (upstream
      # apis/generators/v1alpha1/types_grafana.go) -- unlike the password, it can't
      # reference mcp-grafana-admin-credentials above and must come from a postBuild
      # substitution variable instead. Defaults to "admin" (Grafana's own default admin
      # login) so existing consumers of this module aren't broken by a newly-required
      # variable; a cluster whose Grafana admin username differs overrides it.
      username: ${grafana_admin_username:=admin}
      password:
        name: mcp-grafana-admin-credentials
        key: password
  serviceAccount:
    name: mcp-grafana
    role: Editor
    # The generator mints a new SA token on every ExternalSecret refresh below and
    # doesn't delete prior ones itself; without an expiry, old tokens would stay valid
    # (and keep piling up) forever. Kept to a small multiple of that refresh so at most
    # a handful are live at once and stragglers expire on their own.
    secondsToLive: 14400 # 4h
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-secrets
  namespace: ai
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Grafana
        name: mcp-grafana-token
  # Also the recovery time: after Grafana's DB is wiped the token in the mounted Secret is
  # dead, and nothing re-mints it until the next refresh, so this bounds the outage this
  # whole arrangement exists to prevent. Kept well inside the generator's 4h secondsToLive
  # so the token is always rotated long before Grafana expires it. Cheap to run often --
  # the server re-reads the mounted file per request, so a refresh costs no pod restart.
  refreshInterval: 1h
  target:
    name: mcp-grafana-secrets
    template:
      data:
        token: "{{ .token }}"
