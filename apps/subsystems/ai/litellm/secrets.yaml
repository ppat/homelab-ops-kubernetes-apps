---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ai
spec:
  data:
  - secretKey: LITELLM_MASTER_KEY
    remoteRef:
      key: litellm_master_key
  - secretKey: LITELLM_SALT_KEY
    remoteRef:
      key: litellm_salt_key
  - secretKey: OPENROUTER_API_KEY
    remoteRef:
      key: apikey_openrouter_litellm
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: litellm_redis_password
  - secretKey: GITHUB_MCP_PAT
    remoteRef:
      key: github_pat_mcp
  # Pre-minted JWTs, one per BRAIN MCP instance, each signed with that instance's own
  # MCP_AUTH_SECRET_KEY. LiteLLM presents them as bearer tokens; the instances verify
  # signature/audience/issuer/expiry. Minted out-of-band, like every virtual key here.
  - secretKey: OBSIDIAN_AGENT_MCP_JWT
    remoteRef:
      key: obsidian_agent_mcp_jwt
  - secretKey: OBSIDIAN_INGESTOR_MCP_JWT
    remoteRef:
      key: obsidian_ingestor_mcp_jwt
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
