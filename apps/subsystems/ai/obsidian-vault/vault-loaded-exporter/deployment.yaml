---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-loaded-exporter
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: vault-loaded-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-loaded-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-loaded-exporter
        # Not a claim that this pod speaks MCP. Elsewhere in this module the label means "is
        # one of the MCP protocol servers, inside the LiteLLM auth boundary" (README); here it
        # is reuse for NetworkPolicy admission only. It is the selector both policies in
        # ../network-policy.yaml evaluate -- `mcp-obsidian-ingress` is what lets Prometheus
        # scrape this pod, `obsidian-ingress` is what lets this pod reach Obsidian -- and
        # carrying it is why this workload needs no policy change. Dropped, the pod is matched
        # by no allow rule under the namespace default-deny and both directions fail silently.
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image declares its user by name (`obsidian-tools`, uid/gid 1000); the kubelet
        # cannot verify a non-numeric user against runAsNonRoot, so it is pinned numerically.
        runAsUser: 1000
        runAsGroup: 1000
        # No fsGroup, unlike ../git-committer/cronjob.yaml: this workload mounts no PVC at all.
        # Its only view of the vault is an HTTP call, so it adds no mounter of `vault-data`
        # (see the single-writer invariant in this module's README).
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vault-loaded-exporter
        # Same image and registry as ../git-committer/cronjob.yaml, and Docker Hub for the
        # same CI-reachability reason recorded there.
        image: docker.io/ppatlabs/obsidian-tools:0.5.0@sha256:e2fd39af8a68ae30160c437ec77f4434754ecb89d68932692b1f2591af9e5b22
        imagePullPolicy: IfNotPresent
        # args, not command: the image's ENTRYPOINT is tini, and replacing it would make
        # CPython PID 1, where SIGTERM sits at its default disposition and is never delivered.
        # See ../git-committer/cronjob.yaml for the full reasoning.
        args:
        - export-metrics
        env:
        # The base URL and the TLS posture are stated here rather than left to the tool's own
        # defaults (which match) because "certificate verification is off" is not a fact a
        # reader of this manifest should have to find in another repository. The reason is the
        # same one ../mcp-obsidian-agent/deployment.yaml records: the Local REST API plugin
        # generates its certificate at runtime, so there is nothing to trust ahead of time.
        - name: OBSIDIAN_BASE_URL
          value: https://obsidian.obsidian-vault.svc.cluster.local:27124
        - name: OBSIDIAN_VERIFY_SSL
          value: "false"
        - name: OBSIDIAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: vault-loaded-exporter-secrets
              key: OBSIDIAN_API_KEY
        # Set explicitly so this manifest, not the tool's default, is what decides the port:
        # containerPort below, the Service, and the process's bind must all agree, and only
        # this value can keep them in step if the tool's default ever moves.
        - name: VAULT_EXPORTER_LISTEN_PORT
          value: "9877"
        ports:
        - name: metrics
          containerPort: 9877
          protocol: TCP
        # Probing /metrics observes this exporter's own listener and nothing else: it answers
        # from cached state and never blocks on Obsidian, so a vault that will not open leaves
        # this pod Ready and surfaces only in the exposed series. That separation is the whole
        # component (ppat/obsidian-tools ADR-0037): the vault-loaded signal must reach nothing
        # that restarts a pod, because the failure it exists to catch is one a restart does not
        # fix -- wired to a probe it would produce a crashloop rather than a signal.
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
