---
# The wider-scoped twin of ../mcp-obsidian-agent. Same image, same auth posture, same
# probes -- the only thing that differs is OBSIDIAN_WRITE_PATHS and which secret backs it.
# The rationale for the shared settings is documented once, on the agent Deployment;
# only what is different is explained here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-obsidian-ingestor
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: mcp-obsidian-ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-obsidian-ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-obsidian-ingestor
        app.kubernetes.io/component: mcp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp-obsidian-ingestor
        image: ghcr.io/cyanheads/obsidian-mcp-server:3.2.9@sha256:ae313e9812f7becdfea6f9b4249efa25540b8dac6d4f8e12743f30a34d25cb34
        imagePullPolicy: IfNotPresent
        env:
        - name: MCP_TRANSPORT_TYPE
          value: http
        - name: MCP_HTTP_HOST
          value: 0.0.0.0
        - name: MCP_HTTP_PORT
          value: "3010"
        - name: MCP_AUTH_MODE
          value: jwt
        - name: MCP_AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-obsidian-ingestor-secrets
              key: MCP_AUTH_SECRET_KEY
        - name: MCP_AUTH_DISABLE_SCOPE_CHECKS
          value: "true"
        - name: OBSIDIAN_BASE_URL
          value: https://obsidian.obsidian-vault.svc.cluster.local:27124
        - name: OBSIDIAN_VERIFY_SSL
          value: "false"
        - name: OBSIDIAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-obsidian-ingestor-secrets
              key: OBSIDIAN_API_KEY
        # The wider scope promotion requires: the promotion validator moves notes out of
        # 00-inbox/ into curated areas, the batch processor creates under 05-raw/, and the
        # maintenance pass writes lint/audit/quarantine records under _ops/.
        #
        # Enumerated rather than left unset (which would mean the whole vault), so the
        # four things deliberately outside every agent-reachable write scope stay outside
        # it: CLAUDE.md (the schema file that governs everything else), 00-index.md
        # (hand-curated), _templates/, and .obsidian/ (outside the content contract, owned
        # per-instance). Widening this later is a one-line change; discovering after the
        # fact that a validator rewrote the schema file is not.
        - name: OBSIDIAN_WRITE_PATHS
          value: 00-inbox/,05-raw/,10-areas/,20-projects/,40-journal/,90-archive/,_ops/,log.md
        - name: OBSIDIAN_ENABLE_COMMANDS
          value: "false"
        ports:
        - name: http
          containerPort: 3010
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /var/log/obsidian-mcp-server
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
