---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-committer-secrets
  namespace: obsidian-vault
spec:
  data:
  # One key, used for both remotes: registered as a write deploy key on the GitHub repo
  # and dropped into the NAS's authorized_keys. See ppat/homelab-ops-kubernetes-apps#3443
  # and ppat/obsidian-tools#3 -- there is no third-remote or per-remote-credential need
  # here, since both are pushed the same derived history from the same PVC.
  - secretKey: ssh-privatekey
    remoteRef:
      key: obsidian_git_committer_ssh_private_key
  # Pinned host keys for both remotes, not a generated/learned file -- this is what lets
  # GIT_SSH_COMMAND keep StrictHostKeyChecking at its secure default instead of trusting
  # on first use from inside a Job that has no interactive prompt to answer.
  - secretKey: known_hosts
    remoteRef:
      key: obsidian_git_committer_known_hosts
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
