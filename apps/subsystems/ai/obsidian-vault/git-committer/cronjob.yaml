---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: git-committer
  namespace: obsidian-vault
  labels:
    app.kubernetes.io/name: git-committer
spec:
  # Every 15 minutes. Tunable -- nothing about the write-path or the single-writer
  # invariant depends on this cadence, it only trades commit granularity against how
  # often this workload takes a (narrow, read-only-on-content) hold on the vault PVC.
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  # A CronJob, not a Deployment -- this removes two questions rather than answering
  # them. Rollout strategy and the descheduler prefer-no-eviction annotation the
  # Obsidian Deployment carries (../obsidian/deployment.yaml) both presuppose a
  # long-lived pod; a Job has neither a rollout nor anything to evict between runs.
  # It also narrows, rather than widens, the multi-attach exposure `strategy: Recreate`
  # only narrows on that Deployment: `clusters#799` showed AttachVolume.Attach
  # succeeding for a second Obsidian pod two seconds after it was marked for deletion,
  # so "exactly one writer" already holds by timing more than by enforcement. A
  # long-lived committer would add a third permanent attachment and a pod template
  # that can itself flap; a CronJob attaches only while a commit is actually being
  # taken. See ppat/homelab-ops-kubernetes-apps#3443 and ppat/obsidian-tools#3.
  #
  # concurrencyPolicy: Forbid, deliberately not Replace -- this repo's only other
  # CronJob (../../downloaders/recyclarr/cronjob.yaml) uses Replace, which is fine for
  # an idempotent Recyclarr sync but wrong here: Replace kills the running Job outright,
  # and the running Job could be mid `git push`. Forbid skips the tick instead and lets
  # the next one pick up whatever the killed run would have captured anyway, since nothing
  # about the vault content that run read has changed underneath it.
  concurrencyPolicy: Forbid
  # A tick more than 5 minutes late is skipped rather than fired late; at a 15-minute
  # cadence the next scheduled tick is never far behind, so nothing meaningful is lost.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  # Kept higher than successful: a failed run's Job/events/logs are what's needed to
  # diagnose an NFS EIO or a rejected push (ppat/obsidian-tools#3's soft-mount note).
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: git-committer
    spec:
      # More generous than recyclarr's 300s: a push can retry through the vault's
      # soft-mounted NFS export (softerr, timeo=600/retrans=5 -- ppat/obsidian-tools#3),
      # which can itself burn past a minute before surfacing an error to retry against.
      activeDeadlineSeconds: 600
      # Reaped an hour after finishing, independent of the history limits above -- a
      # backstop so a burst of failures at this cadence (every 15m, every day) can't
      # leave a long tail of finished Job objects sitting around.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: git-committer
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Must match the Obsidian Deployment's fsGroup (../obsidian/deployment.yaml).
            # Vault files are 0640/0750 by design -- group-read, never group-write -- which
            # is how the single-writer invariant is enforced at the filesystem level: this
            # pod can read content only because its supplementary group already matches
            # what Obsidian's own fsGroup application set as the group owner; a mismatched
            # fsGroup would simply lock this workload out of the vault. (It cannot instead
            # land the vault group-write: kubelet skips fsGroup ownership management
            # entirely on a volume mounted readOnly: true, as vault-data is below, so this
            # pod's fsGroup never triggers a chown/chmod pass over vault content at all.)
            # See ppat/homelab-ops-kubernetes-apps#3443 and ppat/obsidian-tools#3.
            fsGroup: 1000
            # OnRootMismatch, not the default Always -- same reasoning as the Obsidian
            # Deployment: a full recursive fsGroup pass on every run would re-loosen modes
            # an earlier run may have (incidentally) tightened, on every single tick.
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: git-committer
            # Verified against the obsidian-tools workflow, not assumed: it sets
            # private_registry_repository: ${{ vars.CONTAINER_REGISTRY_PATH }}/obsidian-tools,
            # CONTAINER_REGISTRY_PATH is Terraform-provisioned as "library", and
            # build-docker-image.yaml derives a branch push's tag as branch-<VERSION_RAW>,
            # where VERSION_RAW is the git ref's last path segment with non-alphanumerics
            # collapsed to "-". This tracks ppat/obsidian-tools#22, branch
            # feat/git-committer -> branch-git-committer. This is the only image this
            # reference can point at *today* -- do not read the intent below as "already
            # migrating". obsidian-tools' build-image.yaml only triggers on pull_request,
            # push-to-main, and workflow_dispatch; it has no tag-push trigger, so
            # release-please cutting a version there currently publishes no image at all.
            # A digest-pinned release tag (matching every other image in this module,
            # e.g. ../obsidian/deployment.yaml) becomes reachable only once that trigger
            # is added on the tools side -- tracked there, not landed as of this comment.
            #
            # Also worth being explicit about: branch-git-committer stops being rebuilt
            # the moment ppat/obsidian-tools#22 merges and its branch is deleted. With
            # imagePullPolicy: Always below, this CronJob would then be silently pinned to
            # that last, abandoned build -- picking up no further fixes -- rather than
            # failing loudly. Re-point this at whatever branch/tag is live before or
            # immediately after that merge.
            image: harbor.nas.${dns_zone}/library/obsidian-tools:branch-git-committer
            # The tag above is a moving branch tag: pull whatever it currently points at
            # on every run rather than trusting a node's cached layer from an earlier
            # tick. Revert to IfNotPresent (this module's default) once pinned to a digest.
            imagePullPolicy: Always
            # args, not command -- k8s command maps to Docker ENTRYPOINT, not CMD. The
            # image sets ENTRYPOINT ["/usr/bin/tini", "--", ".../obsidian-tools"] with no
            # CMD, specifically so tini stays PID 1 and can forward signals to a process
            # that may be terminated mid-run (activeDeadlineSeconds, eviction, node
            # drain, Job deletion). Using `command:` here would replace that ENTRYPOINT
            # outright, making CPython PID 1 instead; CPython only handles SIGINT, so
            # SIGTERM would sit at its default disposition, which the kernel never
            # delivers to PID 1 -- every termination would then escalate straight to
            # SIGKILL after the grace period, with no chance to clean up. A SIGKILL
            # mid-`git add` leaves a stale index.lock that wedges every later run. `args`
            # supplies just the subcommand and leaves the image's own ENTRYPOINT (and
            # therefore tini) as PID 1. Neither this file nor the Dockerfile is wrong in
            # isolation -- they're only wrong together, which is why this looks like the
            # more "explicit" choice and is actually the regression.
            args:
            - commit
            # Deliberately minimal: obsidian_tools/config.py (ppat/obsidian-tools#22,
            # feat/git-committer) already defaults OBSIDIAN_VAULT_DIR=/vault/brain,
            # OBSIDIAN_GIT_DIR=/git/vault.git, GIT_SSH_KEY_PATH=/etc/obsidian-tools/git-ssh/id_ed25519
            # and GIT_SSH_KNOWN_HOSTS_PATH=/etc/obsidian-tools/git-ssh/known_hosts, which
            # is exactly what the volumeMounts/volumes below provide -- restating them
            # here would just be a second source of truth that can drift from the mounts.
            # Same reason GIT_SSH_COMMAND isn't set: the tool builds it itself from the
            # two GIT_SSH_*_PATH values above (with StrictHostKeyChecking enforced in
            # code, not here), so an explicit value here would either be ignored or fight
            # what the code constructs. Only the two variables with no default are set.
            env:
            # Cluster-provided, like every other environment-specific value this module
            # takes externally (DESIGN.md#configuration): which GitHub repository and
            # which NAS host this pushes to is not something module independence permits
            # hardcoding here -- a second cluster running this module, or CI, needs
            # different (or unreachable-by-design) remotes. Both are required with no
            # default (obsidian_tools/config.py) -- a missing one fails the run at
            # startup rather than silently defaulting to something wrong. See
            # ci/test/apps-ai/apps-ai.yaml and this module's README for the dummy values
            # CI substitutes.
            - name: GIT_REMOTE_ORIGIN_URL
              value: ${git_committer_remote_origin_url}
            - name: GIT_REMOTE_NAS_URL
              value: ${git_committer_remote_nas_url}
            - name: HOME
              value: /home/git-committer
            volumeMounts:
            # readOnly: true is the structural expression of "cannot be a second
            # writer" -- not a coding convention this container merely follows.
            # Headless Obsidian is the only process in this namespace that mounts
            # vault-data read-write (../obsidian/deployment.yaml); every other
            # consumer, this one included, is read-only on content at the mount
            # itself, so a bug in this workload's own code cannot make it a second
            # writer even if it tried. See this module's README ("Single-writer
            # invariant") and ppat/homelab-ops-kubernetes-apps#3443.
            #
            # /vault, not /vault/brain: mountPath is the volume root, and
            # OBSIDIAN_VAULT_DIR (left at its default -- see the env comment above)
            # points one level down at /vault/brain. The PVC root carries an ext4
            # lost+found (root-owned, mode 0700) this uid cannot read; the actual vault
            # content lives one directory down for the same reason the Obsidian
            # Deployment's mountPath also stays /vault while its OBSIDIAN_VAULT_DIR moves
            # -- see ../obsidian/deployment.yaml and ppat/obsidian-tools#3. Don't
            # "simplify" this by pointing mountPath itself at /vault/brain.
            - name: vault
              mountPath: /vault
              readOnly: true
            # Committer-owned PVC holding only git's own metadata -- provisioned by the
            # clusters repo, not this module (see this module's README, Persistent
            # Storage). The vault volume above never grows a .git of its own as a result.
            # mountPath is /git, matching OBSIDIAN_GIT_DIR's default of /git/vault.git
            # (left unset above -- see the env comment).
            - name: git-dir
              mountPath: /git
            # Mounted as a whole Secret volume, not via subPath: a subPath mount is
            # resolved once at pod start and never sees a later secret rotation
            # (DESIGN.md's Credentials/Secrets/RBAC section). Matters less for rotation
            # on a CronJob specifically, since every run gets a fresh pod anyway, but it
            # also avoids the outright container-init failure subPath risks when nested
            # under another volume's own mount root -- see DESIGN.md and
            # ../../downloaders/recyclarr/cronjob.yaml, which uses subPath for its config
            # file and is the pattern not to copy here. The path and the two filenames
            # below match GIT_SSH_KEY_PATH/GIT_SSH_KNOWN_HOSTS_PATH's defaults exactly
            # (obsidian_tools/config.py) -- that's why they're this specific and not,
            # say, /run/secrets/git-ssh.
            - name: git-ssh
              mountPath: /etc/obsidian-tools/git-ssh
              readOnly: true
            - name: home
              mountPath: /home/git-committer
            - name: tmp
              mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            # A git CLI wrapper over a markdown vault -- lightweight and short-lived by
            # design; not a measured ceiling, just headroom past a plain `git add -A` /
            # `git commit` / `git push` over a modest text-only tree.
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          volumes:
          # readOnly: true at the volume level too, not just on the mount above -- this
          # asks the CSI driver to mount the underlying filesystem read-only rather than
          # relying solely on the container-level bind-mount flag. Belt and suspenders on
          # the one invariant this whole workload exists to not violate.
          - name: vault
            persistentVolumeClaim:
              claimName: vault-data
              readOnly: true
          - name: git-dir
            persistentVolumeClaim:
              claimName: vault-git-cache
          - name: git-ssh
            secret:
              secretName: git-committer-secrets
              defaultMode: 0400
              items:
              # path: id_ed25519, not the ssh-privatekey secret key name above -- this is
              # the filename GIT_SSH_KEY_PATH's default (/etc/obsidian-tools/git-ssh/id_ed25519)
              # expects. The ExternalSecret's own key name (secrets.yaml) is unrelated to
              # this on-disk filename; only this items[].path controls it.
              - key: ssh-privatekey
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
          # Electron isn't in play here, unlike ../obsidian/deployment.yaml -- these
          # exist purely because readOnlyRootFilesystem is set and git (index, objects,
          # HOME's .gitconfig/.ssh scratch) needs somewhere writable.
          - name: home
            emptyDir: {}
          - name: tmp
            emptyDir: {}
