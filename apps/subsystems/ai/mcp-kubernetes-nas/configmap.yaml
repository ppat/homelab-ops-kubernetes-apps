---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes-nas-config
  namespace: ai
data:
  config.toml: |
    read_only = true
    cluster_provider_strategy = "kubeconfig"
    kubeconfig = "/etc/mcp-kubernetes-nas/kubeconfig"
    toolsets = ["core"]
    # Must be a quoted string and stay above [[denied_resources]], or TOML reads it as a
    # field of that table and the server exits on the unknown key.
    port = "8080"

    # Both kubeconfig and cluster_provider_strategy are required -- setting the
    # strategy alone still loses to in-cluster detection (upstream
    # docs/configuration.md "Cross-Cluster Access from a Pod").
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
