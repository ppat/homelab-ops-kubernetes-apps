---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes-homelab-config
  namespace: ai
data:
  config.toml: |
    read_only = true
    cluster_provider_strategy = "in-cluster"
    toolsets = ["core"]
    # Must be a quoted string and stay above [[denied_resources]], or TOML reads it as a
    # field of that table and the server exits on the unknown key.
    port = "8080"

    # WARNING: never enable the "config" toolset -- its configuration_view tool
    # returns the raw kubeconfig, including this pod's in-cluster ServiceAccount
    # bearer token, unredacted.

    # Defence-in-depth on top of the RBAC binding (see rbac.yaml): denied here too
    # in case that binding is ever loosened past the stock "view" ClusterRole.
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
