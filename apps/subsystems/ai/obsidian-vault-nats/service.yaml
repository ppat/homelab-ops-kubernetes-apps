---
# MetalLB plus external-dns, the repo's answer for a non-HTTP listener that must be reachable
# off-cluster (../../home-automation/nanomq, ../../misc/maddy). No address-pool annotation, so
# this lands in MetalLB's default pool alongside them.
apiVersion: v1
kind: Service
metadata:
  name: obsidian-vault-nats
  namespace: ai
  labels:
    app.kubernetes.io/name: obsidian-vault-nats
  annotations:
    external-dns.alpha.kubernetes.io/hostname: obsidian-vault-nats.${domain_name}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: obsidian-vault-nats
  # Preserves the client source address, which is what makes an off-cluster producer
  # identifiable in the server's `Publish Violation` log lines rather than appearing as the
  # node that happened to receive the packet.
  externalTrafficPolicy: Local
  ports:
  # Only the client port. The monitoring port is reachable in-cluster on the pod IP for the
  # kubelet's probe and the exporter sidecar, and has no reason to leave the cluster.
  - name: client
    protocol: TCP
    port: 4222
    targetPort: client
---
# Separate from the LoadBalancer above so that scrape traffic is a ClusterIP concern and the
# metrics port is never a candidate for off-cluster exposure. `component: metrics` is what the
# ServiceMonitor selects on -- both Services carry
# `app.kubernetes.io/name: obsidian-vault-nats`, so name alone would match the LoadBalancer
# too and generate a scrape job with no matching port. Same shape as
# ../../coder/service-coder-metrics.yaml.
apiVersion: v1
kind: Service
metadata:
  name: obsidian-vault-nats-metrics
  namespace: ai
  labels:
    app.kubernetes.io/name: obsidian-vault-nats
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: obsidian-vault-nats
  ports:
  - name: metrics
    protocol: TCP
    port: 7777
    targetPort: metrics
