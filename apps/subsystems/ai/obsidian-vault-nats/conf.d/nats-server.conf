# The account topology and every subject grant, and the only home for either. The scheme and
# its grounds are ppat/obsidian-tools ADR-0047; there are deliberately no streams here, which
# is ADR-0023. The chainsaw suite asserts the grant lines below literally
# (ci/test/apps-ai/validate-obsidian-vault-nats-permissions.yaml), and obsidian-tools' own CI
# proves against a real broker that a scoped credential is refused at a foreign subject.
#
# Every password below is a bcrypt hash supplied from the environment. The `$` inside a hash
# (`$2a$11$...`) is not re-expanded by the config parser -- a substituted value is taken
# literally, never rescanned.

port: 4222
server_name: brain-queue

# Bound to the pod IP rather than loopback so the kubelet can probe /healthz here. The client
# port cannot serve that probe: it requires TLS, so a `tcpSocket` probe against it logs a
# handshake error on every probe, forever. The trade is that server telemetry is readable
# cluster-wide; no credential is on this port and nothing on it can write.
http: "0.0.0.0:8222"

jetstream {
  # nats-server appends `jetstream/` to whatever is given here, so the store lands at
  # /data/jetstream. Writing "/data/jetstream" would put it at /data/jetstream/jetstream.
  store_dir: "/data"
}

# Mandatory, not hardening: static-account authentication sends the password on CONNECT, and
# local-replicator connects from off-cluster over the LoadBalancer Service.
tls {
  cert_file: "/tls/tls.crt"
  key_file: "/tls/tls.key"
  timeout: 5
}

accounts {
  SYS: {
    users: [ { user: "sysadmin", password: $NATS_SYSADMIN_PASSWORD_HASH } ]
  }

  BRAIN_QUEUE: {
    jetstream: enabled
    users: [
      { user: "queue-admin", password: $NATS_QUEUE_ADMIN_PASSWORD_HASH }
      # The one credential permitted to consume. It is in this account because the streams are,
      # so unlike a producer it must reach the JetStream API -- but only at the two streams and
      # the one consumer named literally below. Every subject was measured against nats-server
      # 2.14.6; a missing one fails as a client timeout that reads as a dead broker, never as a
      # refusal. Three that are not guessable:
      #   - create without update is what stops this credential widening its own stream's
      #     subject list: create against a changed stream configuration is refused outright.
      #   - both consumer-create spellings are present because nats-py uses the legacy
      #     `DURABLE.CREATE` form for a named durable and the other is where it is heading.
      #   - two inbox forms, both required. The pull subscription's own reply subject is two
      #     tokens and the request mux's is three; with only the three-token form every
      #     JetStream API call times out while fetch and ack keep working.
      { user: "batch-processor"
        password: $NATS_BATCH_PROCESSOR_PASSWORD_HASH
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO"
              "$JS.API.STREAM.CREATE.batch"
              "$JS.API.STREAM.CREATE.batch-dead-letter"
              "$JS.API.STREAM.INFO.batch"
              "$JS.API.STREAM.INFO.batch-dead-letter"
              "$JS.API.CONSUMER.CREATE.batch.batch-processor"
              "$JS.API.CONSUMER.DURABLE.CREATE.batch.batch-processor"
              "$JS.API.CONSUMER.INFO.batch.batch-processor"
              "$JS.API.CONSUMER.MSG.NEXT.batch.batch-processor"
              "$JS.ACK.batch.batch-processor.>"
              "batch-dead-letter.>"
            ]
          }
          subscribe: { allow: [ "_INBOX.*", "_INBOX.*.*" ] }
        }
      }
    ]
    exports: [
      # `accounts: [...]` is what makes each export private -- dropping it lets any account
      # import the subject.
      { service: "batch.>", accounts: [ PRODUCER_BATCH ] }
      { service: "promotion.>", accounts: [ PRODUCER_PROMOTION ] }
      { service: "drift.>", accounts: [ PRODUCER_DRIFT ] }
    ]
  }

  # Each `subscribe` grant below is a reply inbox for this credential's own PubAcks -- not a
  # read of any stream, and not the second half of the publish grant. TWO TRAPS, both of
  # which read as tightening and are in fact the widest possible grant:
  #   - OMITTING the subscribe block leaves subscribe entirely unrestricted, down to `>`,
  #     `$JS.API.>` and another producer's `batch.>` traffic.
  #   - the `allow` key present with an empty list means NO RESTRICTION, identical to
  #     omitting the block. (Described rather than written out, because
  #     validate-obsidian-vault-nats-permissions.yaml counts occurrences of the grant text
  #     and a comment carrying it would count as another grant.)
  # `subscribe: { deny: [ ">" ] }` is the spelling that grants nothing, and is wrong for
  # every credential here -- all of them publish with acknowledgement.
  #
  # `<ROLE>` must match the `inbox_prefix` the producer's own client is configured with, and
  # that client lives in another repository. `.*.*` rather than `.>` because a reply inbox is
  # exactly three tokens; a tail wildcard would additionally let the holder open a catch-all
  # subscription across every connection sharing its prefix.
  PRODUCER_BATCH: {
    users: [
      { user: "batch-producer"
        password: $NATS_BATCH_PRODUCER_PASSWORD_HASH
        permissions: {
          publish:   { allow: [ "batch.>" ] }
          subscribe: { allow: [ "_INBOX_BATCH.*.*" ] }
        }
      }
    ]
    imports: [
      { service: { account: BRAIN_QUEUE, subject: "batch.>" } }
    ]
  }

  PRODUCER_PROMOTION: {
    users: [
      { user: "promotion-producer"
        password: $NATS_PROMOTION_PRODUCER_PASSWORD_HASH
        permissions: {
          publish:   { allow: [ "promotion.>" ] }
          subscribe: { allow: [ "_INBOX_PROMOTION.*.*" ] }
        }
      }
    ]
    imports: [
      { service: { account: BRAIN_QUEUE, subject: "promotion.>" } }
    ]
  }

  PRODUCER_DRIFT: {
    users: [
      { user: "drift-producer"
        password: $NATS_DRIFT_PRODUCER_PASSWORD_HASH
        permissions: {
          publish:   { allow: [ "drift.>" ] }
          subscribe: { allow: [ "_INBOX_DRIFT.*.*" ] }
        }
      }
    ]
    imports: [
      { service: { account: BRAIN_QUEUE, subject: "drift.>" } }
    ]
  }
}

system_account: SYS
