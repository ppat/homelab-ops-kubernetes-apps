---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- certificate.yaml
- deployment.yaml
- secrets.yaml
- service.yaml
- servicemonitor.yaml

configMapGenerator:
- name: obsidian-vault-nats-config
  namespace: ai
  files:
  - conf.d/nats-server.conf
  options:
    labels:
      app.kubernetes.io/name: obsidian-vault-nats
    annotations:
      # MANDATORY. Flux's post-build substitution expands bare `$NAME` as well as `${NAME}`,
      # and this config references five bcrypt hashes as bare `$NAME` environment variables
      # that only nats-server may resolve. Without this annotation every one of them is
      # substituted to an empty string and the server starts with five blank passwords -- a
      # silent, total loss of authentication.
      kustomize.toolkit.fluxcd.io/substitute: disabled
    # A stable name, for two reasons. Flux prune is disabled cluster-wide, so a
    # content-hashed name would strand the previous ConfigMap as an orphan on every edit to
    # the account topology. And the chainsaw suite asserts this ConfigMap's grant lines by
    # name -- against a hashed name it could only match by label, which is satisfied by ANY
    # matching ConfigMap, so a stranded correct orphan would mask a widened current one.
    # Rolling the pod on a config change is the Deployment's reloader annotation instead.
    disableNameSuffixHash: true

sortOptions:
  order: fifo
