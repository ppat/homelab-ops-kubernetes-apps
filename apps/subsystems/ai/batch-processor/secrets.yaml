---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-processor-secrets
  namespace: ai
spec:
  data:
  # The plaintext the broker's `batch_processor_password_hash` was derived from
  # (../obsidian-vault-nats/secrets.yaml). The one credential permitted to consume: it sits in the
  # account that holds the streams, which no producer is a member of (ppat/obsidian-tools ADR-0047).
  - secretKey: BATCH_PROCESSOR_NATS_PASSWORD
    remoteRef:
      key: obsidian_vault_nats_batch_processor_password
  # A LiteLLM virtual key that may reach `obsidian_ingestor_mcp` and nothing else. Which servers a
  # key may call is configured in the gateway's own store, not here (this module's README, "MCP tool
  # access control and boundary") -- an over-scoped key is not something reviewing this file catches.
  - secretKey: BATCH_MCP_API_KEY
    remoteRef:
      key: apikey_litellm_batch_processor
  - secretKey: BATCH_GATEWAY_ADMIN_KEY
    remoteRef:
      key: litellm_master_key
  # The agent-facing handle itself -- the key a batch run blocks for its duration, shared by every
  # interactive writer (ppat/obsidian-tools ADR-0003). Which LiteLLM key that is, is a gateway-side
  # fact this repository cannot see.
  - secretKey: BATCH_AGENT_HANDLE_KEY
    remoteRef:
      key: litellm_obsidian_agent_handle_key
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
---
# The watchdog's own, holding the two handle keys and nothing else: it must be able to run when
# `batch-processor` cannot (./watchdog.yaml), which it would not be if it depended on the broker
# credential or the vault write key above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batch-mode-watchdog-secrets
  namespace: ai
spec:
  data:
  - secretKey: BATCH_GATEWAY_ADMIN_KEY
    remoteRef:
      key: litellm_master_key
  - secretKey: BATCH_AGENT_HANDLE_KEY
    remoteRef:
      key: litellm_obsidian_agent_handle_key
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
