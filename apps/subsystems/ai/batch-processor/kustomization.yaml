---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- secrets.yaml
- stream-provisioner.yaml
- cronjob.yaml
- watchdog.yaml

configMapGenerator:
- name: batch-streams
  namespace: ai
  files:
  - streams/batch.json
  - streams/batch-dead-letter.json
  options:
    labels:
      app.kubernetes.io/name: batch-stream-provisioner
    # Flux prune is disabled cluster-wide, so a content-hashed name would strand the previous
    # ConfigMap as an orphan on every edit to a stream definition. Each provisioner run reads the
    # ConfigMap fresh, so there is nothing to roll.
    disableNameSuffixHash: true

sortOptions:
  order: fifo
