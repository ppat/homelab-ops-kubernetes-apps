---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-obsidian-agent-secrets
  namespace: obsidian-brain
spec:
  data:
  # Same Local REST API bearer token the obsidian pod pins. This pod spends it on every
  # caller's behalf, which is why the listener in front of it is authenticated.
  - secretKey: OBSIDIAN_API_KEY
    remoteRef:
      key: obsidian_rest_api_key
  # Shared secret this instance verifies incoming JWTs against; >=32 characters. Held
  # separately from the ingestor's so a leaked agent token cannot be replayed against the
  # wider-scoped instance -- which is the same reason there are two instances at all.
  - secretKey: MCP_AUTH_SECRET_KEY
    remoteRef:
      key: obsidian_agent_mcp_auth_secret
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
