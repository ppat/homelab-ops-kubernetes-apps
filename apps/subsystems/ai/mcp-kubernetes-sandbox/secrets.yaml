---
# PROVISIONAL key name, pending ppat/homelab-ops-kubernetes-experiments#225 (the relay
# that gets the sandbox's agent-admin kubeconfig from its own guest etcd out to
# Bitwarden -- owned by a separate change, not this one). "kubeconfig_sandbox_mcp"
# follows this sibling directory's own single-blob convention (kubeconfig_nas_mcp,
# ../mcp-kubernetes-nas/secrets.yaml) rather than the split-key naming
# (sandbox_talos_vm_agent_admin_token / _ca_crt) the sandbox-talos module's own README
# worked out on the producer side: kubernetes-mcp-server wants a kubeconfig *file*, and
# the assembled kubeconfig that module's provisioning CronJob already writes
# (provision-agent-admin-cronjob.yaml, kube-system/agent-admin-kubeconfig's own
# "kubeconfig" field) needs no templating to become this key's value as-is, unlike the
# split fields, which would need assembling into a kubeconfig on the way down here (the
# shape ../mcp-grafana/secrets.yaml already uses for its own generator token, if
# split keys turn out to be the direction the relay settles on instead). Reconcile this
# key name with whichever shape the relay actually lands on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-kubernetes-sandbox-secrets
  namespace: ai
spec:
  data:
  - secretKey: kubeconfig
    remoteRef:
      key: kubeconfig_sandbox_mcp
  # Shorter than this sibling's mcp-kubernetes-nas (24h): the sandbox-talos module's own
  # README ("Staleness window and token lifetime") recommends 600s specifically for
  # whatever pulls this credential down in ai/coder, to keep the outage window after a
  # weekly sandbox reset (ppat/homelab-ops-kubernetes-experiments#227) to roughly
  # push-interval-plus-pull-interval (~20 minutes) rather than up to a day. The
  # Deployment's secret.reloader.stakater.com/reload annotation (deployment.yaml) still
  # does the actual restart once this Secret's content changes.
  refreshInterval: 600s
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
