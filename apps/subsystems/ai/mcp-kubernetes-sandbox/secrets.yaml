---
# "sandbox_talos_vm_agent_admin_kubeconfig" is written by the credential relay,
# ppat/homelab-ops-kubernetes-experiments#230, which owns this key's name and shape: a
# single blob, a complete kubeconfig document with certificate-authority-data embedded,
# server: https://talos-vm.sandbox-talos.svc.cluster.local:6443, one user "agent-admin"
# holding the bound token, current-context: agent-admin. That producer module already
# groups its Bitwarden entries under a "sandbox_talos_vm_*" prefix
# (sandbox_talos_vm_talosconfig, sandbox_talos_vm_machine_config), so this key follows
# suit rather than this sibling directory's own kubeconfig_nas_mcp convention -- that
# precedent has no producer module of its own (placed by hand), so it doesn't apply here
# the way it would if this key were also hand-placed. No templating needed: the value is
# already the file kubernetes-mcp-server's kubeconfig option wants, as-is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-kubernetes-sandbox-secrets
  namespace: ai
spec:
  data:
  - secretKey: kubeconfig
    remoteRef:
      key: sandbox_talos_vm_agent_admin_kubeconfig
  # Shorter than this sibling's mcp-kubernetes-nas (24h): the sandbox-talos module's own
  # README ("Staleness window and token lifetime") recommends 600s specifically for
  # whatever pulls this credential down in ai/coder, to keep the outage window after a
  # weekly sandbox reset (ppat/homelab-ops-kubernetes-experiments#227) to roughly
  # push-interval-plus-pull-interval (~20 minutes) rather than up to a day. The
  # Deployment's secret.reloader.stakater.com/reload annotation (deployment.yaml) still
  # does the actual restart once this Secret's content changes.
  refreshInterval: 600s
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
