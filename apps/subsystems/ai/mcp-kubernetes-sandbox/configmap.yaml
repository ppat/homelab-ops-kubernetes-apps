---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes-sandbox-config
  namespace: ai
data:
  config.toml: |
    # read_only = false is the entire point of this server: it's the write-capable
    # counterpart to mcp-kubernetes-homelab/mcp-kubernetes-nas (both read_only = true).
    # denied_resources below is kept regardless -- write capability is not a reason to
    # widen reads.
    read_only = false
    cluster_provider_strategy = "kubeconfig"
    kubeconfig = "/etc/mcp-kubernetes-sandbox/kubeconfig"
    toolsets = ["core"]

    # Both kubeconfig and cluster_provider_strategy are required -- setting the
    # strategy alone still loses to in-cluster detection (upstream
    # docs/configuration.md "Cross-Cluster Access from a Pod").
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
