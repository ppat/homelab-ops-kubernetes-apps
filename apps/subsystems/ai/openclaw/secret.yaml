---
# This ExternalSecret holds only the universal openclaw secrets (gateway auth, LiteLLM key) --
# the ones every consuming cluster needs regardless of which channels/features it enables.
# Feature-coupled secrets (hooks token, WhatsApp owner number) are cluster-owned and come from
# a cluster-provided `openclaw-config-secrets` ExternalSecret co-located with the
# cluster-owned `openclaw.json` (see the Deployment's env for how both secrets are consumed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: openclaw
spec:
  data:
  - secretKey: OPENCLAW_GATEWAY_TOKEN
    remoteRef:
      key: openclaw_gateway_token
  - secretKey: LITELLM_KEY
    remoteRef:
      key: apikey_litellm_openclaw
  refreshInterval: 24h
  secretStoreRef:
    name: ${secret_store}
    kind: ClusterSecretStore
