---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
  annotations:
    secret.reloader.stakater.com/reload: openclaw-secrets,openclaw-config-secrets
    configmap.reloader.stakater.com/reload: openclaw-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      # hostUsers: false omitted — CI kind runtime lacks userns support (runc fails to mount
      # sysfs into the pod's user namespace: "operation not permitted"). Evaluate enabling at
      # rollout if the cluster's containerd/runc supports idmapped mounts (GA since k8s 1.33).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Default (Always) makes the kubelet recursively re-apply fsGroup perms to the whole PVC
        # on every mount -- re-loosening the state perms the entrypoint just tightened, and
        # recursively chmod'ing the (large, lancedb/npm-bearing) volume on every restart.
        # OnRootMismatch skips that recursion once the volume root already matches, so mounts are
        # faster and it stops fighting the entrypoint's re-tighten. It doesn't retroactively fix
        # already-loosened files -- the image entrypoint's chmod (see image comment above) handles
        # that on each boot.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openclaw
        # This build's entrypoint adds a per-boot chmod that re-tightens the fsGroup-loosened
        # state perms: credentials dir -> 700, auth SQLite + sessions.json -> 600 (ppat/images#533).
        image: docker.io/ppatlabs/openclaw:2026.7.1@sha256:77545a820d181d28266ad63c7f41ac3d8152a6d55b7c02d98f708bdcd2b5c194
        imagePullPolicy: IfNotPresent
        env:
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_CONFIG_SEED
          value: /etc/openclaw-seed/openclaw.json
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONTROL_UI_ORIGIN
          value: https://openclaw.${domain_name}
        # This custom image (docker.io/ppatlabs/openclaw) bakes in the WhatsApp/Baileys channel
        # and diagnostics-prometheus plugins at build time; its own entrypoint reseeds them from
        # /home/node/.openclaw-seed into the PVC-mounted /home/node/.openclaw on every start --
        # do not override command/args/entrypoint. The official :slim/:plain/:browser tags don't
        # bundle either plugin and instead try to `npm install` them at gateway startup, which
        # fails under readOnlyRootFilesystem + no cluster egress and is treated as a FATAL
        # startup migration for a *configured-channel* plugin -> CrashLoopBackOff.
        # OPENCLAW_OFFLINE=1 is kept as defense-in-depth: no runtime plugin/tool fetch is needed
        # since the plugins are already baked in and reseeded locally.
        # The entrypoint wrapper also seeds OPENCLAW_CONFIG_PATH from OPENCLAW_CONFIG_SEED
        # (copy-if-absent + chmod 600) and sets umask 077 before starting the gateway -- still
        # do not override command/args/entrypoint.
        - name: OPENCLAW_OFFLINE
          value: "1"
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: OPENCLAW_GATEWAY_TOKEN
        - name: LITELLM_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: LITELLM_KEY
        - name: OPENCLAW_HOOKS_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-config-secrets
              key: OPENCLAW_HOOKS_TOKEN
        - name: OWNER_WHATSAPP_NUMBER
          valueFrom:
            secretKeyRef:
              name: openclaw-config-secrets
              key: OWNER_WHATSAPP_NUMBER
        ports:
        - name: gateway
          containerPort: 18789
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: gateway
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: gateway
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: gateway
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # /etc/openclaw is the gateway's config dir AND where the image writes at boot: it
        # mkdirs /etc/openclaw/extensions and drops openclaw.json.bak backups there. A read-only
        # ConfigMap mount makes that mkdir fail ("ENOENT ... mkdir '/etc/openclaw/extensions'")
        # and the CLI aborts before serving /healthz. So the dir is a writable emptyDir; the
        # entrypoint wrapper seeds OPENCLAW_CONFIG_PATH into it from the read-only
        # OPENCLAW_CONFIG_SEED mount below (copy-if-absent, chmod 600), so reloader still
        # restarts the pod to pick up config changes.
        - name: config-dir
          mountPath: /etc/openclaw
        - name: config
          mountPath: /etc/openclaw-seed
          readOnly: true
        - name: openclaw-data
          mountPath: /home/node/.openclaw
        - name: tmp
          mountPath: /tmp
      - name: code-server
        args: [
          "--auth", "none",
          "--user-data-dir", "/home/coder/.vscode",
          "--extensions-dir", "/home/coder/.vscode",
          "--port", "8080",
          "--disable-telemetry",
          "/etc/openclaw"
        ]
        image: ghcr.io/coder/code-server:4.128.0@sha256:bd4a3a022ff016954bf9ae6ea0bce6c7eef96a69da4d2fe34552638f32d4820c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        ports:
        - name: code-server
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        # code-server's own $HOME (extensions, settings) -- same subPath-on-the-app's-own-PVC
        # convention as home-assistant's code-server sidecar.
        - mountPath: /home/coder
          name: openclaw-data
          subPath: .coder
        - mountPath: /home/node/.openclaw
          name: openclaw-data
        - mountPath: /etc/openclaw
          name: config-dir
      volumes:
      - name: config-dir
        emptyDir: {}
      # openclaw.json is cluster-owned (feature config: WhatsApp allowlist, MCP servers, model
      # routing, etc.) -- this ConfigMap is supplied externally by the consuming cluster; this
      # module's own CI supplies a fixture (ci/test/apps-ai/pre-requisites/openclaw-config.yaml).
      - name: config
        configMap:
          name: openclaw-config
      # Cluster-provided (CI: a fixture PVC) -- see the ConfigMap comment above.
      - name: openclaw-data
        persistentVolumeClaim:
          claimName: openclaw-data
      - name: tmp
        emptyDir: {}
