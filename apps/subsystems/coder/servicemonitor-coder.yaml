---
# Scrapes coderd's Prometheus metrics via the coder-metrics Service (service-coder-
# metrics.yaml). CODER_PROMETHEUS_ENABLE and CODER_PROMETHEUS_COLLECT_AGENT_STATS in
# helm-release-coder.yaml already turn these on at the source; without this
# ServiceMonitor nothing ever scraped the port. No `release:` label is needed to be
# picked up - kube-prometheus-stack's serviceMonitorSelectorNilUsesHelmValues is false
# (see kube-prometheus-stack/helm-release-kube-prometheus-stack.yaml), so Prometheus
# selects every ServiceMonitor in the cluster regardless of label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coder
  namespace: coder
  labels:
    app.kubernetes.io/name: coder
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coder
      app.kubernetes.io/component: metrics
  endpoints:
  - port: prometheus-http
    interval: 30s
    path: /metrics
