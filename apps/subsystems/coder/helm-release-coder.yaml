---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder-release
  namespace: coder
spec:
  chart:
    spec:
      chart: coder
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: coder-repository
        namespace: flux-system
      version: 2.36.4
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: coder
  targetNamespace: coder
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      ignoreTestFailures: false
      retries: 3
      strategy: rollback
  values:
    coder:
      annotations:
        secret.reloader.stakater.com/reload: "${db_name:=coder-db}-${db_suffix_current:=default}-app,coder-sso-credentials"
      env:
      - name: CODER_ACCESS_URL
        value: "https://coder.${domain_name}"
      - name: CODER_PG_CONNECTION_URL
        valueFrom:
          secretKeyRef:
            name: ${db_name:=coder-db}-${db_suffix_current:=default}-app
            key: uri
      - name: CODER_PROMETHEUS_ENABLE
        value: "true"
      - name: CODER_PROMETHEUS_COLLECT_AGENT_STATS
        value: "true"
      - name: CODER_PROXY_TRUSTED_HEADERS
        value: "X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto"
      - name: CODER_EXPERIMENTS
        value: "*"
      - name: CODER_TELEMETRY_ENABLE
        value: "false"
      - name: CODER_ENABLE_TERRAFORM_DEBUG_MODE
        value: "false"
      ingress:
        enable: false
      # provisionerd resolves its provisioning binary purely by LookPath("terraform")
      # on the coderd pod - no config surface exists to point it at a differently
      # named binary (see ppat/coder#897, which does the same thing against this
      # image's bundled Terraform in a disposable test control plane). This
      # cluster's containerd (2.3.2-k3s2) only supports directory-level subPath on
      # Kubernetes image volumes, not file-level ("ImageVolumeMountFailed: ... only
      # directory subpath is supported"), and a directory-level mount here would
      # replace the whole /usr/local/bin with the OpenTofu image's own, which names
      # the binary `tofu`, not `terraform` - so an image volume can't deliver a file
      # named `terraform` directly. The init container below instead sources the
      # binary from the official OpenTofu image and copies (and renames) it into a
      # plain emptyDir, whose file-level subPath support is universal.
      initContainers:
      - name: opentofu-binary
        image: "ghcr.io/opentofu/opentofu:1.12.6"
        command:
        - sh
        - -c
        - cp "$(command -v tofu)" /opentofu-binary/terraform
        volumeMounts:
        - name: opentofu-binary
          mountPath: /opentofu-binary
      replicaCount: 1
      resources:
        requests:
          cpu: 32m
          memory: 256Mi
      service:
        type: ClusterIP
        externalTrafficPolicy: Local
      serviceAccount:
        workspacePerms: true
        enableDeployments: true
      volumeMounts:
      - name: opentofu-binary
        mountPath: /usr/local/bin/terraform
        subPath: terraform
        readOnly: true
      volumes:
      - name: opentofu-binary
        # Tracks the `opentofu` version pinned in ppat/coder's mise.toml (the
        # template authoring toolchain this is meant to track) - not
        # Renovate-managed, since Renovate's kubernetes manager only recognizes
        # image volumes on raw Pod/Deployment/etc. manifests, not values embedded
        # in a HelmRelease's `values:` blob, and this isn't an image volume anyway
        # (see the initContainers comment above). Bump the initContainer's image
        # tag by hand alongside that pin.
        emptyDir: {}
